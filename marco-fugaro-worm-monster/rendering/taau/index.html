<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAAU</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080c;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #aab0bd;
        font: 12px/1.4 system-ui, sans-serif;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }
    </style>
    <script src="../../utils/importmap.js"></script>
  </head>
  <body>
    <p id="hint">Rods thinner than a pixel, upscaled and steady · drag to orbit</p>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { mrt, output, pass, renderOutput, velocity } from 'three/tsl'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import GUI from 'lil-gui'
      import Stats from 'stats-gl'
      import { taau } from './TAAUNode.js'

      // ---- The stage the rendering examples share: a dark studio, a glossy floor, neon in three colours ----

      const NEON = ['#ff2e7e', '#25d9ff', '#ffaa2b'].map((hex) => new THREE.Color(hex))
      const DARK = '#07080c'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.AgXToneMapping
      renderer.shadowMap.enabled = true
      document.body.appendChild(renderer.domElement)
      await renderer.init()

      const stats = new Stats({ trackGPU: renderer.hasFeature('timestamp-query') })
      document.body.appendChild(stats.dom)
      stats.init(renderer)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(DARK)
      scene.fog = new THREE.Fog(DARK, 10, 24)

      // The environment: a dark room under a neon tube in each colour, which the glossy surfaces reflect.
      const studio = new THREE.Scene()
      studio.add(
        new THREE.Mesh(
          new THREE.BoxGeometry(16, 8, 16),
          new THREE.MeshBasicMaterial({ color: '#101218', side: THREE.BackSide }),
        ),
      )
      for (const [i, color] of NEON.entries()) {
        const tube = new THREE.Mesh(
          new THREE.BoxGeometry(6, 0.25, 0.25),
          new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(5) }),
        )
        tube.position.set(0, 3.5, (i - 1) * 2.5)
        studio.add(tube)
      }
      const pmrem = new THREE.PMREMGenerator(renderer)
      scene.environment = pmrem.fromScene(studio, 0.04).texture
      pmrem.dispose()

      const key = new THREE.DirectionalLight('#ffffff', 1.2)
      key.position.set(3, 8, 4)
      key.castShadow = true
      key.shadow.mapSize.setScalar(2048)
      key.shadow.camera.left = key.shadow.camera.bottom = -4
      key.shadow.camera.right = key.shadow.camera.top = 4
      key.shadow.camera.near = 1
      key.shadow.camera.far = 20
      key.shadow.bias = -0.0002 // a share of near to far: about 4 mm
      scene.add(key)

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(24, 96).rotateX(-Math.PI / 2),
        new THREE.MeshStandardNodeMaterial({ color: '#1a1d24', roughness: 0.3 }),
      )
      floor.receiveShadow = true
      const plinth = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.55, 0.16, 96).translate(0, 0.08, 0),
        new THREE.MeshStandardNodeMaterial({ color: '#1d2028', roughness: 0.45 }),
      )
      plinth.castShadow = plinth.receiveShadow = true
      scene.add(floor, plinth)

      // Unlit and brighter than white: what the effects light up.
      const neon = (color, intensity = 4) => new THREE.MeshBasicNodeMaterial({ color: color.clone().multiplyScalar(intensity) })

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60)
      camera.position.set(0, 2.1, 6)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1.1, 0)
      controls.enableDamping = true
      controls.minDistance = 3
      controls.maxDistance = 14
      controls.maxPolarAngle = THREE.MathUtils.degToRad(85)
      controls.update()

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // ---- TAAU: a hyperboloid of chrome and neon rods, thinner than a pixel ----

      // Straight rods from a base ring to a top ring, a third of a turn round: two families, crossed, pinch into a
      // hyperboloid. Each rod is an instance of one unit cylinder.
      const RING = 1
      const BASE = 0.24
      const TOP = 2.46
      const TWIST = (Math.PI * 2) / 3

      const sculpture = new THREE.Group()
      scene.add(sculpture)

      const chrome = new THREE.MeshStandardNodeMaterial({ color: '#ffffff', metalness: 1, roughness: 0.15 })
      const rodGeometry = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true)
      const from = new THREE.Vector3()
      const to = new THREE.Vector3()
      const up = new THREE.Vector3(0, 1, 0)
      const rotation = new THREE.Quaternion()
      const scale = new THREE.Vector3()
      const matrix = new THREE.Matrix4()

      function rods(material, thickness, twist, count, phase = 0) {
        const mesh = new THREE.InstancedMesh(rodGeometry, material, count)
        for (let i = 0; i < count; i++) {
          const angle = phase + (i / count) * Math.PI * 2
          from.set(Math.cos(angle) * RING, BASE, Math.sin(angle) * RING)
          to.set(Math.cos(angle + twist) * RING, TOP, Math.sin(angle + twist) * RING)
          const length = to.distanceTo(from)
          const direction = to.sub(from).normalize()
          rotation.setFromUnitVectors(up, direction)
          matrix.compose(from.addScaledVector(direction, length / 2), rotation, scale.set(thickness, length, thickness))
          mesh.setMatrixAt(i, matrix)
        }
        mesh.castShadow = true
        sculpture.add(mesh)
      }

      rods(chrome, 0.01, TWIST, 24)
      NEON.forEach((color, i) => rods(neon(color), 0.006, -TWIST, 8, (i / 24) * Math.PI * 2))

      for (const y of [BASE, TOP]) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(RING, 0.016, 8, 160).rotateX(Math.PI / 2), chrome)
        ring.position.y = y
        ring.castShadow = true
        sculpture.add(ring)
      }

      // Rendered jittered and below the output's resolution, without MSAA; TAAU resolves it at the output's.
      const params = { taau: true, resolution: 0.5, spin: 1 }
      const scenePass = pass(scene, camera, { samples: 0 })
      scenePass.setMRT(mrt({ output, velocity }))
      scenePass.setResolutionScale(params.resolution)
      const sceneColor = scenePass.getTextureNode('output')
      const taauNode = taau(sceneColor, scenePass.getTextureNode('depth'), scenePass.getTextureNode('velocity'), camera)

      // renderOutput() tone-maps either path the same. Off, the TAAU node leaves the graph, and with it the jitter.
      const pipeline = new THREE.RenderPipeline(renderer)
      pipeline.outputColorTransform = false
      function setOutput() {
        if (params.taau) taauNode.resetHistory() // the history is stale
        pipeline.outputNode = renderOutput(params.taau ? taauNode.getTextureNode() : sceneColor)
        pipeline.needsUpdate = true
      }
      setOutput()

      const gui = new GUI({ title: 'TAAU' })
      if (window.innerWidth < 600) gui.close()
      gui.add(params, 'taau').onChange(setOutput)
      gui.add(params, 'resolution', 0.25, 1, 0.05).onChange((value) => scenePass.setResolutionScale(value))
      gui.add(taauNode.maxAccumulation, 'value', 1, 32, 1).name('maxAccumulation')
      gui.add(params, 'spin', 0, 3, 0.01)

      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop((time) => {
        timer.update(time)
        sculpture.rotation.y += timer.getDelta() * params.spin * 0.15
        controls.update()
        pipeline.render()
        stats.update()
        renderer.resolveTimestampsAsync('render')
      })
    </script>
  </body>
</html>
