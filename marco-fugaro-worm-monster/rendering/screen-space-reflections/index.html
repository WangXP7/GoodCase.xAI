<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen-Space Reflections</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080c;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #aab0bd;
        font: 12px/1.4 system-ui, sans-serif;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }
    </style>
    <script src="../../utils/importmap.js"></script>
  </head>
  <body>
    <p id="hint">The floor mirrors what's on screen · drag to orbit</p>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { mrt, output, pass, rtt, velocity } from 'three/tsl'
      import { traa } from 'three/addons/tsl/display/TRAANode.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import GUI from 'lil-gui'
      import Stats from 'stats-gl'
      import { ssr, ssrComposite, ssrGBuffer } from './SSRNode.js'

      // ---- The stage the rendering examples share: a dark studio, a glossy floor, neon in three colours ----

      const NEON = ['#ff2e7e', '#25d9ff', '#ffaa2b'].map((hex) => new THREE.Color(hex))
      const DARK = '#07080c'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.AgXToneMapping
      renderer.shadowMap.enabled = true
      document.body.appendChild(renderer.domElement)
      await renderer.init()

      const stats = new Stats({ trackGPU: renderer.hasFeature('timestamp-query') })
      document.body.appendChild(stats.dom)
      stats.init(renderer)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(DARK)
      scene.fog = new THREE.Fog(DARK, 10, 24)

      // The environment: a dark room under a neon tube in each colour, which the glossy surfaces reflect.
      const studio = new THREE.Scene()
      studio.add(
        new THREE.Mesh(
          new THREE.BoxGeometry(16, 8, 16),
          new THREE.MeshBasicMaterial({ color: '#101218', side: THREE.BackSide }),
        ),
      )
      for (const [i, color] of NEON.entries()) {
        const tube = new THREE.Mesh(
          new THREE.BoxGeometry(6, 0.25, 0.25),
          new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(5) }),
        )
        tube.position.set(0, 3.5, (i - 1) * 2.5)
        studio.add(tube)
      }
      const pmrem = new THREE.PMREMGenerator(renderer)
      scene.environment = pmrem.fromScene(studio, 0.04).texture
      pmrem.dispose()

      const key = new THREE.DirectionalLight('#ffffff', 1.2)
      key.position.set(3, 8, 4)
      key.castShadow = true
      key.shadow.mapSize.setScalar(2048)
      key.shadow.camera.left = key.shadow.camera.bottom = -4
      key.shadow.camera.right = key.shadow.camera.top = 4
      key.shadow.camera.near = 1
      key.shadow.camera.far = 20
      key.shadow.bias = -0.0002 // a share of near to far: about 4 mm
      scene.add(key)

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(24, 96).rotateX(-Math.PI / 2),
        new THREE.MeshStandardNodeMaterial({ color: '#1a1d24', roughness: 0.3 }),
      )
      floor.receiveShadow = true
      const plinth = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.55, 0.16, 96).translate(0, 0.08, 0),
        new THREE.MeshStandardNodeMaterial({ color: '#1d2028', roughness: 0.45 }),
      )
      plinth.castShadow = plinth.receiveShadow = true
      scene.add(floor, plinth)

      // Unlit and brighter than white: what the effects light up.
      const neon = (color, intensity = 4) => new THREE.MeshBasicNodeMaterial({ color: color.clone().multiplyScalar(intensity) })

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60)
      camera.position.set(0, 2.1, 6)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1.1, 0)
      controls.enableDamping = true
      controls.minDistance = 3
      controls.maxDistance = 14
      controls.maxPolarAngle = THREE.MathUtils.degToRad(85)
      controls.update()

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // ---- Screen-space reflections: a colonnade of neon and lacquered shapes, mirrored in the floor ----

      // Behind the plinth, tall neon tubes whose reflections stretch across the floor.
      const tube = new THREE.CylinderGeometry(0.05, 0.05, 2.6, 16).translate(0, 1.3, 0)
      for (let i = 0; i < 7; i++) {
        const angle = Math.PI + (i - 3) * 0.42
        const pillar = new THREE.Mesh(tube, neon(NEON[i % 3]))
        pillar.position.set(Math.sin(angle) * 3.4, 0, Math.cos(angle) * 3.4)
        scene.add(pillar)
      }

      // On the plinth, lacquer: a dielectric that reflects by its Fresnel alone.
      const lacquer = (color) => new THREE.MeshStandardNodeMaterial({ color, roughness: 0.08 })
      const shapes = new THREE.Group()
      const geometries = [
        new THREE.SphereGeometry(0.36, 64, 32).translate(0, 0.36, 0),
        new THREE.TorusKnotGeometry(0.26, 0.09, 160, 24).translate(0, 0.62, 0),
        new THREE.BoxGeometry(0.5, 0.5, 0.5).translate(0, 0.25, 0),
      ]
      for (const [i, geometry] of geometries.entries()) {
        const shape = new THREE.Mesh(geometry, lacquer(NEON[i]))
        const angle = (i / 3) * Math.PI * 2
        shape.position.set(Math.sin(angle) * 0.75, 0.16, Math.cos(angle) * 0.75)
        shape.castShadow = shape.receiveShadow = true
        shapes.add(shape)
      }
      scene.add(shapes)

      const scenePass = pass(scene, camera, { samples: 0 })
      scenePass.setMRT(mrt({ output, velocity, ...ssrGBuffer() }))
      const velocityTexture = scenePass.getTexture('velocity')
      velocityTexture.type = THREE.HalfFloatType // RG16F
      velocityTexture.format = THREE.RGFormat
      const sceneColor = scenePass.getTextureNode()
      const sceneDepth = scenePass.getTextureNode('depth')
      const sceneVelocity = scenePass.getTextureNode('velocity')

      // Fades to the environment from roughness 0.35 to 0.6 (0.2 to 0.4 by default), so the floor and plinth reflect.
      const reflections = ssr(sceneColor, scenePass, { roughnessFadeStart: 0.35, roughnessCutoff: 0.6 })
      const composite = ssrComposite(sceneColor, reflections, scene.environment, {
        environmentIntensity: () => scene.environmentIntensity,
        environmentRotation: scene.environmentRotation,
      })

      // Both resolve through TRAA, so the switch changes only the reflections.
      const reflected = traa(
        rtt(composite, null, null, { type: THREE.HalfFloatType }),
        sceneDepth,
        sceneVelocity,
        camera,
      )
      const plain = traa(sceneColor, sceneDepth, sceneVelocity, camera)

      const params = { reflections: true }
      const pipeline = new THREE.RenderPipeline(renderer)
      function setOutput() {
        // The frames without the node leave its history stale.
        if (params.reflections) reflections.resetHistory()
        pipeline.outputNode = params.reflections ? reflected : plain
        pipeline.needsUpdate = true
      }
      setOutput()

      const gui = new GUI({ title: 'Screen-space reflections' })
      if (window.innerWidth < 600) gui.close()
      gui.add(params, 'reflections').onChange(setOutput)
      gui.add(floor.material, 'roughness', 0, 0.8, 0.01).name('floor roughness')
      gui.add(reflections.roughnessCutoff, 'value', 0, 1, 0.01).name('roughness cutoff')
      gui.add(reflections, 'glossy')

      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop((time) => {
        timer.update(time)
        shapes.rotation.y += timer.getDelta() * 0.2
        controls.update()
        pipeline.render()
        stats.update()
        renderer.resolveTimestampsAsync('render')
      })
    </script>
  </body>
</html>
