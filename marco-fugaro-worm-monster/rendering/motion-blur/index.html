<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion blur</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080c;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #aab0bd;
        font: 12px/1.4 system-ui, sans-serif;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }
    </style>
    <script src="../../utils/importmap.js"></script>
  </head>
  <body>
    <p id="hint">The spinning rotor streaks as an open shutter sees it · drag to orbit</p>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { mrt, output, pass, velocity } from 'three/tsl'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import GUI from 'lil-gui'
      import Stats from 'stats-gl'
      import { motionBlur } from './MotionBlurNode.js'

      // ---- The stage the rendering examples share: a dark studio, a glossy floor, neon in three colours ----

      const NEON = ['#ff2e7e', '#25d9ff', '#ffaa2b'].map((hex) => new THREE.Color(hex))
      const DARK = '#07080c'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.AgXToneMapping
      renderer.shadowMap.enabled = true
      document.body.appendChild(renderer.domElement)
      await renderer.init()

      const stats = new Stats({ trackGPU: renderer.hasFeature('timestamp-query') })
      document.body.appendChild(stats.dom)
      stats.init(renderer)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(DARK)
      scene.fog = new THREE.Fog(DARK, 10, 24)

      // The environment: a dark room under a neon tube in each colour, which the glossy surfaces reflect.
      const studio = new THREE.Scene()
      studio.add(
        new THREE.Mesh(
          new THREE.BoxGeometry(16, 8, 16),
          new THREE.MeshBasicMaterial({ color: '#101218', side: THREE.BackSide }),
        ),
      )
      for (const [i, color] of NEON.entries()) {
        const tube = new THREE.Mesh(
          new THREE.BoxGeometry(6, 0.25, 0.25),
          new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(5) }),
        )
        tube.position.set(0, 3.5, (i - 1) * 2.5)
        studio.add(tube)
      }
      const pmrem = new THREE.PMREMGenerator(renderer)
      scene.environment = pmrem.fromScene(studio, 0.04).texture
      pmrem.dispose()

      const key = new THREE.DirectionalLight('#ffffff', 1.2)
      key.position.set(3, 8, 4)
      key.castShadow = true
      key.shadow.mapSize.setScalar(2048)
      key.shadow.camera.left = key.shadow.camera.bottom = -4
      key.shadow.camera.right = key.shadow.camera.top = 4
      key.shadow.camera.near = 1
      key.shadow.camera.far = 20
      key.shadow.bias = -0.0002 // a share of near to far: about 4 mm
      scene.add(key)

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(24, 96).rotateX(-Math.PI / 2),
        new THREE.MeshStandardNodeMaterial({ color: '#1a1d24', roughness: 0.3 }),
      )
      floor.receiveShadow = true
      const plinth = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.55, 0.16, 96).translate(0, 0.08, 0),
        new THREE.MeshStandardNodeMaterial({ color: '#1d2028', roughness: 0.45 }),
      )
      plinth.castShadow = plinth.receiveShadow = true
      scene.add(floor, plinth)

      // Unlit and brighter than white: what the effects light up.
      const neon = (color, intensity = 4) => new THREE.MeshBasicNodeMaterial({ color: color.clone().multiplyScalar(intensity) })

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60)
      camera.position.set(0, 2.1, 6)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1.1, 0)
      controls.enableDamping = true
      controls.minDistance = 3
      controls.maxDistance = 14
      controls.maxPolarAngle = THREE.MathUtils.degToRad(85)
      controls.update()

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // ---- Motion blur: a rotor of neon-tipped arms, spinning fast round a still chrome hub ----

      const HUB_HEIGHT = 1.4
      const metal = new THREE.MeshStandardNodeMaterial({ color: '#b8bdc8', metalness: 0.4, roughness: 0.35 })

      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.06, HUB_HEIGHT, 24), metal)
      post.position.set(0, HUB_HEIGHT / 2, -0.12)
      const hub = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 48, 24),
        new THREE.MeshStandardNodeMaterial({ color: '#ffffff', metalness: 1, roughness: 0.12 }),
      )
      hub.position.set(0, HUB_HEIGHT, 0.04)
      post.castShadow = hub.castShadow = true
      scene.add(post, hub)

      // Six arms in the plane facing the camera, each with a neon tip: the tips draw arcs.
      const rotor = new THREE.Group()
      rotor.position.set(0, HUB_HEIGHT, 0)
      scene.add(rotor)
      const armGeometry = new THREE.BoxGeometry(1, 0.04, 0.04).translate(0.5, 0, 0)
      const tipGeometry = new THREE.SphereGeometry(0.075, 24, 12)
      for (let i = 0; i < 6; i++) {
        const arm = new THREE.Group()
        arm.rotation.z = (i / 6) * Math.PI * 2
        const bar = new THREE.Mesh(armGeometry, metal)
        const tip = new THREE.Mesh(tipGeometry, neon(NEON[i % NEON.length]))
        tip.position.x = 1.05
        bar.castShadow = tip.castShadow = true
        arm.add(bar, tip)
        rotor.add(arm)
      }

      const scenePass = pass(scene, camera)
      scenePass.setMRT(mrt({ output, velocity }))
      const velocityTexture = scenePass.getTexture('velocity') // RG16F
      velocityTexture.type = THREE.HalfFloatType
      velocityTexture.format = THREE.RGFormat
      const sceneColor = scenePass.getTextureNode('output')
      const blurred = motionBlur(sceneColor, scenePass.getTextureNode('depth'), camera, {
        velocityNode: scenePass.getTextureNode('velocity'),
        shutterAngle: 180,
      })

      const params = { blur: true, spin: 3 } // spin: turns per second
      const pipeline = new THREE.RenderPipeline(renderer)
      function setOutput() {
        pipeline.outputNode = params.blur ? blurred : sceneColor
        if (params.blur) blurred.resetHistory() // back in the output graph: its history is stale
        pipeline.needsUpdate = true
      }
      setOutput()

      controls.autoRotateSpeed = 10 // a turn in 6 s

      const gui = new GUI({ title: 'Motion blur' })
      if (window.innerWidth < 600) gui.close()
      gui.add(params, 'blur').onChange(setOutput)
      gui.add(blurred, 'shutterAngle', 0, 360, 1)
      gui.add(blurred.samples, 'value', 2, 64, 2).name('samples')
      gui.add(params, 'spin', 0, 5, 0.01)
      gui.add(controls, 'autoRotate').name('orbit')

      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop((time) => {
        timer.update(time)
        const delta = timer.getDelta()
        rotor.rotation.z -= delta * params.spin * Math.PI * 2
        controls.update(delta)
        pipeline.render()
        stats.update()
        renderer.resolveTimestampsAsync('render')
      })
    </script>
  </body>
</html>
