<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端视口：禁双击缩放、覆盖刘海屏安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1512" />
  <title>檐下 · UNDER THE EAVES</title>
  <!-- 内联 SVG favicon（鼠尾草绿底 + 米白猫头轮廓），
       避免浏览器默认请求 /favicon.ico 得到 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237A8B6E'/%3E%3Cpath d='M9 14l1.6-5.2 4.1 3.1h2.6l4.1-3.1L23 14v5.4A5.6 5.6 0 0 1 17.4 25h-2.8A5.6 5.6 0 0 1 9 19.4z' fill='%23F5EDE0'/%3E%3C/svg%3E" />

  <!-- 固定版本锁定：所有 'three' / 'three/addons/' 解析到本地 vendor，零 CDN 依赖 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/lib/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --bg: #1a1512;
      --warm: #e8b894;
      --warm-soft: #f0d8a8;
      --ink: #efe6d8;
      --ink-dim: #b9a892;
      --panel: rgba(34, 27, 22, 0.82);
      --panel-line: rgba(232, 184, 148, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;               /* 全屏画布，禁止滚动 */
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;             /* 避免移动端手势干扰拾取 */
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* UI 覆盖层：本身不拦截事件，子元素按需开启 */
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ---------- 加载态 ---------- */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background:
        radial-gradient(120% 90% at 50% 35%, #2a2018 0%, #1a1512 60%, #120d0a 100%);
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .breath {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, var(--warm-soft), var(--warm) 60%, #b07f56 100%);
      box-shadow: 0 0 28px rgba(232, 184, 148, 0.5);
      animation: breath 2.6s ease-in-out infinite;
    }
    #loading .tip {
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
    }
    @keyframes breath {
      0%, 100% { transform: scale(1);   opacity: 0.82; }
      50%      { transform: scale(1.10); opacity: 1; }
    }

    /* ---------- WebGL2 不可用升级页 ---------- */
    #upgrade {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
      background:
        radial-gradient(120% 90% at 50% 35%, #2a2018 0%, #1a1512 60%, #120d0a 100%);
    }
    #upgrade.show { display: flex; }
    #upgrade h1 { font-weight: 600; letter-spacing: 0.08em; margin: 0; }
    #upgrade p { color: var(--ink-dim); max-width: 28rem; line-height: 1.7; margin: 0; }

    /* ---------- 错误横幅（不白屏） ---------- */
    #error-banner {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 50;
      max-width: 90vw;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      background: rgba(60, 30, 24, 0.92);
      color: #ffe3d4;
      border: 1px solid rgba(255, 150, 120, 0.35);
      font-size: 0.82rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #error-banner.show { opacity: 1; }

    /* ---------- HUD（默认全隐，召唤后浮现） ---------- */
    .hud { position: absolute; inset: 0; }
    .hud-summon {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--panel-line);
      background: var(--panel);
      pointer-events: auto;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .hud-summon-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--warm);
      box-shadow: 0 0 10px rgba(232,184,148,0.6);
    }
    .hud-panel, .hud-settings {
      position: absolute;
      right: 14px; bottom: 62px;
      width: 230px;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      backdrop-filter: blur(6px);
      pointer-events: auto;
      color: var(--ink);
      font-size: 0.84rem;
      line-height: 1.6;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .hud-panel[hidden], .hud-settings[hidden] { display: none; }
    .hud-clock { font-size: 1.35rem; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
    .hud-slot { color: var(--ink-dim); margin-left: 0.5rem; }
    .hud-row { display: flex; justify-content: space-between; gap: 0.6rem; }
    .hud-k { color: var(--ink-dim); }
    .hud-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
    .hud-btn {
      flex: 1; padding: 0.4rem 0.5rem;
      border-radius: 9px; border: 1px solid var(--panel-line);
      background: rgba(232,184,148,0.08); color: var(--ink);
      cursor: pointer; font-size: 0.8rem;
    }
    .hud-btn:hover { background: rgba(232,184,148,0.16); }
    .hud-danger { color: #ffb59c; }
    .hud-seg { display: flex; gap: 0.3rem; }
    .hud-segbtn {
      flex: 1; padding: 0.35rem; border-radius: 8px;
      border: 1px solid var(--panel-line); background: transparent; color: var(--ink-dim);
      cursor: pointer; font-size: 0.76rem;
    }
    .hud-segbtn.is-on { background: rgba(232,184,148,0.16); color: var(--ink); }
    .hud-toast {
      position: absolute;
      left: 50%; bottom: 24px; transform: translateX(-50%) translateY(6px);
      padding: 0.55rem 1.1rem; border-radius: 999px;
      background: rgba(34,27,22,0.9); border: 1px solid var(--panel-line);
      color: var(--ink); font-size: 0.9rem; letter-spacing: 0.04em;
      opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none; max-width: 80vw; text-align: center;
    }
    .hud-toast.is-in { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- 日记 ---------- */
    .diary { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .diary[hidden] { display: none; }
    .diary-scrim { position: absolute; inset: 0; background: rgba(10,8,6,0.55); }
    .diary-sheet {
      position: relative;
      width: min(440px, 88vw);
      max-height: 80vh; overflow: auto;
      padding: 1.3rem 1.4rem;
      border-radius: 16px;
      background: linear-gradient(180deg, #2c221a, #211a14);
      border: 1px solid var(--panel-line);
      pointer-events: auto;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .diary.is-in .diary-sheet { opacity: 1; transform: translateY(0); }
    .diary-title { font-size: 1.05rem; letter-spacing: 0.06em; }
    .diary-sub { display: block; color: var(--ink-dim); font-size: 0.8rem; margin-top: 0.2rem; }
    .diary-card { margin-top: 0.9rem; }
    .diary-meta { display: flex; gap: 0.7rem; color: var(--ink-dim); font-size: 0.78rem; }
    .diary-behavior { margin: 0.5rem 0; color: var(--warm-soft); }
    .diary-lines p { margin: 0.35rem 0; line-height: 1.7; color: var(--ink); }
    .diary-foot { display: flex; align-items: center; gap: 0.8rem; margin-top: 1rem; }
    .diary-nav, .diary-close {
      padding: 0.4rem 0.8rem; border-radius: 9px;
      border: 1px solid var(--panel-line); background: rgba(232,184,148,0.08);
      color: var(--ink); cursor: pointer; font-size: 0.82rem;
    }
    .diary-pos { color: var(--ink-dim); font-size: 0.8rem; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui"></div>

  <div id="loading">
    <div class="breath"></div>
    <div class="tip">檐下 · 正在醒来…</div>
  </div>

  <div id="upgrade">
    <h1>需要更新的浏览器</h1>
    <p>《檐下》需要支持 WebGL2 的现代浏览器才能运行。请升级到最新版本的 Chrome / Edge / Firefox / Safari，或换一台设备再来陪它。</p>
  </div>

  <div id="error-banner"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
