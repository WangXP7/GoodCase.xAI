<style>
/* =====================================================================
 * TIDELINE · 样式
 * HUD 与全部菜单走 DOM（ADR-001 §2.3）：屏幕阅读器可读、浏览器缩放可用、
 * 中文子集化免费。CRT 观感由 #crtOverlay 的 CSS 扫描线 + 暗角补偿。
 * ===================================================================== */
:root{
  --black:#0A0E17; --deep:#16213A; --deep2:#1B2E52; --slate:#2E3E54;
  --pale:#C7CFD8; --white:#F2F5F8; --amber:#FF8A3D; --blood:#FF3B3B;
  --magenta:#FF2E88; --cyan:#00C2FF;
  --accent:var(--white);
  --hud-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; background:var(--black); overflow:hidden;}
body{font-family:var(--hud-font); color:var(--white); -webkit-font-smoothing:none;}

#fit{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--black);}
#stage{position:relative; width:1440px; height:864px; flex:0 0 auto;
  transform-origin:50% 50%; background:#000; overflow:hidden;}
#gl{position:absolute; inset:0; width:1440px; height:864px; display:block;
  image-rendering:pixelated; image-rendering:crisp-edges;}

/* ---- CRT 补偿层（盖在 canvas 与 DOM 之上，ADR-001 §2.3） ---- */
#crtOverlay{position:absolute; inset:0; pointer-events:none; z-index:60;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 2px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%);
  mix-blend-mode:multiply;}
html.no-crt #crtOverlay{background:none;}

/* ============================ HUD ============================ */
#hud{position:absolute; inset:0; z-index:20; pointer-events:none;
  padding:26px 40px; font-size:16px; letter-spacing:.02em;}
.hud-top{display:flex; align-items:flex-start; justify-content:space-between; gap:24px;}
.label{font-size:12px; color:var(--pale); opacity:.75; letter-spacing:.14em;}
.big{font-size:40px; line-height:1.05; font-weight:700; color:var(--accent);}
.sub{font-size:14px; color:var(--amber);}

.score-box{min-width:240px;}
.score-box .big{text-shadow:0 0 0 transparent;}

.alarm-box{flex:1; max-width:520px;}
.alarm-head{display:flex; align-items:baseline; gap:12px; margin-bottom:6px;}
#tierName{font-size:14px; color:var(--accent); border:2px solid var(--accent); padding:1px 8px;}
#alarmNum{font-size:20px; font-weight:700; margin-left:auto; color:var(--accent);}
.bar{position:relative; height:22px; border:2px solid var(--pale); background:rgba(10,14,23,.72); overflow:hidden;}
.fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent);}
/* 刻度形状 = ALARM 等级的第二通道（去色后仍可辨） */
.tick{position:absolute; top:0; bottom:0; width:3px; background:var(--black);}
.tick.mini{height:9px; bottom:auto; opacity:.7;}

.right-box{min-width:200px; text-align:right;}
.pips{display:flex; gap:6px; justify-content:flex-end; margin:4px 0 12px;}
.pip{width:30px; height:18px; border:2px solid var(--pale); background:transparent;}
.pip.on{background:var(--accent);}
.pip.low{animation:none;}

/* COMBO / 区域 / 提示 */
#comboBox{position:absolute; left:40px; top:190px; font-size:22px; font-weight:700; color:var(--cyan);}
#comboBox small{display:block; font-size:12px; font-weight:400; color:var(--pale); opacity:.7;}
#zoneBox{position:absolute; left:40px; bottom:34px; font-size:14px; color:var(--pale); opacity:.8;}
#hintBox{position:absolute; left:40px; bottom:60px; font-size:13px; color:var(--pale); opacity:.55; max-width:520px; line-height:1.6;}
#toasts{position:absolute; left:50%; top:96px; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:5px;}
.toast{font-size:15px; padding:3px 12px; background:rgba(10,14,23,.82); border-left:4px solid var(--amber); color:var(--white);}
#prompt{position:absolute; left:50%; top:118px; transform:translateX(-50%);
  font-size:30px; font-weight:700; color:var(--amber); text-align:center; letter-spacing:.06em;}
#prompt small{display:block; font-size:15px; font-weight:400; color:var(--white); margin-top:4px;}
#bankBar{position:absolute; left:50%; top:200px; transform:translateX(-50%);
  width:260px; height:12px; border:2px solid var(--cyan); display:none;}
#bankBar i{display:block; height:100%; width:0%; background:var(--cyan);}

/* ============================ 屏幕 ============================ */
#screens{position:absolute; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; background:rgba(10,14,23,.88);}
#screens.show{display:flex;}
.panel{width:900px; max-width:92%; border:4px solid var(--pale); background:var(--black);
  padding:34px 40px; pointer-events:auto;}
.panel h1{font-size:56px; letter-spacing:.10em; margin-bottom:6px; color:var(--white);}
.panel h2{font-size:30px; margin-bottom:14px; color:var(--amber);}
.panel .tag{font-size:14px; color:var(--pale); opacity:.7; margin-bottom:22px; letter-spacing:.18em;}
.panel p{font-size:15px; line-height:1.9; color:var(--pale);}
.panel .rows{margin:18px 0; font-size:16px; line-height:2.0;}
.panel .rows div{display:flex; justify-content:space-between; border-bottom:1px solid rgba(199,207,216,.22); padding:2px 0;}
.panel .rows b{color:var(--white);}
.panel .rows .loss{color:var(--blood);}
.keys{display:grid; grid-template-columns:130px 1fr; gap:6px 16px; font-size:15px; margin:16px 0 22px; color:var(--pale);}
.keys b{color:var(--white);}
.btnrow{display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;}
button{font-family:var(--hud-font); font-size:17px; font-weight:700; letter-spacing:.08em;
  padding:12px 26px; background:transparent; color:var(--white);
  border:3px solid var(--pale); cursor:pointer; pointer-events:auto;}
button:hover,button:focus-visible{background:var(--pale); color:var(--black); outline:none;}
button.primary{border-color:var(--amber); color:var(--amber);}
button.primary:hover,button.primary:focus-visible{background:var(--amber); color:var(--black);}

/* 选项 */
.opts{display:grid; grid-template-columns:repeat(2,1fr); gap:8px 26px; margin:8px 0 4px;}
.opt{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--pale); cursor:pointer;
  padding:5px 0; user-select:none;}
.opt input{width:20px; height:20px; accent-color:var(--amber); cursor:pointer;}
.opt select{font-family:var(--hud-font); font-size:14px; background:var(--black); color:var(--white);
  border:2px solid var(--pale); padding:3px 6px;}
.note{font-size:12px; color:var(--pale); opacity:.6; margin-top:12px; line-height:1.7;}

/* 色盲模式：血红→电光蓝，琥珀→金。两条路径灰度化后均为单调亮度序列 */
html.cb{ --blood:#00C2FF; --amber:#FFD23F; }
/* 关闭「闪烁」→ 所有脉动改常亮（不应出现无反馈死区） */
html.no-flash .pip.low{opacity:1;}
html.no-flash #prompt{animation:none !important;}
/* prefers-reduced-motion：自动降级 */
html.rm #prompt{animation:none !important;}
html.rm .toast{transition:none;}

/* 危险状态提示（形态 + 文字，颜色只是第三通道） */
#dangerEdge{position:absolute; inset:0; pointer-events:none; z-index:40; display:none;
  box-shadow:inset 0 0 0 6px var(--blood); opacity:.55;}
#dangerEdge.on{display:block;}

#rotate{position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
  background:var(--black); color:var(--white); font-size:20px; text-align:center; padding:40px;}
@media (orientation:portrait) and (max-width:900px){ #rotate{display:flex;} }
</style>

<script>
/* ===== src/core/constants.js ===== */
/* =====================================================================
 * TIDELINE · constants.js
 * 全项目唯一真源。禁止在别处硬编码任何数值。
 *
 * 单位约定（ADR-002 三层空间模型）：
 *   DESIGN px : 设计空间 1440x864，所有游戏逻辑数值的单位
 *   ART px    : 艺术网格 720x432(=RT_WORLD)，1 art px = 2 design px
 * 本文件所有数值除非注明，均为 DESIGN px / 秒 / 弧度制外的角度。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});

  /* ---------- L0/L1/L2 空间（ADR-002 §6 常量表） ---------- */
  var DESIGN_W = 1440, DESIGN_H = 864, ART_SCALE = 2;

  var C = {
    VERSION: '0.1.0',
    RUN_SECONDS: 120,
    COLLECT: { COUNT: 8, RADIUS: 46, SCORE: [10, 20, 30] },
    FLASH_GAP: 0.51,
    FLASH_DUR: 0.45,
    DESIGN_W: DESIGN_W,
    DESIGN_H: DESIGN_H,
    ART_SCALE: ART_SCALE,
    RT_W: DESIGN_W / ART_SCALE,   // 720
    RT_H: DESIGN_H / ART_SCALE,   // 432
    SAFE_MARGIN: 48,
    LETTERBOX: '#0A0E17',

    /* ---------- 世界（GDD-01 §4.1） ---------- */
    WORLD_W: 3000,                // 航道总长 L_lane（沙盘校准：3000/(300*0.7)=14.3s）
    WORLD_TOP_SKY: -420,          // 相机可上探到世界顶部之上（搁浅构图用）
    WORLD_BOTTOM: 1100,           // 世界底部（沙层截面延伸到 864 之下）

    WATER_BASE: 105,              // GDD-01 §4.1 水面线 y=104 → 取 105（ADR-003）

    WAVE_LEN: 180,
    WAVE_SPEED: 40,

     * 约束：depth = seabedY - WATER_BASE
     *   x=750  → depth 400（DEEP|SHALLOW 边界，= GDD 深海 x<750）
     *   x=1650 → depth 120（SHALLOW|SURF 边界）
     *   x=2550 → depth 0  （潮线 shoreX，SURF|BEACH 边界）
     */
    SEABED_PTS: [
      [0, 864], [450, 864], [650, 852], [750, 505], [900, 450],
      [1150, 390], [1400, 315], [1650, 225], [1950, 168], [2250, 128],
      [2550, 105], [2750, 88], [3000, 78]
    ],
    ZONE_DEPTH_DEEP: 400,         // depth >= 400 → DEEP
    ZONE_DEPTH_SHALLOW: 120,      // depth >= 120 → SHALLOW；否则 SURF / BEACH

    V_CRUISE: 300,
    DASH: {
      WINDUP: 0.08, CRUISE_END: 0.65, TOTAL: 0.80,
      V_START: 300, V_PEAK: 700, V_END: 300,
      CD: 1.2, OMEGA: 90, CONE_DEG: 25
    },
    OMEGA_CRUISE: 360,

    /* 携带惩罚曲线（GDD-01 §4.2） */
    CARRY_V: function (k) { return k <= 0 ? 1.0 : (0.94 - 0.12 * k); },
    CARRY_W: function (k) { return k <= 0 ? 1.0 : Math.max(0.25, 1.0 - 0.20 * k); },
    CARRY_MAX: 4,

    /* 体力（GDD-01 §4.3） */
    STAMINA_MAX: 3,
    DASH_COST_EMPTY: 1,
    DASH_COST_CARRY: 2,

    REGEN_CARRY_MULT: 0.5,

    /* 冲浪模式（GDD-01 §3.5） */

      RATE_MULT: 1.25,
      OMEGA_MULT: 1.10,
      BAND: 40,          // |centerY - waterLineY| <= 40 design px（取 GDD 的 40，ADR-003 给 24）
      SPEED_FRAC: 0.8    // |v| >= 0.8 * v_cruise(k)  ← 见 README「已知冲突 S1」

    STUN_DUR: 1.5,

    BEACH: {
      V_TH: 210,       // 0.7 * v_cruise（GDD-01 §4.4）
      T_STRAND: 1.2,
      T_WARN: 0.72,    // 60% * T_STRAND
      REC_IN: 2.0,
      REC_OUT: 4.0
    },

    /* QTE（ADR-003 §2.6） */
    QTE: {
      WINDOW: 2.5, NEED: 6, MIN_INTERVAL: 0.1,
      RING_OUTER: 140, RING_INNER: 80,
      ALARM_RATE: 8.0,
      FREEZE: 0.08, SHAKE: 6
    },
    QTE_ASSIST: { WINDOW: 3.5, NEED: 3 },

    /* ALARM（GDD-02 §3.1/§3.2） */
    ALARM: {
      MAX: 100,
      GRAB: 20, DECOY: 8, JETSKI: 5, CC_HIT: 3,
      SLOPE: {
        DEEP_MOVING: -2.0, DEEP_STILL: -4.0,
        SHALLOW: 2.0, SURF: 0.5, BEACH: 4.0, AIRBORNE: 3.0,
        BEACHED: 8.0
      },
      STILL_SPEED: 60,     // |v| < 此值视为「静止」（深海衰减取 -4.0）
      UP: [25, 50, 75],    // 上升阈值（🔒）
      DOWN: [22, 46, 70],  // 下降阈值（3 点迟滞带，安全要求）
      MAX_EVENT_REARM: 90  // 「通缉令拉满」事件重复触发锁（跌破 90 才重触发）
    },

    /* 系绳（GDD-02 §3.5） */
    TETHER: {
      LOCK: 3.0,          // 锁定致死
      BREAK: 1.5,         // 脱离观测断线所需（硬约束 < LOCK）
      SEARCH: 4.0,        // `?` 搜索态持续
      DEEP_X: 750,        // 深海 = 敌人禁区
      DEEP_DEPTH: 240     // 水面下深度 > 240 且 x<750 → 不可观测
    },

    /* DECOY BREACH（GDD-03 §3.4） */
    DECOY: { RADIUS: 160, MAX_TARGETS: 2, STALL: 2.5, MIN_X: 750, COST: 1 },

    /* 咬合（GDD-03 §3.1） */
    BITE: { DUR: 0.25, FREEZE: 0.08, SHAKE: 6, SHAKE_CD: 0.5 },

    /* Bank（GDD-03 §3.6） */
    BANK: { DIGEST: 0.8, DEEP_X: 750 },

    /* 战利品（GDD-03 §3.1） */
    PREY: {
      SWIMMER: { score: 100, danger: 1.0, name: '泳客' },
      SURFER: { score: 150, danger: 1.0, name: '冲浪者' },
      SUNBATHER: { score: 100, danger: 1.0, name: '日光浴者' },
      LIFEGUARD: { score: 300, danger: 2.0, name: '救生员' }
    },

    /* COMBO（GDD-03 §3.3，MVP 简化） */
    COMBO: { PER_GRAB: 1, PER_COLLECT: 1, M_CAP: 3.0, STEP: 0.2 },
    BANK_B: function () { return 1.0; },   // MVP：B(k) ≡ 1（线性，🔒 沙盘结论）

    /* 敌人（GDD-02 §3.3/§3.4，MVP 简化版） */
    ENEMY: {
      WARN_LEAD: 0.8,
      T1: { SPEED: 30, DUR: 0.6 },
      T2A: { TELEGRAPH: 0.5, FLIGHT: 0.4, RANGE: 400, INTERVAL: 2.5 },
      T2B: { SPEED: 340, KNOCK: 0.3, IFRAME: 0.5 },
      T3B: { SPEED: 260, ALT: 44 },
      CAPS: { T1: 3, T2A: 2, T2B: 2, T3B: 1 },
      HARD_CAP: 7,
      MIN_LIFE: 1.5
    },

    /* 相机 */
    CAM: { LERP: 6.0, FOCUS_X: 0.62, FOCUS_Y: 0.46, Y_MIN: -320, BEACH_PAN: 0.35 },

    /* 光敏性癫痫安全（硬红线①）：所有呼吸式脉动走 breath()，f 恒 <= 2Hz */

    FIXED_DT: 1 / 60,
    DT_CLAMP: 0.05,
    MAX_SUBSTEP_PX: 40,
    MAX_STEPS: 5

   * 美术圣经 §2.3 定义了 13 色索引表，MVP 只取其中 10 色（灰调为主）。

   * 这不是审美取舍，是资产没有执行已锁定的美术规范。
   */
  C.PAL = {
    BLACK: '#0A0E17',
    DEEP: '#16213A',
    DEEP2: '#1B2E52',
    SLATE: '#2E3E54',
    STEEL: '#4A5A6E',      // 美术圣经 04 雾灰：鲨鱼背侧（上）
    ASH: '#6E7C8C',        // 美术圣经 05 中灰：鲨鱼背侧（中）
    MIST: '#8A97A8',       // 美术圣经 06 亮灰：鲨鱼受光边
    PALE: '#C7CFD8',
    WHITE: '#F2F5F8',

    BLOOD: '#FF3B3B',

  };
  /* 辅助色（非主调色板，仅用于占位素材内部） */

  /* 色盲模式映射（GDD-02 §5.4）：两条路径灰度化后均为单调亮度序列 */
  C.PAL_CB = { BLOOD: '#00C2FF', AMBER: '#FFD23F' };

  C.ZONE = { DEEP: 0, SHALLOW: 1, SURF: 2, BEACH: 3 };
  C.ZONE_NAME = ['深海', '浅滩', '冲浪区', '沙滩'];

<script>
/* ===== src/core/util.js ===== */
/* =====================================================================
 * TIDELINE · util.js
 * 数学 / 随机 / 安全脉动。热路径函数保持零分配。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /* 最短角差，归一化到 (-180, 180] —— GDD-01 E5 */
  function angDelta(target, cur) {
    var d = (target - cur) % 360;
    if (d > 180) d -= 360;
    else if (d <= -180) d += 360;
    return d;
  }

  /* 帧率无关的指数趋近 */
  function damp(cur, dst, rate, dt) {
    return lerp(cur, dst, 1 - Math.exp(-rate * dt));
  }

  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return Math.abs(ax - bx) * 2 < (aw + bw) && Math.abs(ay - by) * 2 < (ah + bh);
  }

  function dist2(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  /* ---- 随机（可播种，便于确定性回放） ---- */
  var seed = 0x2f6e2b1;
  function srand(s) { seed = (s >>> 0) || 1; }
  function rand() {
    // xorshift32
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >>> 17;
    seed ^= seed << 5; seed >>>= 0;
    return seed / 4294967296;
  }
  function rr(a, b) { return a + rand() * (b - a); }
  function ri(a, b) { return Math.floor(rr(a, b + 1)); }
  function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

  /* ---- 光敏性癫痫安全（硬红线①） ----
   * 全项目唯一的脉动函数。f 恒 <= 2Hz，且为呼吸式（无硬 on/off）。
   * 关闭「闪烁」开关时调用方应传 f=0（返回常亮 1.0）。
   */
  function breath(t, f) {
    var opts = TL.Game && TL.Game.opts;
    if (!f || (opts && (!opts.flash || opts.reducedMotion))) return 1.0;
    f = Math.min(Math.abs(f), TL.C.MAX_FLASH_HZ);
    return 0.8 + 0.2 * Math.sin(t * f * TAU);
  }

  /* 有序抖动（Bayer 8x8）在 shader 里做；这里只提供 CPU 侧的量化阈值表 */
  var BAYER8 = [
    0, 32, 8, 40, 2, 34, 10, 42,
    48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38,
    60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41,
    51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37,
    63, 31, 55, 23, 61, 29, 53, 21
  ];

  /* #RRGGBB → [r,g,b] 0..1 */
  function hex2rgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }

  /* 亮度（Rec.709），用于校验「血红与洋红亮度相同」这类约束 */
  function luma(hex) {
    var c = hex2rgb(hex);
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  TL.U = {
    TAU: TAU, clamp: clamp, lerp: lerp, smoothstep: smoothstep,
    angDelta: angDelta, damp: damp, aabb: aabb, dist2: dist2,
    srand: srand, rand: rand, rr: rr, ri: ri, pick: pick,
    breath: breath, BAYER8: BAYER8, hex2rgb: hex2rgb, luma: luma,
    snapArt: function (v) { return Math.round(v / TL.C.ART_SCALE) * TL.C.ART_SCALE; }
  };
})();

</script>
<script>
/* ===== src/core/input.js ===== */
/* =====================================================================
 * TIDELINE · core/input.js
 * 1.5 个输入自由度（GDD-01 §3.1）：方向（连续）+ 冲刺（离散点按）。
 * 键盘 / 触屏同源；触屏按 GDD-01 E6 管理 pointerId —— anchor 只由第一根
 * 手指设定，第二根手指点按 = 冲刺，避免「想冲刺却突然转向」。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});

  var keys = Object.create(null);
  var dirX = 0, dirY = 0;
  var dashFlag = false;
  var pauseFlag = false;
  var muteFlag = false;
  var confirmFlag = false;
  var taps = [];

  var dragId = null, ax = 0, ay = 0, downT = 0, moved = 0;
  var DEADZONE = 12, TAP_MS = 220;

  /* 焦点是否落在表单控件上（菜单 / 设置面板内的按钮与勾选框）。 */
  function typingUI() {
    var a = document.activeElement;
    if (!a || !a.tagName) return false;
    var t = a.tagName.toUpperCase();
    return t === 'BUTTON' || t === 'INPUT' || t === 'SELECT' ||
      t === 'TEXTAREA' || t === 'A';
  }

  function onKeyDown(e) {
    var k = e.key;

    /* 焦点在按钮/控件上时放行原生行为 —— 否则空格无法激活聚焦的按钮
     * （Enter 可以、空格不行），这是可访问性缺陷。
     * 例外：Esc / P / M 是全局功能，任何时候都必须可用。 */
    if (typingUI() && !(k === 'Escape' || k === 'p' || k === 'P' || k === 'm' || k === 'M')) return;

    if (k === ' ' || k === 'Spacebar') {
      if (!e.repeat) { dashFlag = true; taps.push(performance.now()); }
      e.preventDefault();
      return;
    }
    if (k === 'j' || k === 'J') { if (!e.repeat) { dashFlag = true; taps.push(performance.now()); } return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { pauseFlag = true; return; }
    if (k === 'm' || k === 'M') { muteFlag = true; return; }
    if (k === 'Enter') { confirmFlag = true; return; }
    keys[k.toLowerCase()] = true;
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  }
  function onKeyUp(e) { keys[e.key.toLowerCase()] = false; }
  /* 失焦：除方向外，**必须一并清掉待消费的一次性标志**。
   * 否则「按住空格切出去 → 切回来」会凭空触发一次冲刺；
   * 结算页按过 Enter 再切走，回来还可能直接重开一局。 */
  function onBlur() {
    keys = Object.create(null);
    dirX = dirY = 0; dragId = null;
    dashFlag = false; pauseFlag = false; muteFlag = false; confirmFlag = false;
    taps.length = 0;
  }

  function localPos(e, el) {
    var r = el.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * TL.C.DESIGN_W,
      y: (e.clientY - r.top) / r.height * TL.C.DESIGN_H
    };
  }

  /* ⭐ 判定「这次指针按下落在 UI 上」。
   *
   * 为什么必须有这个判断：在 pointerdown 上调 preventDefault() 会按规范
   * **抑制随后的兼容鼠标事件（mousedown / mouseup / click）**。
   * 菜单按钮位于 #stage 内部，事件冒泡到 stage 的处理器就被掐断 ——
   * 结果是「鼠标点不动任何菜单按钮」，而程序化的 el.click() 却能正常触发，
   * 所以纯 DOM 级测试**永远发现不了**这个缺陷（必须真实指针点击才能暴露）。
   */
  function onUI(target, root) {
    for (var n = target; n && n !== root; n = n.parentNode) {
      if (!n.tagName) continue;
      var tag = n.tagName.toUpperCase();
      if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'SELECT' ||
        tag === 'LABEL' || tag === 'A' || tag === 'TEXTAREA') return true;
      if (n.id === 'screens') return true;      // 任何覆盖层内部一律交给 UI
    }
    return false;
  }

  function bind(el) {
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function (e) {
      if (onUI(e.target, el)) return;            // 放行 UI，绝不 preventDefault
      if (dragId === null) {
        dragId = e.pointerId;
        var p = localPos(e, el);
        ax = p.x; ay = p.y; downT = performance.now(); moved = 0;
        try { el.setPointerCapture(e.pointerId); } catch (err) { }
      } else {
        // 第二根手指 → 冲刺 / QTE 连打
        dashFlag = true; taps.push(performance.now());
      }
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== dragId) return;
      var p = localPos(e, el);
      var dx = p.x - ax, dy = p.y - ay;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > moved) moved = len;
      if (len < DEADZONE) { dirX = 0; dirY = 0; return; }
      dirX = dx / len; dirY = dy / len;
      e.preventDefault();
    });
    function up(e) {
      if (e.pointerId !== dragId) return;
      var dt = performance.now() - downT;
      if (dt < TAP_MS && moved < DEADZONE) {
        dashFlag = true; taps.push(performance.now());
      }
      dragId = null;
      dirX = 0; dirY = 0;   // E6：不自动接管，保持上一帧 θ
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  function update() {
    var kx = 0, ky = 0;
    if (keys['arrowleft'] || keys['a']) kx -= 1;
    if (keys['arrowright'] || keys['d']) kx += 1;
    if (keys['arrowup'] || keys['w']) ky -= 1;
    if (keys['arrowdown'] || keys['s']) ky += 1;
    if (kx || ky) {
      var l = Math.sqrt(kx * kx + ky * ky);
      dirX = kx / l; dirY = ky / l;
    } else if (dragId === null) {
      dirX = 0; dirY = 0;
    }
  }

  TL.Input = {
    bind: bind,
    update: update,
    get dirX() { return dirX; },
    get dirY() { return dirY; },
    get hasDir() { return (dirX * dirX + dirY * dirY) > 0.0001; },
    consumeDash: function () { var d = dashFlag; dashFlag = false; return d; },
    takeTaps: function () { var t = taps; taps = []; return t; },
    consumePause: function () { var p = pauseFlag; pauseFlag = false; return p; },
    consumeMute: function () { var m = muteFlag; muteFlag = false; return m; },
    consumeConfirm: function () { var c = confirmFlag; confirmFlag = false; return c; },
    clear: function () { dashFlag = false; taps.length = 0; dirX = dirY = 0; },
    reset: onBlur
  };

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);
})();

</script>
<script>
/* ===== src/core/audio.js ===== */
/* =====================================================================
 * TIDELINE · core/audio.js
 * Phase 6 · 音频总监 阮和鸣（Ruan Hemo）
 *
 * 设计文档：design/audio/PH6-audio-design.md
 *
 * ── 本文件不是"装饰音"，它是「冗余信息通道」的第三重 ────────────────
 * 硬红线②：颜色永不作为唯一信息通道。美术侧给了形态通道（血红=静态填充 /
 * 洋红=径向运动粒子），本文件给的是**听觉通道**：玩家不看 HUD、不看颜色，
 * 也必须知道 ALARM 升降、QTE 还差几次、系绳是否已断、是否刚 Bank 成功。
 *
 * ── 三条硬约束 ──────────────────────────────────────────────────────
 * ① 零外部资产：全部由振荡器 / 噪声缓冲 / 包络 / 滤波器现场合成。
 * ② 静音必须可用：setMuted(true) 后本模块只读不写，绝不参与任何游戏逻辑。
 * ③ 光敏安全：音频自身不闪烁，但**不得与视觉脉动同步形成 >2Hz 复合刺激**。
 *    → QTE 心跳锁死 2.0Hz（与圆环 2Hz 呼吸同频）；
 *    → 系绳张力音是**连续滑音**，不是脉冲（系绳视觉呼吸 1Hz，二者不同频）；
 *    → reducedMotion 下关闭心跳层。
 *
 * ── 总线结构 ────────────────────────────────────────────────────────
 *   SFX ──┐
 *   MUSIC ┼→ limiter(DynamicsCompressor) → master(静音开关) → destination
 *   UI  ──┘
 * 音乐层是**四层可加性分层**（L1 脉冲 / L2 军鼓 / L3 引擎 / L4 围剿），
 * 由 ALARM 档位 tier(0–3) 与「是否携带」共同驱动（概念文档 §2 支柱一）。
 *
 * ── 状态来源 ────────────────────────────────────────────────────────
 * 为**零改动调用方**，本模块不新增任何对外方法调用点：音乐层通过轮询
 * window.TL.Game 的只读字段（tier / shark.carryK / qte.active / over）
 * 取得状态；SFX 侧的短时状态（QTE 计数、系绳）由事件流自行镜像。
 * 因此本模块对游戏是**纯读取**，删除它不会改变任何一帧的判定。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});

  /* ==================================================================
   * 0 · 混音常量（唯一真源，改这里不要改各处硬编码）
   * ================================================================== */
  var MASTER_GAIN = 0.30;                       // 总输出（留 headroom 给 limiter）
  var BUS = { SFX: 1.00, MUSIC: 0.42, UI: 0.70 };
  var MAX_VOICES = 20;                          // SFX 并发上限
  var MUSIC_EXTRA = 10;                         // 音乐层额外声部预算（不被 SFX 挤掉）

  var LOOKAHEAD = 0.14;                         // 调度提前量（秒）
  var TICK_MS = 25;                             // 调度器心跳（毫秒）

  /* 音乐：A 自然小调，根音 A1 = 55Hz
   * 半音级：A=0 B=2 C=3 D=5 E=7 F=8 G=10
   * ⚠️ 刻意避开《大白鲨》式的两音交替 ostinato（版权与其直白的喜剧感），
   *    改用 6 音切分的 lope——像"有什么东西在水下绕圈"。            */
  var ROOT = 55.0;
  var PULSE_DEG = [0, null, null, 7, null, null, 0, null,
    3, null, null, 0, null, null, 5, null];

  /* 事件冷却（秒）：防止同名音效在 1 帧内堆叠成噪音墙 */
  var COOLDOWN = {
    splash: 0.05, thrash: 0.03, hit: 0.06, lockWarn: 0.25, ui: 0.03,
    decoy: 0.10, deny: 0.15, tierUp: 0.12, tierDown: 0.12, rescued: 0.10,
    sting: 0.20, collect: 0.04
  };

  /* ==================================================================
   * 1 · 上下文与总线
   * ================================================================== */
  var ctx = null, master = null, limiter = null;
  var busSfx = null, busMusic = null, busUi = null;
  var noiseBuf = null;
  var muted = false;

  /** 存活声部表：{ n:[节点...], end:ctxTime }。这是节点泄漏的唯一防线。 */
  var live = [];

  function ready() { return !!ctx && !muted; }

  function init() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;                            // 无 WebAudio → 全部静默降级
    try { ctx = new AC(); } catch (e) { ctx = null; return; }

    /* 主输出链：buses → limiter → master → destination
     * limiter 放在 master 之前，这样静音斜坡不会引起压缩器抽吸。        */
    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_GAIN;
    master.connect(ctx.destination);

    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -10;              // 堆叠到 -10dB 开始压
    limiter.knee.value = 8;
    limiter.ratio.value = 12;                   // 硬限幅，杜绝削波爆音
    limiter.attack.value = 0.003;
    limiter.release.value = 0.16;
    limiter.connect(master);

    busSfx = ctx.createGain(); busSfx.gain.value = BUS.SFX; busSfx.connect(limiter);
    busMusic = ctx.createGain();
    busMusic.gain.value = MUS.musicOff ? 0.0001 : BUS.MUSIC;   // 尊重已设定的音乐开关
    busMusic.connect(limiter);
    busUi = ctx.createGain(); busUi.gain.value = BUS.UI; busUi.connect(limiter);

    /* 2.0s 白噪声缓冲：所有水花 / 军鼓 / 沙尘 / 抽气声共用同一份数据，
     * 靠随机读取偏移 + playbackRate 制造变体（省内存，零额外资产）。   */
    var len = Math.floor(ctx.sampleRate * 2.0);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    buildMusic();
    if (!MUS.timer) MUS.timer = setInterval(tick, TICK_MS);
  }

  function resume() {
    if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
  }

  /* ==================================================================
   * 2 · 声部核心（两个原语：tone / noise）
   * ================================================================== */
  function claim(music) {
    return live.length < (music ? MAX_VOICES + MUSIC_EXTRA : MAX_VOICES);
  }
  function mkEntry(chain, endAt) {
    var e = { n: chain, end: endAt };
    live.push(e);
    return e;
  }
  function drop(e) {
    var i = live.indexOf(e);
    if (i >= 0) live.splice(i, 1);
    for (var j = 0; j < e.n.length; j++) { try { e.n[j].disconnect(); } catch (x) { } }
  }
  /** 兜底回收：onended 没触发（如上下文被系统挂起）时，按时间强制回收。 */
  function prune() {
    if (!ctx) return;
    var t = ctx.currentTime;
    for (var i = live.length - 1; i >= 0; i--) if (live[i].end < t) drop(live[i]);
  }

  function chainFilters(chain, tail, opt) {
    var f;
    if (opt.hp) {
      f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = opt.hp;
      chain.push(f); tail.connect(f); tail = f;
    }
    if (opt.lp) {
      f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp;
      if (opt.lpSweep) {
        f.frequency.setValueAtTime(opt.lpSweep[0], ctx.currentTime + (opt.delay || 0));
        f.frequency.exponentialRampToValueAtTime(
          Math.max(40, opt.lpSweep[1]), ctx.currentTime + (opt.delay || 0) + opt.dur);
      }
      chain.push(f); tail.connect(f); tail = f;
    }
    if (opt.bp) {
      f = ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.value = opt.bp; f.Q.value = opt.q || 1.0;
      if (opt.bpSweep) {
        f.frequency.setValueAtTime(opt.bpSweep[0], ctx.currentTime + (opt.delay || 0));
        f.frequency.exponentialRampToValueAtTime(
          Math.max(40, opt.bpSweep[1]), ctx.currentTime + (opt.delay || 0) + opt.dur);
      }
      chain.push(f); tail.connect(f); tail = f;
    }
    return tail;
  }

  /**
   * 振荡器声部。指数包络（听感上更接近"打击"），结束即自动断链。
   * @param type  sine|square|sawtooth|triangle
   * @param f0/f1 起止频率（指数滑音；相等则定频）
   */
  function tone(type, f0, f1, dur, peak, opt) {
    if (!ready()) return null;
    opt = opt || {};
    if (!claim(opt.music)) return null;
    var t0 = ctx.currentTime + (opt.delay || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    var chain = [o, g];
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);

    var atk = opt.attack !== undefined ? opt.attack : Math.min(0.008, dur * 0.22);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
    if (opt.hold !== undefined) g.gain.setValueAtTime(Math.max(0.0002, peak), t0 + Math.min(dur * 0.92, opt.hold));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.connect(g);
    var tail = chainFilters(chain, g, { hp: opt.hp, lp: opt.lp, lpSweep: opt.lpSweep, dur: dur, delay: opt.delay || 0 });
    tail.connect(opt.bus || busSfx);

    var e = mkEntry(chain, t0 + dur + 0.06);
    o.onended = function () { drop(e); };
    o.start(t0);
    o.stop(t0 + dur + 0.02);
    return o;
  }

  /** 噪声声部（水花 / 军鼓 / 沙尘 / 抽气）。共享 noiseBuf，随机读取偏移。 */
  function noise(dur, peak, opt) {
    if (!ready() || !noiseBuf) return null;
    opt = opt || {};
    if (!claim(opt.music)) return null;
    var t0 = ctx.currentTime + (opt.delay || 0);
    var s = ctx.createBufferSource(), g = ctx.createGain();
    var chain = [s, g];
    s.buffer = noiseBuf;
    if (opt.rate) s.playbackRate.value = opt.rate;

    var atk = opt.attack !== undefined ? opt.attack : Math.min(0.006, dur * 0.2);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
    if (opt.hold !== undefined) g.gain.setValueAtTime(Math.max(0.0002, peak), t0 + Math.min(dur * 0.92, opt.hold));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    s.connect(g);
    var tail = chainFilters(chain, g, {
      hp: opt.hp, lp: opt.lp, lpSweep: opt.lpSweep,
      bp: opt.bp, q: opt.q, bpSweep: opt.bpSweep, dur: dur, delay: opt.delay || 0
    });
    tail.connect(opt.bus || busSfx);

    var maxOff = Math.max(0, noiseBuf.duration - dur - 0.05);
    var e = mkEntry(chain, t0 + dur + 0.06);
    s.onended = function () { drop(e); };
    s.start(t0, Math.random() * maxOff);
    s.stop(t0 + dur);
    return s;
  }

  /* ==================================================================
   * 3 · 侧链闪避（duck）：关键音触发时把音乐压下去
   *    比"单纯调大音效"干净得多——关键音在**安静的床**上才听得清。
   * ================================================================== */
  function duck(to, hold) {
    if (!ready() || !busMusic) return;
    var t = ctx.currentTime, g = busMusic.gain;
    try {
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.linearRampToValueAtTime(BUS.MUSIC * to, t + 0.06);
      g.setValueAtTime(BUS.MUSIC * to, t + 0.06 + hold);
      g.linearRampToValueAtTime(BUS.MUSIC, t + 0.06 + hold + 0.45);
    } catch (e) { /* 参数自动化失败不影响游戏 */ }
  }

  /* ==================================================================
   * 4 · 事件流镜像（QTE 计数 / 携带 / 系绳）
   * ================================================================== */
  var mirror = { qteStep: 0, carry: 0, over: false, collect: 0 };

  function qteReset() { mirror.qteStep = 0; }

  /* ==================================================================
   * 5 · 系绳张力音（GDD-02 §5.2「绷紧音升调」）
   *    连续上行滑音：220→660Hz（+ 纯五度泛音），3.0s 走完 = 锁定致死时长。
   *    ⚠️ 刻意做成**连续滑音而非脉冲**：系绳的视觉呼吸是 1Hz，
   *       若音频也做脉冲会与之同步，构成复合周期刺激。滑音无周期性。
   * ================================================================== */
  var riser = null;
  function lockSeconds() {
    return (TL.C && TL.C.TETHER && TL.C.TETHER.LOCK) || 3.0;
  }
  function startRiser() {
    if (!ready()) return;
    stopRiser(0.04);
    var t = ctx.currentTime, L = lockSeconds();
    var a = ctx.createOscillator(), b = ctx.createOscillator();
    var g = ctx.createGain(), f = ctx.createBiquadFilter();
    a.type = 'sine'; b.type = 'sine';
    a.frequency.setValueAtTime(220, t); a.frequency.linearRampToValueAtTime(660, t + L);
    b.frequency.setValueAtTime(330, t); b.frequency.linearRampToValueAtTime(990, t + L);
    f.type = 'lowpass'; f.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.085, t + 0.7);
    a.connect(f); b.connect(f); f.connect(g); g.connect(busSfx);
    a.start(t); b.start(t);
    riser = { a: a, b: b, g: g, f: f };
  }
  function stopRiser(fade) {
    if (!riser || !ctx) return;
    var r = riser; riser = null;
    var t = ctx.currentTime, d = (fade === undefined ? 0.12 : fade);
    try {
      r.g.gain.cancelScheduledValues(t);
      r.g.gain.setValueAtTime(Math.max(0.0002, r.g.gain.value), t);
      r.g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      r.a.stop(t + d + 0.02); r.b.stop(t + d + 0.02);
      r.a.onended = function () {
        try { r.a.disconnect(); r.b.disconnect(); r.f.disconnect(); r.g.disconnect(); } catch (x) { }
      };
    } catch (e) { }
  }

  /* ==================================================================
   * 6 · 动态音乐层（L1 脉冲 / L2 军鼓 / L3 引擎 / L4 围剿）
   * ================================================================== */
  var MUS = {
    timer: 0, step: 0, next: 0, bpm: 96,
    gPulse: null, gSnare: null, gEngine: null, gHat: null, gSiege: null, gHeart: null,
    engF: null, tg: { pulse: 1, snare: 0, engine: 0, hat: 0, siege: 0, heart: 0 }
  };

  function buildMusic() {
    function layer() {
      var g = ctx.createGain(); g.gain.value = 0; g.connect(busMusic); return g;
    }
    MUS.gPulse = layer(); MUS.gSnare = layer(); MUS.gHat = layer();
    MUS.gSiege = layer(); MUS.gHeart = layer(); MUS.gEngine = layer();

    /* 引擎层：两个失谐锯齿（48 / 48.7Hz）→ 低通 → 旋翼颤音 → 层增益
     * 6.5Hz 的 AM 是"直升机旋翼"的听觉签名（GDD-02：T3b 恒定带系绳）。
     * 它是**连续**的，不与任何 1–2Hz 视觉脉动同步。                    */
    var f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 150; f.Q.value = 0.8;
    MUS.engF = f;
    var trem = ctx.createGain(); trem.gain.value = 0.65;
    var lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.type = 'sine'; lfo.frequency.value = 6.5; lfoG.gain.value = 0.35;
    lfo.connect(lfoG); lfoG.connect(trem.gain);
    for (var i = 0; i < 2; i++) {
      var o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = 48 + i * 0.7;
      o.connect(f); o.start(ctx.currentTime);
    }
    f.connect(trem); trem.connect(MUS.gEngine);
    lfo.start(ctx.currentTime);
  }

  /** 只读轮询游戏状态（不新增任何调用点，不改任何判定）。 */
  function gameState() {
    var G = (window.TL && TL.Game) ? TL.Game : null;
    if (!G) return { tier: 0, carry: 0, qte: false, over: false, reduced: false };
    var s = G.shark;
    return {
      tier: G.tier | 0,
      carry: (s && s.carryK) ? 1 : 0,
      qte: !!G.qte.active,
      over: !!G.over,
      reduced: !!(G.opts && (G.opts.reducedMotion || G.opts.qteAssist))
    };
  }

  /** 各层目标增益（0–1）。支柱一：携带 → 军鼓 + 引擎无条件上场。 */
  function musicTargets(st) {
    if (st.over) return { pulse: 0, snare: 0, engine: 0, hat: 0, siege: 0, heart: 0 };
    if (st.qte && !st.reduced) return { pulse: 0, snare: 0, engine: 0, hat: 0, siege: 0, heart: 1 };
    var carrying = st.carry > 0;
    return {
      pulse: carrying ? 0.55 : 1.00,                 // 携带时低音让位给军鼓/引擎
      snare: (st.tier >= 1 || carrying) ? 1 : 0,
      engine: (st.tier >= 2 || carrying) ? 1 : 0,
      hat: st.tier >= 3 ? 1 : (st.tier >= 2 ? 0.7 : 0),
      siege: st.tier >= 3 ? 1 : 0,
      heart: 0
    };
  }

  function setG(node, v) {
    if (!node) return;
    try { node.gain.setTargetAtTime(v, ctx.currentTime, 0.18); } catch (e) { }
  }
  function applyTargets() {
    var P = MUS.tg;
    setG(MUS.gPulse, P.pulse);
    setG(MUS.gSnare, P.snare);
    setG(MUS.gEngine, P.engine * 0.9);
    setG(MUS.gHat, P.hat);
    setG(MUS.gSiege, P.siege);
    setG(MUS.gHeart, P.heart);
    if (MUS.engF) {
      try {
        MUS.engF.frequency.setTargetAtTime(140 + P.engine * 150 + P.siege * 140, ctx.currentTime, 0.4);
      } catch (e) { }
    }
  }

  function scheduleStep(s, t) {
    var d = Math.max(0, t - ctx.currentTime);
    var P = MUS.tg;
    var i;

    /* 音乐开关关闭时，除**心跳**外的所有层目标增益一律视作 0。
     * 心跳是 QTE「还差几次」的听觉量表，属冗余信息通道，
     * 不得随音乐开关一起消失（硬红线②：颜色/音乐都不是唯一通道）。 */
    if (MUS.musicOff) P = { pulse: 0, snare: 0, engine: 0, hat: 0, siege: 0, heart: P.heart };

    /* --- L1 · 脉冲 Bass（全档位常驻的床） --- */
    var deg = PULSE_DEG[s];
    if (deg !== null && deg !== undefined && P.pulse > 0.01) {
      var f = ROOT * Math.pow(2, deg / 12);
      tone('triangle', f, f, 0.16, 0.17 * P.pulse, { bus: MUS.gPulse, delay: d, music: 1, attack: 0.006 });
      tone('sine', f * 0.5, f * 0.5, 0.20, 0.10 * P.pulse, { bus: MUS.gPulse, delay: d, music: 1, attack: 0.008 });
    }

    /* --- L2 · 军鼓（T1+ 或 携带中）：正拍 4 / 12，T3 加 7 / 15 幽灵音 --- */
    if (P.snare > 0.01 && (s === 4 || s === 12)) {
      noise(0.11, 0.15 * P.snare, { lp: 3200, hp: 900, bus: MUS.gSnare, delay: d, music: 1 });
      tone('triangle', 190, 130, 0.08, 0.06 * P.snare, { bus: MUS.gSnare, delay: d, music: 1 });
    }
    if (P.snare > 0.5 && (s === 7 || s === 15)) {
      noise(0.06, 0.07, { lp: 4200, hp: 1200, bus: MUS.gSnare, delay: d, music: 1 });
    }

    /* --- L3b · hi-hat：T2 走 8 分，T3 走 16 分（密度即紧迫度） --- */
    if (P.hat > 0.01 && (P.hat > 0.9 || s % 2 === 0)) {
      noise(0.035, (s % 4 === 0 ? 0.045 : 0.026) * P.hat,
        { lp: 7000, hp: 4200, bus: MUS.gHat, delay: d, music: 1 });
    }

    /* --- L4 · 围剿刺：每小节头的三全音（A2 110 / D#3 155.56）
     *     减五度 = 不解决。概念文档 §2 支柱二：「贪婪冲滩时是不解决的减和弦」 */
    if (P.siege > 0.01 && s === 0) {
      tone('sawtooth', 110, 110, 0.42, 0.10 * P.siege, { bus: MUS.gSiege, delay: d, lp: 700, music: 1 });
      tone('sawtooth', 155.56, 155.56, 0.42, 0.08 * P.siege, { bus: MUS.gSiege, delay: d, lp: 700, music: 1 });
    }

    /* --- QTE 心跳：bpm 恒 120 → 步 0/4/8/12 = 严格 2.0Hz
     *     与 QTE 圆环 2Hz 呼吸**同频**，复合刺激仍为 2Hz（硬红线①） --- */
    if (P.heart > 0.01 && (s === 0 || s === 4 || s === 8 || s === 12)) {
      tone('sine', 74, 46, 0.15, 0.26 * P.heart, { bus: MUS.gHeart, delay: d, music: 1 });
    }
  }

  function tick() {
    if (!ctx) return;
    prune();
    if (muted || ctx.state !== 'running') return;
    var st = gameState();
    var t = ctx.currentTime;

    /* 落后太多（切后台 / 长时间挂起）→ 重新对齐，绝不追赶补发一堆积压音符 */
    if (MUS.next < t) MUS.next = t + 0.03;

    MUS.tg = musicTargets(st);
    if (MUS.musicOff) {
      MUS.tg = { pulse: 0, snare: 0, engine: 0, hat: 0, siege: 0, heart: MUS.tg.heart };
    }
    var guard = 0;
    while (MUS.next < t + LOOKAHEAD && guard++ < 64) {
      if (MUS.step === 0) {
        MUS.bpm = st.qte && !st.reduced ? 120 : (96 + st.tier * 8);
        applyTargets();
      }
      scheduleStep(MUS.step, MUS.next);
      MUS.next += (60 / MUS.bpm) / 4;         // 16 分音符步长
      MUS.step = (MUS.step + 1) & 15;
    }
  }

  /* ==================================================================
   * 7 · 音效表
   *   命名约定：<对象><动作>，骆驼命名。时长全部 <200ms（概念文档 §2
   *   支柱三「留白多，反馈音效短促」），仅 death / bank 例外（它们是
   *   段落级的情绪收束，不是反馈音）。
   * ================================================================== */
  var SFX = {

    /* ---------- P0 · 冗余信息通道（禁止削减、禁止加冷却） ---------- */

    /** ALARM 升档：两音上行 A4→E5（纯五度），square = 硬、刺 */
    tierUp: function () {
      tone('square', 440, 440, 0.09, 0.26, { lp: 5200 });
      tone('square', 659.25, 659.25, 0.10, 0.24, { delay: 0.085, lp: 5200 });
      duck(0.30, 0.30);
    },

    /** ALARM 降档：同两音**下行** + triangle（软）
     *  ⭐ 与升档的区分是**双通道**的：音高走向（上行/下行）+ 波形（方/三角）。
     *     任一维度单独失效（听力损失 / 音色掩蔽）仍可辨。                  */
    tierDown: function () {
      tone('triangle', 659.25, 659.25, 0.09, 0.22, {});
      tone('triangle', 440, 440, 0.11, 0.20, { delay: 0.085 });
    },

    /** 「通缉令拉满」（ALARM=100，GDD-02 E6 有重复触发锁）：三连上行 + 三全音悬置 */
    alarmMax: function () {
      tone('square', 440, 440, 0.07, 0.24, { lp: 5200 });
      tone('square', 587.33, 587.33, 0.07, 0.24, { delay: 0.07, lp: 5200 });
      tone('square', 880, 880, 0.22, 0.26, { delay: 0.14, lp: 5200 });
      tone('sawtooth', 622.25, 622.25, 0.5, 0.08, { delay: 0.14, lp: 1400 });
      duck(0.24, 0.55);
    },

    /** QTE 每次有效输入：音高随进度**逐级上行**（每次 +1.5 半音）
     *  ⭐ 这是"还差几次"的听觉量表：玩家不看圆环也知道进度。 */
    thrash: function () {
      var f = 150 * Math.pow(2, mirror.qteStep * 1.5 / 12);
      mirror.qteStep++;
      noise(0.07, 0.18, { lp: 1600, hp: 300, hold: 0.012 });
      tone('square', f, f * 0.55, 0.09, 0.20, { lp: 3000 });
    },

    /** 搁浅预警（strandT ≥ 0.72s）：上行滑音 + 轻微失谐 → "不对劲" */
    sting: function () {
      tone('sawtooth', 220, 440, 0.40, 0.16, { lp: 1400 });
      tone('sine', 223, 446, 0.40, 0.09, { lp: 1400 });
    },

    /** 搁浅确认（enterBeached）：抽气声。带通从 1800 扫到 300 = 强调色被抽干 */
    beached: function () {
      noise(0.55, 0.24, { bp: 1800, q: 1.2, bpSweep: [1800, 300], hold: 0.10 });
      tone('sine', 90, 58, 0.45, 0.26, {});
      duck(0.12, 0.90);
    },

    /** ⭐ 系绳锁定开始：死亡倒计时的起点，必须是全场最刺的音之一 */
    tether: function () {
      tone('square', 1400, 1400, 0.05, 0.16, { lp: 6000 });
      tone('square', 1400, 1400, 0.05, 0.14, { delay: 0.085, lp: 6000 });
      tone('sawtooth', 1200, 380, 0.26, 0.20, { delay: 0.16, lp: 2600 });
      duck(0.28, 0.45);
      startRiser();
    },

    /** ⭐ 断线成功：与 tether **方向相反**（下行 vs 上行）+ 一声"叮" = 安全 */
    tetherBreak: function () {
      stopRiser(0.10);
      tone('sine', 600, 1400, 0.18, 0.22, {});
      tone('triangle', 1760, 1760, 0.14, 0.14, { delay: 0.10 });
    },

    /** ⭐ 捕食成功：核心动词的听觉具象化。低频"咔" + 水肉噪声 + 三角点缀 */
    bite: function () {
      tone('square', 160, 55, 0.16, 0.34, {});
      noise(0.22, 0.26, { lp: 900 });
      tone('triangle', 220, 180, 0.12, 0.14, { delay: 0.02 });
      duck(0.34, 0.20);
      mirror.carry = 1;
    },

    /** ⭐ Bank 结算：「落袋为安」。C-E-G 大三和弦琶音 + 解决的八度长音 */
    bank: function () {
      var seq = [523.25, 659.25, 783.99];
      for (var i = 0; i < seq.length; i++) {
        tone('triangle', seq[i], seq[i], 0.10, 0.24, { delay: i * 0.09 });
      }
      tone('triangle', 1046.5, 1046.5, 0.28, 0.22, { delay: 0.27 });
      tone('sine', 1567.98, 1567.98, 0.34, 0.06, { delay: 0.30 });   // 余韵
      duck(0.30, 0.50);
      mirror.carry = 0; mirror.collect = 0; qteReset(); stopRiser(0.08);
    },

    /** 脱困 / 冲刺自救：上行四度 G4→C5，**不解决**到长音（与 bank 区分） */
    rescued: function () {
      tone('triangle', 392, 392, 0.10, 0.24, {});
      tone('triangle', 523.25, 523.25, 0.20, 0.22, { delay: 0.10 });
      noise(0.20, 0.14, { lp: 2400, hp: 400, delay: 0.02 });
      qteReset();
    },

    /** 死亡：下扫 + 悬置的减五度（A3/D#4）→ 支柱二「押注全损 = 和弦不解决」 */
    death: function () {
      tone('sawtooth', 220, 45, 0.70, 0.30, { lp: 900 });
      noise(0.60, 0.16, { lp: 500 });
      tone('sine', 220, 220, 0.90, 0.06, { delay: 0.30 });
      tone('sine', 311.13, 311.13, 0.90, 0.05, { delay: 0.30 });
      duck(0.10, 1.20);
      stopRiser(0.05);
      qteReset();
      mirror.carry = 0; mirror.collect = 0;
    },

    /** 体力不足拒绝（GDD-03 E6 明确要求，此前遗漏）：短促下行两声 = "不行" */
    deny: function () {
      tone('square', 300, 300, 0.05, 0.13, { lp: 2000 });
      tone('square', 200, 200, 0.06, 0.12, { delay: 0.07, lp: 2000 });
    },

    /* ---------- P1 · 应该有 ---------- */

    /** ⭐ 收集物拾取（副循环）：音高随「本局已收集数」逐级上行（每个 +1.5 半音）。
     *  玩家不看 HUD 也能靠听知道这一趟攒了多少 —— 与 QTE 连打音同一套听觉量表逻辑。 */
    collect: function () {
      var f = 740 * Math.pow(2, Math.min(mirror.collect, 11) * 1.5 / 12);
      mirror.collect++;
      tone('triangle', f, f * 1.45, 0.10, 0.15, {});
      tone('sine', f * 2.0, f * 2.0, 0.07, 0.06, { delay: 0.05 });
    },

    /** 破水 / 冲刺起手：短水花 */
    splash: function () {
      noise(0.16, 0.15, { lp: 2600, hp: 500 });
      tone('sine', 300, 700, 0.10, 0.09, {});
    },

    /** 大破水（保留给 Standard 的 breach 演出） */
    breach: function () {
      noise(0.34, 0.24, { lp: 3200, hp: 300 });
      tone('sine', 220, 620, 0.18, 0.13, {});
    },

    /** DECOY BREACH 炸水：比 splash 大，但**层级低于捕食**（无低频冲击、无顿帧） */
    decoy: function () {
      noise(0.40, 0.26, { lp: 2400, hp: 200, hold: 0.06 });
      tone('sawtooth', 520, 180, 0.22, 0.16, { lp: 1800 });
      duck(0.38, 0.20);
    },

    /** 受击（浮标 / 渔网 / 摩托艇 / 垃圾）：锯齿下扫 + 闷噪声 */
    hit: function () {
      tone('sawtooth', 140, 70, 0.20, 0.24, { lp: 1200 });
      noise(0.16, 0.18, { lp: 700 });
    },

    /** T2+ 敌人登场预警（提前 0.8s）：两声方波警报 + 低频底 */
    lockWarn: function () {
      tone('square', 660, 660, 0.06, 0.16, { lp: 3000 });
      tone('square', 660, 660, 0.06, 0.14, { delay: 0.10, lp: 3000 });
      tone('sine', 110, 110, 0.20, 0.12, {});
    },

    /** UI 确认 */
    ui: function () {
      tone('square', 700, 700, 0.05, 0.16, { bus: busUi, lp: 4000 });
    },

    /* ---------- P2 · 可选（已在表中，尚未接线） ---------- */

    /** 诱饵命中：惊动音（GDD-02 §5.2）。需 game.js 在 decoyAt 返回 n>0 时调用 */
    decoyHit: function () {
      tone('square', 880, 1320, 0.10, 0.16, { lp: 5000 });
      noise(0.14, 0.12, { lp: 3000, hp: 800 });
    },

    /** 游客被叼：短促惊叫（喜剧，非惨叫）。GDD-03 §5.2。需 prey.js 接线 */
    yelp: function () {
      tone('square', 500, 900, 0.05, 0.10, { lp: 3000 });
      tone('square', 900, 400, 0.08, 0.09, { delay: 0.05, lp: 3000 });
    },

    /** 未兑现 COMBO 破碎（GDD-03 E2 告知义务）。当前由 death 覆盖 */
    comboBreak: function () {
      tone('triangle', 780, 300, 0.28, 0.14, {});
      noise(0.24, 0.10, { lp: 1800, hp: 400 });
    }

    /* ⛔ 诱饵**被免疫**时刻意**没有音效** —— GDD-02 §5.2 明令：
     *    「（刻意无音效）」「免疫反馈刻意做得平淡」。
     *    这是设计好的静默，不是遗漏。请勿补。                            */
  };

  /* ==================================================================
   * 8 · 对外接口（与旧版完全兼容）
   * ================================================================== */
  var lastAt = {};

  TL.Audio = {
    init: init,
    resume: resume,

    play: function (name) {
      if (!ready()) return;
      var f = SFX[name];
      if (!f) return;
      var gap = COOLDOWN[name];
      if (gap) {
        var t = ctx.currentTime;
        if (lastAt[name] !== undefined && t - lastAt[name] < gap) return;
        lastAt[name] = t;
      }
      try { f(); } catch (e) { /* 单个音效失败绝不影响游戏 */ }
    },

    /** 静音开关：20ms 斜坡（硬切会有 click）。静音后本模块只读不写。 */
    setMuted: function (m) {
      muted = !!m;
      if (!ctx || !master) return;
      var t = ctx.currentTime;
      try {
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(muted ? 0 : MASTER_GAIN, t + 0.02);
      } catch (e) { master.gain.value = muted ? 0 : MASTER_GAIN; }
      if (muted) stopRiser(0.05);
    },

    /** 全部立停（结算页 / 重开时用） */
    stopAll: function () {
      stopRiser(0.03);
      for (var i = live.length - 1; i >= 0; i--) drop(live[i]);
      qteReset();
    },

    /** 音乐层独立开关：真正切断调度（此前只调总线增益，调度器照旧发声）。 */
    setMusicEnabled: function (on) {
      MUS.musicOff = !on;
      if (busMusic && ctx) {
        try {
          busMusic.gain.setTargetAtTime(MUS.musicOff ? 0.0001 : BUS.MUSIC, ctx.currentTime, 0.1);
        } catch (e) { }
      }
    },

    /** 暂停/恢复：整条链挂起，而不是逐个淡出。
     *  tick() 在 ctx.state !== 'running' 时自行停摆，故恢复后不会有积压音符一起冲出。 */
    setSuspended: function (on) {
      if (!ctx) return;
      if (on) {
        stopRiser(0.05);
        if (ctx.state === 'running' && ctx.suspend) ctx.suspend();
      } else if (ctx.state === 'suspended' && ctx.resume) {
        ctx.resume();
      }
    },

    get muted() { return muted; }
  };
})();

</script>
<script>
/* ===== src/renderer/gl.js ===== */
/* =====================================================================
 * TIDELINE · renderer/gl.js
 * WebGL2 上下文 + 薄封装（ADR-001：自研薄渲染层，GLSL ES 1.00 写就，
 * WebGL2 / WebGL1 一套代码通吃，不引入 WebGL2 专属特性）。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});

  function createContext(canvas) {
    var opts = {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false,
      powerPreference: 'high-performance', desynchronized: true
    };
    var gl = canvas.getContext('webgl2', opts);
    var isGL2 = !!gl;
    if (!gl) gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) return null;
    return { gl: gl, isGL2: isGL2 };
  }

  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(s);
      console.error('[shader]', log, '\n', src);
      throw new Error('shader compile failed: ' + log);
    }
    return s;
  }

  function createProgram(gl, vsSrc, fsSrc) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('program link failed: ' + gl.getProgramInfoLog(p));
    }
    // 预取 uniform / attribute 位置
    var u = {}, a = {};
    var nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < nu; i++) {
      var ui = gl.getActiveUniform(p, i);
      var nm = ui.name.replace(/\[0\]$/, '');
      u[nm] = gl.getUniformLocation(p, nm);
    }
    var na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
    for (var j = 0; j < na; j++) {
      var ai = gl.getActiveAttrib(p, j);
      a[ai.name] = gl.getAttribLocation(p, ai.name);
    }
    return { prog: p, u: u, a: a };
  }

  /* NEAREST 纹理，无 mipmap（像素风硬边的前提） */
  function createTexture(gl, w, h, src, filter) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter || gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter || gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    if (src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    return t;
  }

  /* 单通道 Bayer 抖动查找纹理（ADR-004：抖动在 shader 里做，3 行 GLSL） */
  function createBayerTexture(gl, matrix, size) {
    var data = new Uint8Array(size * size);
    for (var i = 0; i < size * size; i++) {
      data[i] = Math.round(matrix[i] / (size * size) * 255);
    }
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    // WebGL2 removed LUMINANCE: use a sized single-channel R8 texture.
    var gl2 = typeof gl.texStorage2D === 'function';
    gl.texImage2D(gl.TEXTURE_2D, 0, gl2 ? gl.R8 : gl.LUMINANCE, size, size, 0,
      gl2 ? gl.RED : gl.LUMINANCE, gl.UNSIGNED_BYTE, data);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    return t;
  }

  /* 渲染目标（RT_WORLD 720x432） */
  function createFBO(gl, w, h) {
    var tex = createTexture(gl, w, h, null, gl.NEAREST);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb: fb, tex: tex, w: w, h: h };
  }

  TL.glx = {
    createContext: createContext,
    createProgram: createProgram,
    createTexture: createTexture,
    createBayerTexture: createBayerTexture,
    createFBO: createFBO
  };
})();

</script>
<script>
/* ===== src/renderer/atlas.js ===== */
/* =====================================================================
 * TIDELINE · renderer/atlas.js
 * MVP 占位图集：程序化生成（不等真实美术资产）。
 * 图集以 **艺术像素** 为单位绘制（1 canvas px = 1 art px = 2 design px），
 * 因此上传后以 NEAREST 采样、按 art px 尺寸绘制，天然硬边。
 * 资产替换只需保证图块坐标对齐偶数（ADR-002 §4）。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;
  var PAL = C.PAL, XP = C.XPAL;

  var ATLAS_W = 512, ATLAS_H = 320;

  /* ---------- ASCII 图章绘制（小素材用，可读性好） ---------- */
  function stamp(p, rows, cmap, ox, oy) {
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      for (var c = 0; c < row.length; c++) {
        var ch = row.charAt(c);
        if (ch === '.' || ch === ' ') continue;
        var col = cmap[ch];
        if (!col) continue;
        p(ox + c, oy + r, 1, 1, col);
      }
    }
  }

  /* ================= 鲨鱼（逐列程序化，84x40 art px，朝右） ================= */
  function sharkProfile(u) {
    // u: 0 = 吻端(右)，1 = 尾端(左)
    var c = 0.34, h;
    if (u < c) {
      var s = (c - u) / c;
      h = Math.pow(Math.max(0, 1 - s * s), 0.55) * (1 - 0.30 * s * s);
    } else {
      var s2 = (u - c) / (1 - c);
      h = Math.pow(Math.max(0, 1 - s2 * s2), 0.62);
    }
    var hh = 15.0 * h;
    if (u > 0.03 && u < 0.94) hh = Math.max(hh, 2.2);
    return hh;
  }
  function sharkSpine(u) {
    return 20 + 3.0 * Math.sin(Math.min(1, u * 1.1) * Math.PI)
      - (u > 0.72 ? 2.2 * (u - 0.72) / 0.28 : 0);
  }

  /* 鲨鱼画布：84x40 本体 + 每边 8 art px 外扩（容纳 3px 描边与鳍尖溢出） */
  var SH_CW = 100, SH_CH = 56, SH_PADX = 8, SH_PADY = 8;

  function drawShark(p, open) {
    var W = 84, H = 40;
    var OX = SH_PADX, OY = SH_PADY;
    /* §4.1.3 配色：背侧 #4A5A6E 雾灰 → #6E7C8C 中灰（上深下浅）；
       腹侧 #C7CFD8 银灰 → #F2F5F8 纸白；描边 #0A0E17 深渊黑 3px */
    var top = PAL.STEEL, mid = PAL.ASH, belly = PAL.PALE, hi = PAL.WHITE;
    var fin = PAL.SLATE, dk = PAL.BLACK, mouth = PAL.DEEP2;
    var x, u, hh, sp, yT, yB, band;

    /* 先收集图元，最后统一补 3px 外描边（验收项 P-06） */
    var cells = [];
    function q(ax, ay, aw, ah, col) { cells.push(ax | 0, ay | 0, aw | 0, ah | 0, col); }

    // 躯干
    for (x = 0; x < W; x++) {
      u = 1 - x / (W - 1);
      hh = sharkProfile(u);
      if (hh <= 0.15) continue;
      sp = sharkSpine(u);
      yT = Math.round(sp - hh); yB = Math.round(sp + hh);
      if (yB < yT) yB = yT;
      q(x, yT, 1, yB - yT + 1, mid);
      band = Math.max(1, Math.round(hh * 0.42));
      if (band * 2 < (yB - yT + 1)) {
        q(x, yT, 1, band, top);
        q(x, yB - band + 1, 1, band, belly);
        if (band >= 3) q(x, yB, 1, 1, hi);      // 腹侧最下高光（§4.1.3 腹侧 → 纸白）
      }
    }

    // 尾鳍（新月形，尾端最高）
    for (x = 0; x <= 13; x++) {
      var k = x / 13;
      var up = 16 * (1 - 0.55 * k), dn = 9 * (1 - 0.55 * k);
      sp = sharkSpine(1 - x / (W - 1));
      q(x, Math.round(sp - up), 1, Math.round(up + dn), x < 4 ? fin : mid);
    }
    q(0, 3, 2, 3, fin);   // 上叶尖加暗

    // 背鳍
    for (x = 31; x <= 52; x++) {
      var t = (52 - x) / 21;
      var fh = 12 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.6)), 1.1);
      if (fh < 0.6) continue;
      u = 1 - x / (W - 1); hh = sharkProfile(u); sp = sharkSpine(u);
      q(x, Math.round(sp - hh - fh), 1, Math.ceil(fh) + 1, fin);
    }
    // 胸鳍（腹面，后掠）
    for (x = 46; x <= 64; x++) {
      var t2 = (64 - x) / 18;
      var fh2 = 9 * Math.pow(Math.sin(Math.PI * Math.pow(t2, 0.7)), 1.0);
      if (fh2 < 0.6) continue;
      u = 1 - x / (W - 1); hh = sharkProfile(u); sp = sharkSpine(u);
      q(x, Math.round(sp + hh), 1, Math.ceil(fh2), fin);
    }
    // 第二背鳍 / 臀鳍
    for (x = 14; x <= 23; x++) {
      u = 1 - x / (W - 1); hh = sharkProfile(u); sp = sharkSpine(u);
      q(x, Math.round(sp - hh - 4), 1, 4, fin);
    }
    for (x = 17; x <= 25; x++) {
      u = 1 - x / (W - 1); hh = sharkProfile(u); sp = sharkSpine(u);
      q(x, Math.round(sp + hh), 1, 3, fin);
    }

    // 鳃裂
    for (var gi = 0; gi < 3; gi++) {
      var gx = 66 - gi * 3;
      u = 1 - gx / (W - 1); sp = sharkSpine(u);
      q(gx, Math.round(sp - 4), 1, 5, fin);
    }

    // 眼（眼白 + 瞳）—— 黑色喜剧：死鱼眼，不做凶相
    var ex = 76;
    u = 1 - ex / (W - 1); sp = sharkSpine(u);
    q(ex, Math.round(sp - 4), 2, 2, hi);
    q(ex + 1, Math.round(sp - 4) + 1, 1, 1, dk);

    // 嘴
    if (open) {
      for (x = 69; x <= 83; x++) {
        u = 1 - x / (W - 1); hh = sharkProfile(u);
        if (hh < 0.8) continue;
        sp = sharkSpine(u);
        var tt = (x - 69) / 14;
        var mh = hh * (0.35 + 0.75 * tt);
        var y0 = Math.round(sp + hh * 0.05);
        q(x, y0, 1, Math.max(1, Math.round(mh)), mouth);
        if ((x % 4) === 1) q(x, y0, 1, 2, hi);   // 齿（喜剧，非獠牙）
      }
    } else {
      for (x = 70; x <= 82; x++) {
        u = 1 - x / (W - 1); hh = sharkProfile(u);
        if (hh < 1) continue;
        sp = sharkSpine(u);
        q(x, Math.round(sp + hh * 0.62), 1, 1, dk);
      }
    }

    /* ---- 3px 深渊黑外描边（P-06：鲨鱼描边 3px #0A0E17）---- */
    var m = new Uint8Array(SH_CW * SH_CH), i, cx, cy, dx, dy, nx, ny;
    for (i = 0; i < cells.length; i += 5) {
      var ax = cells[i] + OX, ay = cells[i + 1] + OY;
      var aw = cells[i + 2], ah = cells[i + 3];
      for (cy = ay; cy < ay + ah; cy++) {
        if (cy < 0 || cy >= SH_CH) continue;
        for (cx = ax; cx < ax + aw; cx++) {
          if (cx < 0 || cx >= SH_CW) continue;
          m[cy * SH_CW + cx] = 1;
        }
      }
    }
    var ring = new Uint8Array(SH_CW * SH_CH);
    for (cy = 0; cy < SH_CH; cy++) {
      for (cx = 0; cx < SH_CW; cx++) {
        if (!m[cy * SH_CW + cx]) continue;
        for (dy = -3; dy <= 3; dy++) {
          ny = cy + dy; if (ny < 0 || ny >= SH_CH) continue;
          for (dx = -3; dx <= 3; dx++) {
            nx = cx + dx; if (nx < 0 || nx >= SH_CW) continue;
            ring[ny * SH_CW + nx] = 1;
          }
        }
      }
    }
    // 按行合并连续段，减少 fillRect 调用
    for (cy = 0; cy < SH_CH; cy++) {
      cx = 0;
      while (cx < SH_CW) {
        if (ring[cy * SH_CW + cx] && !m[cy * SH_CW + cx]) {
          var run = cx;
          while (cx < SH_CW && ring[cy * SH_CW + cx] && !m[cy * SH_CW + cx]) cx++;
          p(run, cy, cx - run, 1, dk);
        } else cx++;
      }
    }

    /* ---- 实体像素（覆盖描边内侧）---- */
    for (i = 0; i < cells.length; i += 5) {
      p(cells[i] + OX, cells[i + 1] + OY, cells[i + 2], cells[i + 3], cells[i + 4]);
    }
  }

  /* ================= 素材定义 ================= */
  function build() {
    var cv = document.createElement('canvas');
    cv.width = ATLAS_W; cv.height = ATLAS_H;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, ATLAS_W, ATLAS_H);

    var defs = {};
    var px = 2, py = 2, rowH = 0;

    function alloc(w, h) {
      if (px + w + 2 > ATLAS_W) { px = 2; py += rowH + 2; rowH = 0; }
      var r = { x: px, y: py, w: w, h: h };
      px += w + 2; if (h > rowH) rowH = h;
      return r;
    }
    function add(name, w, h, fn) {
      var rect = alloc(w, h);
      ctx.save();
      ctx.beginPath(); ctx.rect(rect.x, rect.y, w, h); ctx.clip();
      ctx.translate(rect.x, rect.y);
      var p = function (x, y, ww, hh2, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, ww | 0, hh2 | 0); };
      fn(p, w, h);
      ctx.restore();
      defs[name] = rect;
      return rect;
    }

    /* ---- 鲨鱼 ---- */
    add('shark', SH_CW, SH_CH, function (p) { drawShark(p, false); });
    add('shark_bite', SH_CW, SH_CH, function (p) { drawShark(p, true); });

    /* ---- 猎物 ---- */
    var CM = {
      '.': null, S: XP.SKIN, s: XP.SKIN, H: XP.HAIR, E: PAL.BLACK,
      T: PAL.CYAN, W: PAL.WHITE, A: PAL.AMBER, G: XP.GOLD, L: PAL.BLOOD
    };

    add('swimmer', 12, 18, function (p) {
      stamp(p, [
        '....HHHH....',
        '...HHHHHH...',
        '...HSSSSH...',
        '...SSSSSS...',
        '...SESSES...',
        '...SSSSSS...',
        '..SSSSSSSS..',
        '.SSSSSSSSSS.',
        'SS.SSSSSS.SS',
        'SS.SSSSSS.SS',
        '...TTTTTT...',
        '...TTTTTT...',
        '...SS..SS...',
        '...SS..SS...',
        '..SS....SS..',
        '.WWWWWWWWWW.',
        'WW.WWWWWW.WW',
        '..WW....WW..'
      ], CM, 0, 0);
    });

    add('surfer', 20, 16, function (p) {
      stamp(p, [
        '.......HHH..........',
        '......HHHHH.........',
        '......HSSSH.........',
        '......SSSSS.........',
        '......SESSE.........',
        '.....SSSSSSS........',
        '..S..SSSSSSS..S.....',
        '.SSS.SSSSSSS.SSS....',
        '..S..TTTTTTT..S.....',
        '.....TTTTTTT........',
        '.....SS...SS........',
        '....SS.....SS.......',
        '...SS.......SS......',
        '.AAAAAAAAAAAAAAAAAA.',
        'AAAAAAAAAAAAAAAAAAAA',
        '.WWWWWWWWWWWWWWWWWW.'
      ], CM, 0, 0);
    });

    add('sunbather', 20, 10, function (p) {
      stamp(p, [
        '..HHH...............',
        '..SSS...............',
        '..SES....TTTTTT.....',
        '..SSS..TTTTTTTTTT...',
        '...SSSSSSSSSSSSSSS..',
        '...SSSSSSSSSSSSSSS..',
        '..SSSSSSSSSSSSSSSS..',
        '..SS..SS.......SS...',
        '.WWWWWWWWWWWWWWWWWW.'
      ], CM, 0, 0);
    });

    add('lifeguard', 12, 17, function (p) {
      stamp(p, [
        '....HHHH....',
        '...HHHHHH...',
        '...HSSSSH...',
        '...SSSSSS...',
        '...SESSES...',
        '...SSSSSS...',
        '..AAAAAAAA..',
        '..AAWWWWAA..',
        '..AAAAAAAA..',
        '..AAAAAAAA..',
        '..AAAAAAAA..',
        '...WWWWWW...',
        '...SS..SS...',
        '...SS..SS...',
        '..SS....SS..',
        '.WWWWWWWWWW.'
      ], CM, 0, 0);
    });

    add('carried', 12, 12, function (p) {
      stamp(p, [
        '..SS....SS..',
        '...SSSSSS...',
        '..SSSSSSSS..',
        '...SESSES...',
        '...SSSSSS...',
        '..TTTTTTTT..',
        '..TTTTTTTT..',
        '...SSSSSS...',
        '...SS..SS...',
        '..SS....SS..',
        '.SS......SS.'
      ], CM, 0, 0);
    });

    /* ---- 敌人 / 障碍 ---- */
    add('tire', 16, 12, function (p) {
      p(0, 3, 16, 6, PAL.SLATE);
      p(2, 1, 12, 10, PAL.SLATE);
      p(3, 0, 10, 12, PAL.SLATE);
      p(5, 3, 6, 6, PAL.DEEP);
      p(6, 4, 4, 4, PAL.DEEP);

    add('pickup_ring', 14, 12, function (p) {

    return { canvas: cv, defs: defs, w: ATLAS_W, h: ATLAS_H };
  }

  TL.buildAtlas = build;

<script>
/* ===== src/renderer/batcher.js ===== */
/* =====================================================================
 * TIDELINE · renderer/batcher.js
 * 纹理四边形批处理器。只有两种混合模式 → 2 个桶 → 世界渲染 2 个 draw call
 * （ADR-001 §2.1：单帧绘制调用 2–4）。
 *
 * 顶点格式（8 floats）：x, y (art px, y 向下), u, v, r, g, b, a
 *   rgb = tint 乘子；a = 「覆盖度」→ 与 Bayer 8x8 比较做 discard
 *   ⇒ 淡出一律走有序抖动，绝不使用 alpha 渐变（ADR-004 硬约束）
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C;

  var VS = [
    'attribute vec2 a_pos;',
    'attribute vec2 a_uv;',
    'attribute vec4 a_tint;',
    'uniform vec2 u_res;',
    'varying vec2 v_uv;',
    'varying vec4 v_tint;',
    'void main(){',
    '  vec2 c = vec2(a_pos.x / u_res.x * 2.0 - 1.0, 1.0 - a_pos.y / u_res.y * 2.0);',
    '  gl_Position = vec4(c, 0.0, 1.0);',
    '  v_uv = a_uv; v_tint = a_tint;',
    '}'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'uniform sampler2D u_tex;',
    'uniform sampler2D u_bayer;',
    'uniform float u_bayerScale;',
    'uniform float u_ditherOn;',
    'varying vec2 v_uv;',
    'varying vec4 v_tint;',
    'void main(){',
    '  vec4 t = texture2D(u_tex, v_uv);',
    '  if (t.a < 0.02) discard;',
    '  if (u_ditherOn > 0.5 && v_tint.a < 0.999) {',
    '    float b = texture2D(u_bayer, gl_FragCoord.xy * u_bayerScale).r;',
    '    if (b > v_tint.a) discard;',
    '  }',
    '  gl_FragColor = vec4(t.rgb * v_tint.rgb, t.a);',
    '}'
  ].join('\n');

  var FLOATS = 8, VERTS = 6;
  var MAX_QUADS = 4096;

  function Bucket(gl) {
    this.gl = gl;
    this.data = new Float32Array(MAX_QUADS * VERTS * FLOATS);
    this.n = 0;                 // 顶点数
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
  }
  Bucket.prototype.reset = function () { this.n = 0; };

  function Batcher(gl, atlasTex, bayerTex) {
    this.gl = gl;
    this.tex = atlasTex;
    this.bayer = bayerTex;
    this.prog = TL.glx.createProgram(gl, VS, FS);
    this.over = new Bucket(gl);
    this.add = new Bucket(gl);

    this.resW = C.RT_W; this.resH = C.RT_H;
    this.scale = 1 / C.ART_SCALE;
    this.camX = 0; this.camY = 0;
    this.ditherOn = 1;
    this.bayerScale = 1 / 8;
    this.rects = null;
    this.texW = 1; this.texH = 1;
    this.drawCalls = 0;
  }

  Batcher.prototype.setAtlas = function (rects, texW, texH) {
    this.rects = rects; this.texW = texW; this.texH = texH;
  };

  /* space: 'world'（design px → art px，减相机）| 'screen'（design px 直出 1440x864） */
  Batcher.prototype.begin = function (space, camX, camY) {
    this.over.reset(); this.add.reset();
    this.drawCalls = 0;
    if (space === 'screen') {
      this.resW = C.DESIGN_W; this.resH = C.DESIGN_H;
      this.scale = 1; this.camX = 0; this.camY = 0;
      this.bayerScale = 1 / 16;   // 显示空间下抖动单元放大，观感与艺术网格接近
    } else {
      this.resW = C.RT_W; this.resH = C.RT_H;
      this.scale = 1 / C.ART_SCALE;
      this.camX = camX || 0; this.camY = camY || 0;
      this.bayerScale = 1 / 8;    // 屏幕锚定在艺术网格上（1 抖动单元 = 8 art px）
    }
  };

  /* opts: rot(rad) flipU flipV tint[3] fade(0..1) bucket('over'|'add') pivot[2] */
  Batcher.prototype.draw = function (name, wx, wy, dw, dh, opts) {
    var r = this.rects[name];
    if (!r) return;
    var o = opts || EMPTY;
    var bucket = (o.bucket === 'add') ? this.add : this.over;
    if (bucket.n + VERTS > MAX_QUADS * VERTS) return;

    var sc = this.scale;
    var w = Math.max(1, Math.round(dw * sc));
    var h = Math.max(1, Math.round(dh * sc));
    var cx = Math.round((wx - this.camX) * sc);
    var cy = Math.round((wy - this.camY) * sc);

    var piv = o.pivot;
    var pxf = piv ? piv[0] : 0.5, pyf = piv ? piv[1] : 0.5;
    var x0 = -w * pxf, y0 = -h * pyf, x1 = w * (1 - pxf), y1 = h * (1 - pyf);

    var rot = o.rot || 0;
    var co = 1, si = 0;
    if (rot) { co = Math.cos(rot); si = Math.sin(rot); }

    // UV（内缩半纹素，NEAREST 下的安全边界）
    var iu = 0.5 / this.texW, iv = 0.5 / this.texH;
    var u0 = (r.x + 0.5) / this.texW, v0 = (r.y + 0.5) / this.texH;
    var u1 = (r.x + r.w - 0.5) / this.texW, v1 = (r.y + r.h - 0.5) / this.texH;
    if (o.flipU) { var tu = u0; u0 = u1; u1 = tu; }
    if (o.flipV) { var tv = v0; v0 = v1; v1 = tv; }

    var t = o.tint;
    var tr = t ? t[0] : 1, tg = t ? t[1] : 1, tb = t ? t[2] : 1;
    var ta = (o.fade === undefined) ? 1 : o.fade;

    var d = bucket.data;
    var i = bucket.n * FLOATS;
    // 4 角：左上 右上 右下 / 左上 右下 左下
    var lx = [x0, x1, x1, x0, x1, x0];
    var ly = [y0, y0, y1, y0, y1, y1];
    var uu = [u0, u1, u1, u0, u1, u0];
    var vv = [v0, v0, v1, v0, v1, v1];
    for (var k = 0; k < 6; k++) {
      var rx = lx[k] * co - ly[k] * si;
      var ry = lx[k] * si + ly[k] * co;
      d[i] = cx + rx; d[i + 1] = cy + ry;
      d[i + 2] = uu[k]; d[i + 3] = vv[k];
      d[i + 4] = tr; d[i + 5] = tg; d[i + 6] = tb; d[i + 7] = ta;
      i += FLOATS;
    }
    bucket.n += VERTS;
  };

  var EMPTY = {};

  Batcher.prototype._flushBucket = function (b) {
    if (b.n === 0) return;
    var gl = this.gl, P = this.prog;
    gl.bindBuffer(gl.ARRAY_BUFFER, b.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, b.data.subarray(0, b.n * FLOATS));
    var stride = FLOATS * 4;
    gl.enableVertexAttribArray(P.a.a_pos);
    gl.vertexAttribPointer(P.a.a_pos, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(P.a.a_uv);
    gl.vertexAttribPointer(P.a.a_uv, 2, gl.FLOAT, false, stride, 8);
    gl.enableVertexAttribArray(P.a.a_tint);
    gl.vertexAttribPointer(P.a.a_tint, 4, gl.FLOAT, false, stride, 16);
    gl.drawArrays(gl.TRIANGLES, 0, b.n);
    this.drawCalls++;
  };

  Batcher.prototype.flush = function () {
    var gl = this.gl, P = this.prog;
    gl.useProgram(P.prog);
    gl.uniform2f(P.u.u_res, this.resW, this.resH);
    gl.uniform1f(P.u.u_ditherOn, this.ditherOn);
    gl.uniform1f(P.u.u_bayerScale, this.bayerScale);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.uniform1i(P.u.u_tex, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.bayer);
    gl.uniform1i(P.u.u_bayer, 1);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);   // SOURCE_OVER 桶
    this._flushBucket(this.over);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);                   // ADD 桶（光效）
    this._flushBucket(this.add);
    gl.disable(gl.BLEND);
  };

  TL.Batcher = Batcher;
})();

</script>
<script>
/* ===== src/renderer/post.js ===== */
/* =====================================================================
 * TIDELINE · renderer/post.js
 * CRT 后期：桶形弯曲 + 色差 + 扫描线 + 暗角 + 整屏去饱和/色闪 + 危险染红。
 *
 * 关键实现约定（ADR-002 §2.4 第 3 条）：
 *   扫描线在 **L1 艺术网格** 上计算（用形变后的 RT 坐标取行号），
 *   因此它与画面内容一起被弯曲、被 ×2 整数放大，永久免疫摩尔纹。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});

  var VS = [
    'attribute vec2 a_pos;',
    'varying vec2 v_uv;',
    'void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'varying vec2 v_uv;',
    'uniform sampler2D u_tex;',
    'uniform vec2  u_inRes;',
    'uniform float u_time;',
    'uniform float u_crt;',       // 0 = 直通（LOW 档 / CRT 开关关闭）
    'uniform float u_curve;',     // 桶形曲率 0.08–0.12
    'uniform float u_ca;',        // 色差，单位 = art px，边缘最大
    'uniform float u_scan;',      // 扫描线强度 0..1
    'uniform float u_jitter;',    // 扫描线抖动 0..1（≤2Hz 时间量化）
    'uniform float u_vig;',       // 暗角
    'uniform float u_desat;',     // 去饱和 0..1（搁浅 QTE 的「只剩灰与白」）
    'uniform float u_flash;',     // 整屏色闪 0..1（呼吸式，非硬 on/off）
    'uniform vec3  u_flashCol;',
    'uniform float u_danger;',    // T3 围剿档边缘染红
    '',
    'void main(){',
    '  vec2 uv = v_uv;',
    '  vec2 uvd = uv;',
    '  if (u_crt > 0.5) {',
    '    vec2 q = uv * 2.0 - 1.0;',
    '    float r2 = dot(q, q);',
    '    vec2 qd = q * (1.0 + u_curve * r2);',
    '    uvd = qd * 0.5 + 0.5;',
    '    float rowJ = floor((1.0 - uv.y) * u_inRes.y);',
    '    float jn = 0.5 + 0.5 * sin(rowJ * 0.17 + u_time * 6.2831853);',
    '    uvd.x += (jn - 0.5) * u_jitter * 2.0 / u_inRes.x;',
    '  }',
    '  vec3 col;',
    '  if (u_crt > 0.5) {',
    '    vec2 qd2 = uvd * 2.0 - 1.0;',
    '    float r2b = dot(qd2, qd2);',
    '    vec2 dir = qd2 / max(length(qd2), 0.0001);',
    '    vec2 off = dir * (u_ca * clamp(r2b, 0.0, 1.6)) / u_inRes;',
    '    float rc = texture2D(u_tex, uvd + off).r;',
    '    vec4  gc = texture2D(u_tex, uvd);',
    '    float bc = texture2D(u_tex, uvd - off).b;',
    '    col = vec3(rc, gc.g, bc);',
    '    if (uvd.x < 0.0 || uvd.x > 1.0 || uvd.y < 0.0 || uvd.y > 1.0) col = vec3(0.039, 0.055, 0.090);',
    '  } else {',
    '    col = texture2D(u_tex, uvd).rgb;',
    '  }',
    // 扫描线：行号取自 **形变后的 L1 坐标** → 与画面一起弯曲，锁定艺术网格
    '  if (u_scan > 0.001) {',
    '    float row = floor((1.0 - uvd.y) * u_inRes.y);',
    '    col *= 1.0 - u_scan * 0.34 * mod(row, 2.0);',
    '  }',
    '  vec2 vv = uv - 0.5;',
    '  float dd = dot(vv, vv);',
    '  col *= clamp(1.0 - u_vig * 1.15 * dd, 0.0, 1.0);',
    '  col = mix(col, vec3(0.85, 0.10, 0.10), u_danger * 0.08 * smoothstep(0.04, 0.34, dd));',
    '  col += u_flashCol * u_flash;',
    '  if (u_desat > 0.001) {',
    '    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));',
    '    col = mix(col, vec3(l), u_desat);',
    '  }',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function Post(gl, inW, inH) {
    this.gl = gl;
    this.prog = TL.glx.createProgram(gl, VS, FS);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1, 3, -1, -1, 3
    ]), gl.STATIC_DRAW);
    this.inW = inW; this.inH = inH;

    this.curve = 0.10;
    this.ca = 1.5;
    this.scan = 1.0;
    this.jitter = 1.0;
    this.vig = 1.0;
    this.desat = 0;
    this.flash = 0;
    this.flashCol = [0, 0, 0];
    this.danger = 0;
    this.crt = 1;
    this.time = 0;
  }

  Post.prototype.draw = function (tex, outW, outH) {
    var gl = this.gl, P = this.prog;
    gl.viewport(0, 0, outW, outH);
    gl.useProgram(P.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.enableVertexAttribArray(P.a.a_pos);
    gl.vertexAttribPointer(P.a.a_pos, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(P.u.u_tex, 0);
    gl.uniform2f(P.u.u_inRes, this.inW, this.inH);
    gl.uniform1f(P.u.u_time, this.time);
    gl.uniform1f(P.u.u_crt, this.crt);
    gl.uniform1f(P.u.u_curve, this.curve);
    gl.uniform1f(P.u.u_ca, this.ca);
    gl.uniform1f(P.u.u_scan, this.scan);
    gl.uniform1f(P.u.u_jitter, this.jitter);
    gl.uniform1f(P.u.u_vig, this.vig);
    gl.uniform1f(P.u.u_desat, this.desat);
    gl.uniform1f(P.u.u_flash, this.flash);
    gl.uniform3f(P.u.u_flashCol, this.flashCol[0], this.flashCol[1], this.flashCol[2]);
    gl.uniform1f(P.u.u_danger, this.danger);
    gl.disable(gl.BLEND);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  TL.Post = Post;
})();

</script>
<script>
/* ===== src/game/world.js ===== */
/* =====================================================================
 * TIDELINE · game/world.js
 * 海床剖面（ADR-003 §2.1/§2.2）+ 水面线 + 四层水体区域。
 *
 * ⚠ 关键分离（ADR-003）：区域归属用 **静态海床**（稳定，驱动 ALARM/敌人生成），
 *   接触与搁浅判定用 **动态水面**（可玩，让潮线真正影响手感）。
 *
 * 设计取舍说明：GDD-01 用四个 X 区间（0–750/750–1650/1650–2550/2550–3000），
 * ADR-003 用「由海床水深导出」。二者在本文件合并 —— 海床控制点被推导成让
 * 导出的分界 **恰好落在 750 / 1650 / 2550**，于是单一真源与 GDD 数值同时成立。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;

  var STEP = 4;                       // LUT 采样步长（design px）
  var N = 0;
  var SEABED = null;
  var ZONE = null;
  var shoreX = 0;

  function hermite(p0, p1, m0, m1, h, t) {
    var t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * p0
      + (t3 - 2 * t2 + t) * h * m0
      + (-2 * t3 + 3 * t2) * p1
      + (t3 - t2) * h * m1;
  }

  function build() {
    var pts = C.SEABED_PTS, n = pts.length;
    N = Math.floor(C.WORLD_W / STEP) + 2;
    SEABED = new Float32Array(N);
    ZONE = new Uint8Array(N);

    // 非均匀 Catmull-Rom 切线
    var m = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      if (i === 0) m[i] = (pts[1][1] - pts[0][1]) / (pts[1][0] - pts[0][0]);
      else if (i === n - 1) m[i] = (pts[i][1] - pts[i - 1][1]) / (pts[i][0] - pts[i - 1][0]);
      else m[i] = (pts[i + 1][1] - pts[i - 1][1]) / (pts[i + 1][0] - pts[i - 1][0]);
    }

    var prev = Infinity;
    var seg = 0;
    for (var k = 0; k < N; k++) {
      var x = k * STEP;
      while (seg < n - 2 && x > pts[seg + 1][0]) seg++;
      var x0 = pts[seg][0], x1 = pts[seg + 1][0];
      var h = x1 - x0;
      var t = U.clamp((x - x0) / h, 0, 1);
      var y = hermite(pts[seg][1], pts[seg + 1][1], m[seg], m[seg + 1], h, t);
      // 单调钳制：海床随 x 单调抬升（y 单调减小），杜绝 Catmull-Rom 过冲
      if (y > prev) y = prev;
      prev = y;
      SEABED[k] = y;
    }

    // 区域表（静态水深导出）
    for (var q = 0; q < N; q++) {
      var depth = SEABED[q] - C.WATER_BASE;
      var z;
      if (depth >= C.ZONE_DEPTH_DEEP) z = C.ZONE.DEEP;
      else if (depth >= C.ZONE_DEPTH_SHALLOW) z = C.ZONE.SHALLOW;
      else if (depth > 0) z = C.ZONE.SURF;
      else z = C.ZONE.BEACH;
      ZONE[q] = z;
    }

    // 潮线：海床穿过水面处
    shoreX = C.WORLD_W;
    for (var s = 0; s < N; s++) {
      if (SEABED[s] <= C.WATER_BASE) { shoreX = s * STEP; break; }
    }
  }

  function seabedY(x) {
    if (!SEABED) build();
    var f = x / STEP;
    if (f <= 0) return SEABED[0];
    if (f >= N - 1) return SEABED[N - 1];
    var i = f | 0, t = f - i;
    return SEABED[i] + (SEABED[i + 1] - SEABED[i]) * t;
  }

  function depthAt(x) { return seabedY(x) - C.WATER_BASE; }

  function zoneAtRaw(x) {
    if (!SEABED) build();
    var i = Math.round(x / STEP);
    return ZONE[U.clamp(i, 0, N - 1)];
  }

  /* 带迟滞的区域查询：边界附近取前后 ZONE_HYST 两点，不一致则维持原值 */
  function zoneAt(x, prevZone) {
    var a = zoneAtRaw(x - C.ZONE_HYST);
    var b = zoneAtRaw(x + C.ZONE_HYST);
    if (a === b) return a;
    if (prevZone === undefined || prevZone === null) return zoneAtRaw(x);
    return prevZone;
  }

  /* 动态水面（接触/搁浅判定用） */
  function waterLineY(x, t) {
    var depth = depthAt(x);
    var damp = U.clamp(depth / 60, 0, 1);          // 浅水处波浪衰减（破浪）
    return C.WATER_BASE
      + C.WAVE_AMP * damp * Math.sin(U.TAU * (x + t * C.WAVE_SPEED) / C.WAVE_LEN);
  }

  TL.World = {
    build: build,
    seabedY: seabedY,
    depthAt: depthAt,
    zoneAt: zoneAt,
    zoneAtRaw: zoneAtRaw,
    waterLineY: waterLineY,
    get shoreX() { if (!SEABED) build(); return shoreX; },
    STEP: STEP
  };
})();

</script>
<script>
/* ===== src/game/particles.js ===== */
/* =====================================================================
 * TIDELINE · game/particles.js
 * 硬边方块粒子池。淡出一律走 **有序抖动**（shader 里 discard），
 * 绝不使用 alpha 渐变（ADR-004 硬约束）。
 * 尺寸只允许 1 / 2 / 3 art px（= 2 / 4 / 6 design px），保持像素纯度。
 * 对象池预分配 → 热路径零分配（ADR-001 §3.3）。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;

  var MAX = 520;
  var P = {
    x: new Float32Array(MAX), y: new Float32Array(MAX),
    vx: new Float32Array(MAX), vy: new Float32Array(MAX),
    life: new Float32Array(MAX), max: new Float32Array(MAX),
    g: new Float32Array(MAX), drag: new Float32Array(MAX),
    size: new Uint8Array(MAX),           // art px
    r: new Float32Array(MAX), g_: new Float32Array(MAX), b: new Float32Array(MAX),
    add: new Uint8Array(MAX),
    n: 0
  };
  var rings = [];   // 冲击波环（DECOY BREACH）
  var density = 1;  // 粒子密度开关 0 / 0.5 / 1

  function reset() { P.n = 0; rings.length = 0; }

  function spawn(x, y, vx, vy, life, size, col, isAdd, g, drag) {
    if (density <= 0 || P.n >= MAX) return -1;
    var i = P.n++;
    P.x[i] = x; P.y[i] = y; P.vx[i] = vx; P.vy[i] = vy;
    P.life[i] = life; P.max[i] = life;
    P.g[i] = g === undefined ? 0 : g;
    P.drag[i] = drag === undefined ? 1.2 : drag;
    P.size[i] = size;
    P.r[i] = col[0]; P.g_[i] = col[1]; P.b[i] = col[2];
    P.add[i] = isAdd ? 1 : 0;
    return i;
  }

  function update(dt) {
    for (var i = P.n - 1; i >= 0; i--) {
      P.life[i] -= dt;
      if (P.life[i] <= 0) {
        var last = --P.n;
        if (i !== last) {
          P.x[i] = P.x[last]; P.y[i] = P.y[last];
          P.vx[i] = P.vx[last]; P.vy[i] = P.vy[last];
          P.life[i] = P.life[last]; P.max[i] = P.max[last];
          P.g[i] = P.g[last]; P.drag[i] = P.drag[last];
          P.size[i] = P.size[last];
          P.r[i] = P.r[last]; P.g_[i] = P.g_[last]; P.b[i] = P.b[last];
          P.add[i] = P.add[last];
        }
        continue;
      }
      P.vy[i] += P.g[i] * dt;
      var d = 1 - P.drag[i] * dt;
      if (d < 0) d = 0;
      P.vx[i] *= d; P.vy[i] *= d;
      P.x[i] += P.vx[i] * dt;
      P.y[i] += P.vy[i] * dt;
    }
    for (var k = rings.length - 1; k >= 0; k--) {
      var r = rings[k];
      r.t += dt;
      if (r.t >= r.dur) rings.splice(k, 1);
    }
  }

  function draw(B) {
    var sprite = ['dot1', 'dot2', 'dot3'];
    for (var i = 0; i < P.n; i++) {
      var fade = P.life[i] / P.max[i];
      var s = sprite[P.size[i] - 1] || 'dot2';
      var sz = P.size[i] * C.ART_SCALE;   // art px → design px
      B.draw(s, P.x[i], P.y[i], sz, sz, {
