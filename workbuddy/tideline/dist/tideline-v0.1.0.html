        tint: [P.r[i], P.g_[i], P.b[i]],
        fade: fade,
        bucket: P.add[i] ? 'add' : 'over'
      });
    }
    for (var k = 0; k < rings.length; k++) {
      var r = rings[k];
      var t = r.t / r.dur;
      var rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - t, 2));
      var fade = 1 - t;
      var count = Math.max(8, Math.round(rad / 9));
      for (var j = 0; j < count; j++) {
        var a = (j / count) * U.TAU;
        var px = r.x + Math.cos(a) * rad;
        var py = r.y + Math.sin(a) * rad * 0.55;   // 水面处压扁
        B.draw('dot2', px, py, 4, 4, { tint: r.col, fade: fade, bucket: 'add' });
      }
    }
  }

  /* ---------------- 发射器 ---------------- */
  function scaleCount(n) {
    var c = Math.round(n * density);
    return c < 1 ? 0 : c;
  }

  function splash(x, y, count, col, power) {
    count = scaleCount(count);
    for (var i = 0; i < count; i++) {
      var a = -Math.PI * 0.15 - U.rand() * Math.PI * 0.7;
      var sp = power * (0.45 + U.rand() * 0.75);
      spawn(x + U.rr(-8, 8), y + U.rr(-4, 4),
        Math.cos(a) * sp * (U.rand() < 0.5 ? -1 : 1), Math.sin(a) * sp * 1.15,
        0.35 + U.rand() * 0.45, U.ri(1, 2), col, false, 520, 1.6);
    }
  }

  /* 捕食：洋红径向溅射（GDD-03 §5.2，0.6s，不留残留） */
  function predation(x, y) {
    var col = U.hex2rgb(C.PAL.MAGENTA);
    var n = scaleCount(22);
    for (var i = 0; i < n; i++) {
      var a = U.rand() * U.TAU;
      var sp = 90 + U.rand() * 230;
      spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.32 + U.rand() * 0.28, U.ri(1, 3), col, false, 120, 2.6);
    }
  }

  function sandPuff(x, y, count) {
    count = scaleCount(count);
    var col = U.hex2rgb(C.PAL.PALE);
    for (var i = 0; i < count; i++) {
      var a = -Math.PI * 0.5 + U.rr(-1.1, 1.1);
      var sp = 30 + U.rand() * 90;
      spawn(x + U.rr(-14, 14), y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.3 + U.rand() * 0.4, U.ri(1, 2), col, false, 260, 1.8);
    }
  }

  function bubble(x, y) {
    var col = U.hex2rgb(C.PAL.PALE);
    spawn(x, y, U.rr(-14, 14), U.rr(-40, -12), 0.5 + U.rand() * 0.5, 1, col, false, -20, 0.8);
  }

  /* DECOY BREACH：环形冲击波（0→180px，0.4s，在水面线处截断） */
  function shockRing(x, y, r1) {
    if (density <= 0.01) return;
    rings.push({ x: x, y: y, r0: 6, r1: r1 || 180, t: 0, dur: 0.4, col: U.hex2rgb(C.PAL.WHITE) });
  }

  function setDensity(d) { density = U.clamp(Number(d) || 0, 0, 1); if (!density) reset(); }

  TL.FX = {
    reset: reset, update: update, draw: draw,
    splash: splash, predation: predation, sandPuff: sandPuff,
    bubble: bubble, shockRing: shockRing, setDensity: setDensity,
    get count() { return P.n; }
  };
})();

</script>
<script>
/* ===== src/game/shark.js ===== */
/* =====================================================================
 * TIDELINE · game/shark.js
 * 鲨鱼状态机与运动（GDD-01）。
 *
 * 一句话模型：**速率由状态定、方向由玩家定**（GDD-01 §3.1）。
 * 玩家永远不能让鲨鱼停下来，只能改变它往哪儿走。
 * 允许速率为 0 的状态只有四个：Stunned / Snared / Beached / Dead。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U, W = TL.World;

  var D2R = Math.PI / 180, R2D = 180 / Math.PI;

  function create() {
    return {
      x: 380, y: 470, theta: 0, speed: 0,
      state: 'cruise',
      alive: true,

      carry: [],              // 战利品类型 id 数组
      get carryK() { return this.carry.length; },

      stamina: C.STAMINA_MAX,
      dashT: -1, dashCd: 0, dashTheta0: 0, dashBites: 0, dashFromY: 0,
      biteT: 0,
      stunT: 0, snareT: 0, slowT: 0, iframeT: 0,
      shakeCd: 0,
      surf: false,
      grounded: false, airborne: false,
      strandT: 0, strandWarn: false,
      zone: C.ZONE.DEEP,
      pendingScore: 0,
      frozenExternalTimers: false,
      trailAcc: 0,
      netSeed: 0
    };
  }

  function reset(s) {
    s.x = 380; s.y = 470; s.theta = 0; s.speed = 0;
    s.state = 'cruise'; s.alive = true;
    s.carry.length = 0;
    s.stamina = C.STAMINA_MAX;
    s.dashT = -1; s.dashCd = 0; s.dashBites = 0; s.dashFromY = 0;
    s.biteT = 0; s.stunT = 0; s.snareT = 0; s.slowT = 0; s.iframeT = 0;
    s.shakeCd = 0; s.surf = false; s.strandT = 0; s.strandWarn = false;
    s.pendingScore = 0; s.trailAcc = 0;
    s.zone = W.zoneAt(s.x, null);
  }

  /* ---- 派生量 ---- */
  function cruiseSpeed(s) { return C.V_CRUISE * C.CARRY_V(s.carryK); }
  function omegaOf(s) {
    return C.OMEGA_CRUISE * C.CARRY_W(s.carryK)
      * (s.surf ? C.SURF.OMEGA_MULT : 1)
      * (s.slowT > 0 ? C.SLOWED.OMEGA_MULT : 1);
  }
  function dashSpeed(t) {
    var D = C.DASH;
    if (t < D.WINDUP) return U.lerp(D.V_START, D.V_PEAK, t / D.WINDUP);
    if (t < D.CRUISE_END) return D.V_PEAK;
    var k = (t - D.CRUISE_END) / (D.TOTAL - D.CRUISE_END);
    return U.lerp(D.V_PEAK, D.V_END, U.clamp(k, 0, 1));
  }
  function dashCost(s) { return s.carryK > 0 ? C.DASH_COST_CARRY : C.DASH_COST_EMPTY; }

  function isZeroSpeedState(s) {
    return s.state === 'stunned' || s.state === 'snared' || s.state === 'beached' || s.state === 'dead';
  }

  /* =====================================================================
   * 主更新
   * ===================================================================== */
  function update(s, dt, G) {
    if (!W) W = TL.World;
    if (!s.alive) { s.state = 'dead'; s.speed = 0; return; }

    var t;
    if ((t = s.biteT) > 0) { s.biteT = t - dt; if (s.biteT < 0) s.biteT = 0; }
    if ((t = s.dashCd) > 0) { s.dashCd = t - dt; if (s.dashCd < 0) s.dashCd = 0; }
    if ((t = s.stunT) > 0) { s.stunT = t - dt; if (s.stunT < 0) { s.stunT = 0; s.iframeT = C.IFRAME_AFTER_CC; } }
    if ((t = s.snareT) > 0) { s.snareT = t - dt; if (s.snareT < 0) { s.snareT = 0; s.iframeT = C.IFRAME_AFTER_CC; } }
    if ((t = s.slowT) > 0) { s.slowT = t - dt; if (s.slowT < 0) s.slowT = 0; }
    if ((t = s.iframeT) > 0) { s.iframeT = t - dt; if (s.iframeT < 0) s.iframeT = 0; }
    if ((t = s.shakeCd) > 0) { s.shakeCd = t - dt; if (s.shakeCd < 0) s.shakeCd = 0; }

    /* ---- 状态判定（强制打断态优先，GDD-01 §3.3） ---- */
    if (s.stunT > 0) s.state = 'stunned';
    else if (s.snareT > 0) s.state = 'snared';
    else if (s.biteT > 0) s.state = 'bite';
    else if (s.dashT >= 0) s.state = 'dash';
    else if (s.state === 'beached') { /* QTE 期间不覆盖 */ }
    else s.state = 'cruise';

    if (s.state === 'beached') { s.speed = 0; return; }

    /* ---- 冲刺输入 ---- */
    var wantDash = G.dashPressed;
    if (wantDash && s.dashT < 0 && s.state === 'cruise' && s.dashCd <= 0) {
      var cost = dashCost(s);
      if (s.stamina >= cost) {
        s.stamina -= cost;
        s.dashT = 0;
        s.dashTheta0 = s.theta;
        s.dashBites = 0;
        s.dashFromY = s.y;
        s.state = 'dash';
        TL.Audio.play('splash');
        FXBurst(s, 6, C.PAL.PALE, 90);
      } else {
        G.events.staminaReject = true;      // GDD-03 E6：明确的失败反馈
        TL.Audio.play('deny');              // 短促下行两声 =「不行」（音频侧冗余通道）
      }
    }

    /* ---- 冲浪模式（GDD-01 §3.5） ---- */
    var wl = W.waterLineY(s.x, G.time);
    var nearWave = Math.abs(s.y - wl) <= C.SURF.BAND;
    var spdNow = (s.state === 'dash') ? dashSpeed(s.dashT) : C.V_CRUISE;
    var canSurf = s.zone === C.ZONE.SURF && nearWave
      && (spdNow * C.CARRY_V(s.carryK)) >= C.SURF.SPEED_FRAC * C.V_CRUISE * C.CARRY_V(s.carryK);
    if (s.surf !== canSurf) {
      s.surf = canSurf;
      if (canSurf) TL.Audio.play('splash');
    }

    /* ---- 速率（状态定） ---- */
    var base;
    if (s.state === 'dash') base = dashSpeed(s.dashT);
    else if (s.state === 'bite') base = C.V_CRUISE * 0.5;
    else base = C.V_CRUISE;
    var speed = base * C.CARRY_V(s.carryK)
      * (s.surf ? C.SURF.RATE_MULT : 1)
      * (s.slowT > 0 ? C.SLOWED.RATE_MULT : 1);
    if (s.state === 'stunned' || s.state === 'snared') speed = 0;

    /* ---- 方向（玩家定） ---- */
    var omega = omegaOf(s);
    if (s.state === 'dash') omega = C.DASH.OMEGA;
    if (s.state === 'stunned') omega = 0;

    if (s.state !== 'stunned' && G.hasDir) {
      var target = Math.atan2(G.dirY, G.dirX) * R2D;
      var d = U.angDelta(target, s.theta);
      var step = omega * dt;
      s.theta += U.clamp(d, -step, step);
      if (s.state === 'dash') {
        // 冲刺承诺：θ 限制在起手方向 ±25°
        var rel = U.angDelta(s.theta, s.dashTheta0);
        if (rel > C.DASH.CONE_DEG) s.theta = s.dashTheta0 + C.DASH.CONE_DEG;
        else if (rel < -C.DASH.CONE_DEG) s.theta = s.dashTheta0 - C.DASH.CONE_DEG;
      }
    }
    if (s.theta > 180) s.theta -= 360; else if (s.theta < -180) s.theta += 360;

    s.speed = speed;

    /* ---- 位移积分（GDD-01 E8：子步扫掠，防穿透） ---- */
    var vx = Math.cos(s.theta * D2R) * speed;
    var vy = Math.sin(s.theta * D2R) * speed;
    var dist = Math.sqrt(vx * vx + vy * vy) * dt;
    var steps = Math.max(1, Math.ceil(dist / C.MAX_SUBSTEP_PX));
    if (steps > 8) steps = 8;
    var sdt = dt / steps;

    for (var i = 0; i < steps; i++) {
      var prevY = s.y;
      s.x += vx * sdt;
      s.y += vy * sdt;
      clampToWorld(s, G);
      // 跨越水面线（仅上行）= DECOY BREACH（GDD-03 §3.4）
      if (s.state === 'dash' && !G.decoyFired) {
        var wlNow = W.waterLineY(s.x, G.time);
        if (prevY > wlNow && s.y <= wlNow) G.onSurfaceCross(s, s.x, wlNow);
      }
      // 咬合走子步（GDD-03 §3.1）
      if (s.state === 'dash' && s.dashBites < 1) G.tryBite(s);
    }

    /* ---- 冲刺推进 ---- */
    if (s.dashT >= 0) {
      s.dashT += dt;
      // 一次冲刺只可能触发一次 DECOY BREACH（跨子步保持，冲刺结束时复位）
      if (s.dashT >= C.DASH.TOTAL) { s.dashT = -1; s.dashCd = C.DASH.CD; G.decoyFired = false; }
    }

    /* ---- 体力回复（GDD-01 §4.3） ---- */
    var regen;
    if (s.surf) regen = C.REGEN.SURF;
    else if (s.zone === C.ZONE.DEEP) regen = C.REGEN.DEEP;
    else if (s.zone === C.ZONE.SHALLOW) regen = C.REGEN.SHALLOW;
    else regen = C.REGEN.BEACH;
    if (s.carryK > 0) regen *= C.REGEN_CARRY_MULT;
    if (s.slowT > 0) regen *= C.SLOWED.REGEN_MULT;
    s.stamina = Math.min(C.STAMINA_MAX, s.stamina + regen * dt);

    /* ---- 携带水花拖尾 L1（GDD-01 §4.2 表：6/10/14/18 粒子每秒） ---- */
    if (s.carryK > 0) {
      var rate = 2 + s.carryK * 4;
      s.trailAcc += rate * dt;
      while (s.trailAcc >= 1) {
        s.trailAcc -= 1;
        TL.FX.splash(s.x - Math.cos(s.theta * D2R) * 40, s.y - Math.sin(s.theta * D2R) * 40,
          1, U.hex2rgb(C.PAL.PALE), 60);
      }
    }

    /* ---- 搁浅累积（ADR-003 §2.4：速率越低累积越快） ---- */
    updateStranding(s, dt, G);
  }

  function clampToWorld(s, G) {
    var SH = C.SHARK;
    if (s.x < 0) { s.x = 0; }
    if (s.x > C.WORLD_W) { s.x = C.WORLD_W; }          // E7：硬边界，速率不降
    var ground = W.seabedY(s.x) - SH.HALF_H + SH.SINK;
    if (s.y > ground) s.y = ground;
    if (s.y < 30) s.y = 30;
    s.grounded = (s.y + SH.HALF_H) >= W.seabedY(s.x) - 8;
    s.airborne = s.y < W.waterLineY(s.x, G.time);
  }

  function updateStranding(s, dt, G) {
    var B = C.BEACH;
    // 区域每帧更新（迟滞）
    s.zone = W.zoneAt(s.x, s.zone);

    if (s.zone === C.ZONE.BEACH && s.grounded && s.speed < B.V_TH) {
      var rate = 1 - s.speed / B.V_TH;                 // ∈ (0,1]
      s.strandT += dt * rate;
    } else if (s.zone === C.ZONE.BEACH) {
      s.strandT -= dt * B.REC_IN;
    } else {
      s.strandT -= dt * B.REC_OUT;
    }
    s.strandT = U.clamp(s.strandT, 0, B.T_STRAND);

    if (s.strandT >= B.T_STRAND) {
      G.enterBeached(s);
    } else if (s.strandT >= B.T_WARN) {
      if (!s.strandWarn) {
        s.strandWarn = true;
        TL.Audio.play('sting');
        TL.FX.sandPuff(s.x, s.y + 30, 8);
        G.events.strandWarn = true;
      }
    } else {
      s.strandWarn = false;
    }
  }

  function FXBurst(s, n, colHex, power) {
    TL.FX.splash(s.x, s.y, n, U.hex2rgb(colHex), power);
  }

  /* =====================================================================
   * 绘制
   * ===================================================================== */
  function draw(s, B, G) {
    var SH = C.SHARK;
    var sprite = (s.state === 'bite') ? 'shark_bite' : 'shark';
    var flipU = Math.cos(s.theta * D2R) < 0;
    var rot = flipU ? (s.theta * D2R - Math.PI) : (s.theta * D2R);
    if (s.surf) rot += Math.sin(G.time * 7) * 0.10;

    var tint = [1, 1, 1];
    if (s.state === 'dash') { tint = [0.72, 0.95, 1.35]; }      // 电光蓝 tint
    if (s.slowT > 0) { tint = [0.75, 0.85, 1.0]; }
    if (s.state === 'stunned') { tint = [0.85, 0.85, 1.05]; }
    if (s.iframeT > 0) {
      // 呼吸式（≤2Hz），绝不硬 on/off
      var b = U.breath(G.time, 2);
      var k = 0.65 + 0.5 * b;
      tint = [tint[0] * k, tint[1] * k, tint[2] * k];
    }
    if (!s.alive) { tint = [0.55, 0.58, 0.66]; }

    var visY = s.y + (s.carryK > 0 ? 6 : 0);        // 携带时下沉 6px（GDD-03 §5.4）
    var visRot = rot + (s.carryK > 0 ? -8 * D2R * (flipU ? -1 : 1) : 0);  // 头上仰 8°

    // 图集含 8 art px 外扩留白（3px 描边用），故按 (HALF+ PAD) 绘制；
    // 本体视觉尺寸仍为 84x40 art px（(42+8)*2*2=200 中本体占 168）——不变。
    var pad = SH.DRAW_PAD || 0;
    B.draw(sprite, s.x, visY,
      (SH.DRAW_HALF_W + pad) * 2 * C.ART_SCALE,
      (SH.DRAW_HALF_H + pad) * 2 * C.ART_SCALE,
      { rot: visRot, flipU: flipU, flipV: !s.alive, tint: tint });

    /* 携带的战利品（数得出来的冗余通道） */
    for (var i = 0; i < s.carryK; i++) {
      var off = 52 + i * 26;
      var cxp = s.x - Math.cos(s.theta * D2R) * off;
      var cyp = s.y - Math.sin(s.theta * D2R) * off + 22;
      B.draw('carried', cxp, cyp, 24, 24, {
        rot: Math.sin(G.time * 14 + i) * 0.35,
        flipU: flipU
      });
    }

    /* 渔网（Snared 的形态通道，不依赖颜色） */
    if (s.state === 'snared') {
      var nw = SH.LEN * 0.9, nh = 100;
      for (var g = 0; g <= 4; g++) {
        var fy = s.y - nh / 2 + (nh * g / 4);
        B.draw('dot1', s.x, fy, nw, 3, { tint: [0.78, 0.81, 0.85], fade: 0.95 });
        var fx = s.x - nw / 2 + (nw * g / 4);
        B.draw('dot1', fx, s.y, 3, nh, { tint: [0.78, 0.81, 0.85], fade: 0.95 });
      }
    }

    /* 眩晕：头顶旋转星（形态通道） */
    if (s.state === 'stunned') {
      for (var k2 = 0; k2 < 3; k2++) {
        var a = G.time * 4 + k2 * (U.TAU / 3);
        B.draw('dot2', s.x + Math.cos(a) * 34, s.y - 52 + Math.sin(a) * 10,
          8, 8, { tint: U.hex2rgb(C.PAL.AMBER) });
      }
    }

    /* 搁浅预警：尾部拖沙（ADR-003 §2.5） */
    if (s.strandWarn && s.state !== 'beached') {
      if (Math.random() < 0.5) TL.FX.sandPuff(s.x - Math.cos(s.theta * D2R) * 60, s.y + 30, 2);
    }
  }

  TL.Shark = {
    create: create, reset: reset, update: update, draw: draw,
    cruiseSpeed: cruiseSpeed, dashCost: dashCost, isZeroSpeedState: isZeroSpeedState,
    mouthBox: function (s) {
      return {
        x: s.x + Math.cos(s.theta * D2R) * C.SHARK.MOUTH_OFF,
        y: s.y + Math.sin(s.theta * D2R) * C.SHARK.MOUTH_OFF,
        w: C.SHARK.MOUTH_W, h: C.SHARK.MOUTH_H
      };
    }
  };
})();

</script>
<script>
/* ===== src/game/entities.js ===== */
/* =====================================================================
 * TIDELINE · game/entities.js
 * 猎物（泳客/冲浪者/日光浴者/救生员）与敌人（T1/T2a/T2b/T3b）。
 *
 * 免疫判据（🔴 执行级约束，GDD-02 §3.6 / GDD-03 §3.5）：
 *   免疫 = **有系绳**（!has_tether 才受影响），
 *   不是「在空中」也不是「T3/T4」。直升机与 T4 恒带系绳 → 恒免疫。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;

  /* =================================================================
   * 猎物
   * ================================================================= */
  var PREY_TARGET = 16;
  var prey = [];

  function preySurfaceY(p, t) {
    var W = TL.World;
    if (p.type === 'sunbather') return W.seabedY(p.x) - 12;
    if (p.type === 'lifeguard') return W.seabedY(p.x) - 30;
    return W.waterLineY(p.x, t) + (p.type === 'surfer' ? 0 : 14);
  }

  function spawnPrey(type, t) {
    var W = TL.World;
    var x, p;
    if (type === 'sunbather') x = U.rr(2590, 2970);
    else if (type === 'lifeguard') x = U.rr(2600, 2940);
    else if (type === 'surfer') x = U.rr(1720, 2440);
    else x = U.rr(880, 1620);
    p = {
      type: type, x: x, y: 0, alive: true, t: U.rand() * 6,
      dir: U.rand() < 0.5 ? -1 : 1, respawn: 0, panic: 0
    };
    p.y = preySurfaceY(p, t);
    prey.push(p);
    return p;
  }

  function preyReset(t) {
    prey.length = 0;
    var plan = ['swimmer', 'swimmer', 'swimmer', 'surfer', 'surfer', 'swimmer', 'surfer', 'sunbather'];
    for (var i = 0; i < PREY_TARGET; i++) {
      var type = plan[i % plan.length];
      if (i === 5 || i === 11) type = 'lifeguard';
      spawnPrey(type, t || 0);
    }
  }

  function preyUpdate(dt, G) {
    var W = TL.World;
    for (var i = 0; i < prey.length; i++) {
      var p = prey[i];
      if (!p.alive) {
        p.respawn -= dt;
        if (p.respawn <= 0) {
          var type = U.pick(['swimmer', 'swimmer', 'surfer', 'surfer', 'sunbather', 'sunbather', 'lifeguard']);
          spawnPrey(type, G.time);
          prey.splice(i, 1); i--;
        }
        continue;
      }
      p.t += dt;
      if (p.panic > 0) p.panic -= dt;

      if (p.type === 'swimmer') {
        p.x += Math.sin(p.t * 0.5) * 8 * dt;
      } else if (p.type === 'surfer') {
        p.x += 22 * dt * (p.x < 2480 ? 1 : -1);
      } else if (p.type === 'lifeguard') {
        p.x += p.dir * 26 * dt;
        if (p.x > 2950) p.dir = -1; else if (p.x < 2590) p.dir = 1;
      }
      p.x = U.clamp(p.x, 860, 2980);
      p.y = preySurfaceY(p, G.time);

      /* 鲨鱼靠近 → 惊慌（黑色喜剧：滑稽不惨烈） */
      var dx = p.x - G.shark.x, dy = p.y - G.shark.y;
      if (dx * dx + dy * dy < 190 * 190) {
        p.panic = 0.6;
        if (p.type === 'swimmer') p.x += (dx > 0 ? 34 : -34) * dt;
      }
    }
  }

  function preyBox(p) {
    if (p.type === 'sunbather') return { x: p.x, y: p.y, w: 56, h: 32 };
    return { x: p.x, y: p.y, w: 32, h: 56 };
  }

  /* 嘴部命中检测，返回被咬中的猎物 */
  function preyHit(mb) {
    for (var i = 0; i < prey.length; i++) {
      var p = prey[i];
      if (!p.alive) continue;
      var b = preyBox(p);
      if (U.aabb(mb.x, mb.y, mb.w, mb.h, b.x, b.y, b.w, b.h)) return p;
    }
    return null;
  }

  function preyConsume(p) { p.alive = false; p.respawn = U.rr(4.5, 9); }

  function preyDraw(B, G) {
    for (var i = 0; i < prey.length; i++) {
      var p = prey[i];
      if (!p.alive) continue;
      var bob = (p.type === 'sunbather' || p.type === 'lifeguard')
        ? Math.round(Math.sin(p.t * 2) * 1)
        : Math.round(Math.sin(p.t * 2.4) * 3);
      var sprite = p.type;
      var w = 24, h = 36;
      if (p.type === 'surfer') { w = 40; h = 32; }
      if (p.type === 'sunbather') { w = 40; h = 20; }
      if (p.type === 'lifeguard') { w = 24; h = 34; }
      B.draw(sprite, p.x, p.y + bob, w, h, {
        flipU: (p.type === 'lifeguard' || p.type === 'swimmer') ? p.dir < 0 : false,
        rot: p.panic > 0 ? Math.sin(p.t * 26) * 0.14 : 0
      });
      /* 惊慌：头顶「!」—— 形态通道，不依赖颜色 */
      if (p.panic > 0) {
        B.draw('dot2', p.x, p.y - 44, 4, 12, { tint: U.hex2rgb(C.PAL.AMBER) });
        B.draw('dot2', p.x, p.y - 30, 4, 4, { tint: U.hex2rgb(C.PAL.AMBER) });
      }
    }
  }

  /* =================================================================
   * 敌人
   * ================================================================= */
  var enemies = [];
  var warns = [];
  var projectiles = [];
  var spawnTimers = { T2B: 0, T3B: 0 };
  var towersPlaced = false;

  function resetEnemies() {
    enemies.length = 0; warns.length = 0; projectiles.length = 0;
    spawnTimers.T2B = 0; spawnTimers.T3B = 0; towersPlaced = false;
  }

  function countKind(k) {
    var n = 0;
    for (var i = 0; i < enemies.length; i++) if (enemies[i].kind === k) n++;
    return n;
  }
  function tetherCount() {
    var n = 0;
    for (var i = 0; i < enemies.length; i++) if (enemies[i].hasTether) n++;
    return n;
  }

  function addWarn(kind, x, y) {
    warns.push({ kind: kind, x: x, y: y, t: C.ENEMY.WARN_LEAD });
    TL.Audio.play('lockWarn');
  }

  function placeTowers() {
    if (towersPlaced) return;
    towersPlaced = true;
    var xs = [2660, 2890];
    for (var i = 0; i < xs.length; i++) {
      enemies.push({
        kind: 'T2A', x: xs[i], y: TL.World.seabedY(xs[i]) - 52,
        cd: U.rr(0.6, 2.2), telegraph: 0, hasTether: false,
        decoyT: 0, immuneFlash: 0, life: 0, static: true
      });
    }
  }

  function spawnByTier(tier, G) {
    var E = C.ENEMY;
    if (tier >= 1) placeTowers();

    if (tier >= 2) {
      spawnTimers.T2B -= G.dtRaw;
      if (spawnTimers.T2B <= 0 && countKind('T2B') < E.CAPS.T2B && enemies.length < E.HARD_CAP) {
        spawnTimers.T2B = 5.0;
        addWarn('T2B', C.WORLD_W - 20, G.shark.y);
        enemies.push({
          kind: 'T2B', x: C.WORLD_W + 60, y: U.clamp(G.shark.y, 140, 780),
          vx: -E.T2B.SPEED, hasTether: false, decoyT: 0, immuneFlash: 0,
          life: 0, wake: 0
        });
      }
    }
    if (tier >= 3) {
      spawnTimers.T3B -= G.dtRaw;
      if (spawnTimers.T3B <= 0 && countKind('T3B') < E.CAPS.T3B) {
        spawnTimers.T3B = 8.0;
        addWarn('T3B', C.WORLD_W - 40, C.ENEMY.T3B.ALT);
        enemies.push({
          kind: 'T3B', x: C.WORLD_W + 80, y: C.ENEMY.T3B.ALT,
          vx: -C.ENEMY.T3B.SPEED, hasTether: true, tLock: 0, breakProg: 0,
          state: 'lock', searchT: 0, lastKnown: G.shark.x,
          decoyT: 0, immuneFlash: 0, life: 0
        });
        TL.Audio.play('tether');
      }
    }
    // T1 漂浮垃圾：全域常驻少量（非「单位」，不参与诱饵）
    if (countKind('T1') < E.CAPS.T1 && U.rand() < 0.6 * G.dtRaw) {
      var x = U.rr(900, 2500);
      enemies.push({
        kind: 'T1', x: x, y: TL.World.waterLineY(x, G.time) + U.rr(10, 40),
        vx: U.rr(-30, 30), spin: U.rr(-1, 1), hasTether: false,
        variant: U.rand() < 0.5 ? 'tire' : 'crate', life: 0, decoyT: 0
      });
    }
  }

  function updateEnemies(dt, G) {
    var E = C.ENEMY, W = TL.World, s = G.shark;

    for (var i = warns.length - 1; i >= 0; i--) {
      warns[i].t -= dt;
      if (warns[i].t <= 0) warns.splice(i, 1);
    }

    for (var k = enemies.length - 1; k >= 0; k--) {
      var e = enemies[k];
      e.life += dt;
      if (e.decoyT > 0) e.decoyT -= dt;
      if (e.immuneFlash > 0) e.immuneFlash -= dt;

      if (e.kind === 'T1') {
        e.x += e.vx * dt;
        var wly = W.waterLineY(e.x, G.time);
        e.y = wly + 24 + Math.sin(G.time * 1.4 + e.x * 0.01) * 4;
        if (e.x < 820 || e.x > 2600) e.vx *= -1;
        if (e.decoyT > 0) { /* 非单位，诱饵不影响 */ }

      } else if (e.kind === 'T2A') {
        if (e.decoyT > 0) { e.telegraph = 0; continue; }
        e.cd -= dt;
        if (e.telegraph > 0) {
          e.telegraph -= dt;
          if (e.telegraph <= 0) fireBuoy(e, G);
        } else if (e.cd <= 0) {
          var dx = s.x - e.x, dy = s.y - e.y;
          if (dx * dx + dy * dy < E.T2A.RANGE * E.T2A.RANGE) {
            e.telegraph = E.T2A.TELEGRAPH;
          } else {
            e.cd = 0.4;
          }
        }

      } else if (e.kind === 'T2B') {
        if (e.decoyT > 0) {
          var tx = e.decoyX - e.x;
          e.x += U.clamp(tx, -E.T2B.SPEED * dt, E.T2B.SPEED * dt);
          e.y = U.damp(e.y, e.decoyY, 3, dt);
        } else {
          e.x += e.vx * dt;
          e.y = U.damp(e.y, U.clamp(s.y, 130, 800), 1.2, dt);
        }
        e.wake -= dt;
        if (e.wake <= 0) { e.wake = 0.05; TL.FX.splash(e.x + 20, e.y + 16, 1, U.hex2rgb(C.PAL.WHITE), 40); }
        if (e.x < 780 || e.life > 22) { enemies.splice(k, 1); continue; }

      } else if (e.kind === 'T3B') {
        updateHeli(e, dt, G, k);
      }
    }

    /* 投射物（救生员浮标） */
    for (var j = projectiles.length - 1; j >= 0; j--) {
      var pr = projectiles[j];
      pr.t += dt;
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      pr.rot += dt * 6;
      if (pr.t > pr.dur || pr.x < 700 || pr.x > C.WORLD_W) {
        projectiles.splice(j, 1); continue;
      }
      var mb = { x: pr.x, y: pr.y, w: 20, h: 20 };
      var sb = { x: s.x, y: s.y, w: C.SHARK.HALF_W * 2, h: C.SHARK.HALF_H * 2 };
      if (s.alive && s.iframeT <= 0 && U.aabb(mb.x, mb.y, mb.w, mb.h, sb.x, sb.y, sb.w, sb.h)) {
        projectiles.splice(j, 1);
        G.applyStun();
      }
    }
  }

  function fireBuoy(e, G) {
    var s = G.shark;
    var dx = s.x - e.x, dy = s.y - e.y;
    var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var sp = d / C.ENEMY.T2A.FLIGHT;
    projectiles.push({
      x: e.x, y: e.y - 18, vx: dx / d * sp, vy: dy / d * sp,
      t: 0, dur: C.ENEMY.T2A.FLIGHT + 0.6, rot: 0
    });
    e.cd = C.ENEMY.T2A.INTERVAL;
  }

  function updateHeli(e, dt, G, idx) {
    var T = C.TETHER, W = TL.World, s = G.shark;
    var depth = s.y - W.waterLineY(s.x, G.time);
    var observable = !(s.x < T.DEEP_X && depth > T.DEEP_DEPTH);

    if (e.decoyT > 0) {
      e.x = U.damp(e.x, e.decoyX, 2.2, dt);
      e.y = U.damp(e.y, C.ENEMY.T3B.ALT, 2, dt);
    } else if (e.state === 'lock') {
      e.x = U.damp(e.x, U.clamp(s.x + 40, 800, C.WORLD_W), 1.1, dt);
      e.y = U.damp(e.y, C.ENEMY.T3B.ALT, 2, dt);
    } else {
      e.x = U.damp(e.x, e.lastKnown + Math.sin(G.time * 0.9) * 180, 1.0, dt);
      e.y = U.damp(e.y, C.ENEMY.T3B.ALT, 2, dt);
    }

    if (e.state === 'lock') {
      if (observable) {
        e.tLock += dt; e.breakProg = 0;
        e.lastKnown = s.x;
        if (e.tLock >= T.LOCK) G.killShark('tether');
      } else {
        e.breakProg += dt / T.BREAK;
        if (e.breakProg >= 1) {
          e.state = 'search'; e.searchT = 0; e.tLock = 0; e.breakProg = 0;
          e.hasTether = false;                 // 断线后 → 受诱饵影响
          TL.Audio.play('tetherBreak');
          TL.FX.splash(e.x, e.y + 40, 10, U.hex2rgb(C.PAL.WHITE), 120);
          G.addToast('系绳断裂');
        }
      }
    } else {
      e.searchT += dt;
      if (observable) {
        e.state = 'lock'; e.hasTether = true; e.tLock = 0;
        TL.Audio.play('tether');
        G.addToast('重新锁定');
      } else if (e.searchT >= T.SEARCH) {
        enemies.splice(idx, 1);
      }
    }
  }

  /* DECOY BREACH 目标筛选（GDD-02 §3.6） */
  function decoyAt(bx, by) {
    var list = [];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.kind === 'T1') continue;
      if (e.hasTether) { e.immuneFlash = 0.7; continue; }        // ⭐ 免疫判据
      var d = Math.sqrt(U.dist2(e.x, e.y, bx, by));
      if (d <= C.DECOY.RADIUS) list.push({ e: e, d: d });
    }
    list.sort(function (a, b) { return a.d - b.d; });
    var n = Math.min(C.DECOY.MAX_TARGETS, list.length);
    for (var k = 0; k < n; k++) {
      var t = list[k].e;
      t.decoyT = C.DECOY.STALL;
      t.decoyX = bx; t.decoyY = by;
    }
    return n;
  }

  /* 与鲨鱼的接触判定（碰撞在 game.js 调用，效果在此施加） */
  function hitTestShark(s) {
    var sb = { x: s.x, y: s.y, w: C.SHARK.HALF_W * 2, h: C.SHARK.HALF_H * 2 };
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      var eb = enemyBox(e);
      if (!U.aabb(sb.x, sb.y, sb.w, sb.h, eb.x, eb.y, eb.w, eb.h)) continue;
      if (e.kind === 'T1') return { kind: 'T1', e: e };
      if (e.kind === 'T2B' && e.decoyT <= 0) return { kind: 'T2B', e: e };
    }
    return null;
  }

  function enemyBox(e) {
    if (e.kind === 'T1') return { x: e.x, y: e.y, w: 34, h: 26 };
    if (e.kind === 'T2A') return { x: e.x, y: e.y, w: 52, h: 60 };
    if (e.kind === 'T2B') return { x: e.x, y: e.y, w: 72, h: 32 };
    return { x: e.x, y: e.y, w: 92, h: 36 };
  }

  function enemyDraw(B, G) {
    var W = TL.World;
    /* 预警箭头（T2+ 提前 0.8s，形态 + 位置双通道） */
    for (var w = 0; w < warns.length; w++) {
      var wn = warns[w];
      var a = U.breath(G.time, 2);
      var ax2 = U.clamp(wn.x, 40, C.WORLD_W - 40);
      for (var r = 0; r < 5; r++) {
        B.draw('dot2', ax2 - r * 10, wn.y - 20 + r * 10, 8, 8,
          { tint: U.hex2rgb(C.PAL.AMBER), fade: a, bucket: 'add' });
        B.draw('dot2', ax2 - r * 10, wn.y + 20 - r * 10, 8, 8,
          { tint: U.hex2rgb(C.PAL.AMBER), fade: a, bucket: 'add' });
      }
    }

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.kind === 'T1') {
        B.draw(e.variant, e.x, e.y, e.variant === 'tire' ? 34 : 30,
          e.variant === 'tire' ? 26 : 24, { rot: G.time * e.spin * 0.6 });
      } else if (e.kind === 'T2A') {
        B.draw('tower', e.x, e.y, 52, 60);
        if (e.telegraph > 0) {
          var a2 = U.breath(G.time, 2);
          B.draw('buoy', e.x, e.y - 34 - (1 - e.telegraph / C.ENEMY.T2A.TELEGRAPH) * 10, 20, 20,
            { tint: U.hex2rgb(C.PAL.AMBER), fade: a2 });
        }
      } else if (e.kind === 'T2B') {
        B.draw('jetski', e.x, e.y, 72, 32, { flipU: true });
      } else if (e.kind === 'T3B') {
        drawHeli(B, G, e);
      }
      /* 诱饵状态标记：! 命中 / ✕ 免疫 —— 形状通道，灰度可辨 */
      if (e.decoyT > 0) {
        B.draw('dot2', e.x, e.y - 56, 5, 16, { tint: U.hex2rgb(C.PAL.BLOOD) });
        B.draw('dot2', e.x, e.y - 38, 5, 5, { tint: U.hex2rgb(C.PAL.BLOOD) });
      } else if (e.immuneFlash > 0) {
        var f = U.clamp(e.immuneFlash / 0.7, 0, 1);
        for (var q = 0; q < 5; q++) {
          B.draw('dot2', e.x - 8 + q * 4, e.y - 58 + q * 4, 5, 5, { tint: U.hex2rgb(C.PAL.WHITE), fade: f });
          B.draw('dot2', e.x + 8 - q * 4, e.y - 58 + q * 4, 5, 5, { tint: U.hex2rgb(C.PAL.WHITE), fade: f });
        }
      }
    }

    for (var j = 0; j < projectiles.length; j++) {
      var pr = projectiles[j];
      B.draw('buoy', pr.x, pr.y, 20, 20, { rot: pr.rot });
    }
  }

  function drawHeli(B, G, e) {
    var s = G.shark;
    B.draw('heli', e.x, e.y, 92, 36, { flipU: e.vx < 0 });
    // 旋翼（运动模糊：两条横线交替）
    var ph = Math.sin(G.time * 40) > 0;
    B.draw('dot1', e.x, e.y - 8 + (ph ? 0 : 2), 86, 3, { tint: [0.7, 0.75, 0.85], fade: 0.8 });

    // 探照灯锥（形态通道，非颜色唯一）
    if (e.state === 'lock') {
      var a = U.breath(G.time, 1.5);
      for (var r = 0; r < 9; r++) {
        var t = r / 8;
        var cy = e.y + 18 + t * (s.y - e.y - 18);
        var halfW = 8 + t * 46;
        B.draw('dot2', e.x - halfW, cy, 4, 4, { tint: U.hex2rgb(C.PAL.AMBER), fade: 0.10 + a * 0.10, bucket: 'add' });
        B.draw('dot2', e.x + halfW, cy, 4, 4, { tint: U.hex2rgb(C.PAL.AMBER), fade: 0.10 + a * 0.10, bucket: 'add' });
      }
      // 系绳（唯一连接两实体的线 = 形态通道）
      var lockT = e.tLock / C.TETHER.LOCK;
      var br = U.breath(G.time, 1 + lockT);       // 1 → 2Hz（≤2，硬红线）
      var dx = s.x - e.x, dy = s.y - (e.y + 18);
      var len = Math.sqrt(dx * dx + dy * dy);
      var segs = Math.max(6, Math.round(len / 22));
      var jitterAmp = lockT > 0.5 ? 3 : 1.5;
      for (var i = 0; i <= segs; i++) {
        var tt = i / segs;
        var jx = (i > 0 && i < segs) ? (U.rand() - 0.5) * jitterAmp : 0;
        B.draw('dot2', e.x + dx * tt + jx, e.y + 18 + dy * tt,
          4, 4, { tint: U.hex2rgb(C.PAL.BLOOD), fade: 0.35 + br * 0.45, bucket: 'add' });
      }
      // 端点准星
      var cs = 14 + (1 - lockT) * 10;
      B.draw('dot1', s.x, s.y - cs, cs, 2, { tint: U.hex2rgb(C.PAL.BLOOD), fade: br });
      B.draw('dot1', s.x, s.y + cs, cs, 2, { tint: U.hex2rgb(C.PAL.BLOOD), fade: br });
      B.draw('dot1', s.x - cs, s.y, 2, cs, { tint: U.hex2rgb(C.PAL.BLOOD), fade: br });
      B.draw('dot1', s.x + cs, s.y, 2, cs, { tint: U.hex2rgb(C.PAL.BLOOD), fade: br });
    } else {
      // `?` 搜索态（已断线 → 受诱饵影响）
      B.draw('dot2', e.x, e.y - 40, 4, 12, { tint: U.hex2rgb(C.PAL.PALE) });
      B.draw('dot2', e.x + 6, e.y - 34, 4, 4, { tint: U.hex2rgb(C.PAL.PALE) });
      B.draw('dot2', e.x + 2, e.y - 24, 4, 4, { tint: U.hex2rgb(C.PAL.PALE) });
      for (var q = 0; q < 7; q++) {
        var ang = Math.sin(G.time * 1.7) * 0.8 + (q - 3) * 0.16;
        B.draw('dot2', e.x + Math.sin(ang) * (30 + q * 22), e.y + 20 + Math.cos(ang) * (30 + q * 22),
          4, 4, { tint: U.hex2rgb(C.PAL.PALE), fade: 0.12, bucket: 'add' });
      }
    }
  }

  /* =================================================================
   * 副循环 · 冲浪收集（GDD-01 §3.5；详细规则待 GDD-04）
   *
   * 空间焊接：收集物**只**生成在冲浪带（贴近水线），与逃生路径重合 ——
   *   想收集就得贴着水面游，而水面正是摩托艇与直升机的活动层。
   *   于是「收集」与「安全」互斥（概念文档 §4.2 支柱三）。
   *
   * 判定门槛：**必须处于 surf 状态**才可拾取（贴水线 ±40px + 冲浪区 + 速度达标）。
   *   这防止了「深海安全区顺手刷分」，也保证副循环需要真的技巧投入。
   *
   * 原子性：得分计入 pendingScore，与战利品**同池**，死亡全损（GDD-03 E2 裁决）。
   * COMBO 亦按 PER_COLLECT 累加 —— 沙盘 `m_surf = 2.6` 即由「一次冲浪吃满 8 个」
   * 推出（8 × STEP 0.2 → ×2.6），因此池内**恒定保持 COUNT 个**，不可削减。
   * ================================================================= */
  var PU_SPRITE = ['bottle', 'star', 'pickup_ring'];
  var pickups = [];

  function spawnPickup(G) {
    /* 出生点避开鲨鱼周边 260px，免得「凭空出现在嘴边」破坏手感 */
    var x = U.rr(1720, 2480);
    for (var tryN = 0; tryN < 8; tryN++) {
      var cand = U.rr(1720, 2480);
      if (Math.abs(cand - G.shark.x) >= 260) { x = cand; break; }
    }
    pickups.push({ type: U.ri(0, 2), x: x, y: 0, t: U.rand() * 6 });
  }

  function pickupReset(G) {
    pickups.length = 0;
    for (var i = 0; i < C.COLLECT.COUNT; i++) spawnPickup(G);
  }

  function collectPickup(k, G) {
    var sc = C.COLLECT.SCORE[k.type];
    G.pendingScore += sc;
    G.pendingCount++;
    G.combo += C.COMBO.PER_COLLECT;
    if (G.combo > G.comboMax) G.comboMax = G.combo;
    G.stats.collects++;
    TL.FX.splash(k.x, k.y, 5, U.hex2rgb(C.PAL.CYAN), 120);
    TL.Audio.play('collect');
    G.addToast('+' + sc + ' 未兑现（收集）');
  }

  function pickupUpdate(dt, G) {
    var W = TL.World, s = G.shark;
    for (var i = pickups.length - 1; i >= 0; i--) {
      var k = pickups[i];
      k.t += dt;
      k.y = W.waterLineY(k.x, G.time) + 14 + Math.sin(k.t * 1.6) * 3;

      if (!s.alive || !s.surf) continue;          // ⭐ 只有冲浪中才判定拾取
      var sb = { x: s.x, y: s.y, w: C.SHARK.HALF_W * 2, h: C.SHARK.HALF_H * 2 };
      if (U.aabb(sb.x, sb.y, sb.w, sb.h, k.x, k.y, 26, 26)) {
        collectPickup(k, G);
        pickups.splice(i, 1);
        spawnPickup(G);                           // 池恒定 COUNT 个（沙盘约束）
      }
    }
  }

  function pickupDraw(B, G) {
    for (var i = 0; i < pickups.length; i++) {
      var k = pickups[i];
      /* 三种收集物用**不同轮廓 + 不同旋转节奏**区分，不依赖颜色 */
      var rot = 0, w = 26, h = 26;
      if (k.type === 2) {
        // 圆环平放在水面：靠纵向压扁表达透视，自身不转
        rot = 0; h = 22;
      } else if (k.type === 1) {
        rot = Math.sin(k.t * 2.2) * 0.30;         // 星星左右摆
      } else {
        rot = Math.sin(k.t * 1.4) * 0.55;         // 瓶子浮沉摇晃
      }
      B.draw(PU_SPRITE[k.type], k.x, k.y, w, h, { rot: rot });
      // 高价值（圆环 30 分）加一圈水光点，形态提示「这个更值钱」
      if (k.type === 2) {
        for (var q = 0; q < 6; q++) {
          var a = k.t * 1.2 + q * (U.TAU / 6);
          B.draw('dot2', k.x + Math.cos(a) * 20, k.y + Math.sin(a) * 6, 3, 3,
            { tint: U.hex2rgb(C.PAL.WHITE), fade: 0.55 });
        }
      }
    }
  }

  TL.Pickups = {
    reset: pickupReset, update: pickupUpdate, draw: pickupDraw,
    list: pickups,
    count: function () { return pickups.length; }
  };

  TL.Prey = {
    reset: preyReset, update: preyUpdate, draw: preyDraw, hit: preyHit,
    consume: preyConsume, list: prey
  };
  TL.Enemies = {
    reset: resetEnemies, update: updateEnemies, draw: enemyDraw,
    spawnByTier: spawnByTier, decoyAt: decoyAt, hitTestShark: hitTestShark,
    countKind: countKind, tetherCount: tetherCount, list: enemies
  };
})();

</script>
<script>
/* ===== src/game/game.js ===== */
/* =====================================================================
 * TIDELINE · game/game.js
 * 核心循环编排：ALARM → 系绳 → Bank → 咬合 / 死亡（GDD-02 E3 帧序仲裁）。
 *
 * 帧序（同帧多事件时）：
 *   ① 输入 → ② 鲨鱼移动（子步）→ ③ 敌人 / 系绳 → ④ ALARM
 *   → ⑤ Bank 前置条件 → ⑥ 咬合 / 死亡判定
 * 时序仲裁一律偏向玩家（GDD-02 E3）。
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;

  var DEATH_PRIO = { beached: 3, tether: 2, harpoon: 1, other: 0 };

  /* 水深配色：明度阶梯 深海 8% → 沙滩 82%（美术圣经 §5.3.0） */
  var WATER_STOPS = [
    [0, [0.055, 0.098, 0.176]],
    [750, [0.075, 0.145, 0.247]],
    [1650, [0.114, 0.310, 0.435]],
    [2350, [0.153, 0.478, 0.545]],
    [2560, [0.196, 0.588, 0.604]]
  ];
  var SAND_DRY = [0.910, 0.773, 0.416];
  var SAND_WET = [0.520, 0.396, 0.180];

  function waterColorAt(x) {
    for (var i = 1; i < WATER_STOPS.length; i++) {
      if (x <= WATER_STOPS[i][0] || i === WATER_STOPS.length - 1) {
        var a = WATER_STOPS[i - 1], b = WATER_STOPS[i];
        var t = U.clamp((x - a[0]) / (b[0] - a[0]), 0, 1);
        return [
          a[1][0] + (b[1][0] - a[1][0]) * t,
          a[1][1] + (b[1][1] - a[1][1]) * t,
          a[1][2] + (b[1][2] - a[1][2]) * t
        ];
      }
    }
    return WATER_STOPS[0][1];
  }

  var G = {
    time: 0, dtRaw: 0, running: false, over: false, paused: false,
    shark: null,
    alarm: 0, tier: 0, maxEventArmed: true,
    banked: 0, combo: 0, comboMax: 0, comboLost: 0,
    pendingScore: 0, pendingCount: 0,
    lostScore: 0, lostCount: 0,          // 本局累计损失（结算页如实告知，死亡后 pendingScore 会被清零，故必须单独记）
    bankT: 0,
    deathReason: '', deathPrio: -1,
    freeze: 0, desat: 0, desatTarget: 0, flash: 0, flashCol: [0, 0, 0],
    qte: { active: false, t: 0, need: 6, window: 2.5, count: 0, lastTap: -1 },
    cam: { x: 0, y: 0, tx: 0, ty: 0, shake: 0, sx: 0, sy: 0 },
    events: {}, toasts: [],
    dashPressed: false, hasDir: false, dirX: 1, dirY: 0,
    decoyFired: false,
    stats: { grabs: 0, banks: 0, deaths: 0, collects: 0 },
    opts: null
  };

  /* =================================================================
   * 生命周期
   * ================================================================= */
  function init(opts) {
    G.opts = opts;
    TL.World.build();
    G.shark = TL.Shark.create();
    reset();
  }

  function reset() {
    G.time = 0; G.over = false; G.running = true; G.paused = false;
    G.alarm = 0; G.tier = 0; G.maxEventArmed = true;
    G.banked = 0; G.combo = 0; G.comboMax = 0; G.comboLost = 0;
    G.pendingScore = 0; G.pendingCount = 0;
    G.lostScore = 0; G.lostCount = 0;
    G.bankT = 0;
    G.deathReason = ''; G.deathPrio = -1;
    G.freeze = 0; G.desat = 0; G.desatTarget = 0; G.flash = 0;
    lastFlashAt = -1e9;               // 屏闪限频闸门必须随局重置，否则新一局开局被压住
    G.qte.active = false; G.qte.count = 0; G.qte.t = 0;
    G.cam.x = 0; G.cam.y = 0; G.cam.shake = 0;
    G.toasts.length = 0;
    G.decoyFired = false;
    /* 本局统计必须逐局归零 —— 否则重开后「捕食/落袋次数」会叠加上一局 */
    G.stats.grabs = 0; G.stats.banks = 0; G.stats.deaths = 0; G.stats.collects = 0;
    G.events = {};
    TL.Shark.reset(G.shark);
    TL.Prey.reset(0);
    TL.Enemies.reset();
    TL.Pickups.reset(G);
    TL.FX.reset();
    G.cam.x = U.clamp(G.shark.x - C.DESIGN_W * 0.42, 0, C.WORLD_W - C.DESIGN_W);
  }

  /* =================================================================
   * ALARM（GDD-02 §3.1 / §3.2）
   * ================================================================= */
  function addAlarm(v) {
    G.alarm = U.clamp(G.alarm + v, 0, C.ALARM.MAX);
  }

  function updateAlarm(dt) {
    var s = G.shark, A = C.ALARM;
    var slope;
    if (s.state === 'beached') slope = A.SLOPE.BEACHED;
    else if (s.zone === C.ZONE.BEACH) slope = A.SLOPE.BEACH;
    else if (s.airborne) slope = A.SLOPE.AIRBORNE;
    else if (s.zone === C.ZONE.DEEP) {
      slope = (s.speed < A.STILL_SPEED) ? A.SLOPE.DEEP_STILL : A.SLOPE.DEEP_MOVING;
    } else if (s.zone === C.ZONE.SHALLOW) slope = A.SLOPE.SHALLOW;
    else slope = A.SLOPE.SURF;

    G.alarm = U.clamp(G.alarm + slope * dt, 0, A.MAX);

    /* 档位迟滞（🔒 安全要求：迟滞未实现 = 等效闪烁超标） */
    var t = G.tier;
    if (t < 3 && G.alarm >= A.UP[t]) { G.tier = t + 1; onTierChange(1); }
    else if (t > 0 && G.alarm < A.DOWN[t - 1]) { G.tier = t - 1; onTierChange(-1); }

    /* 「通缉令拉满」事件：重复触发锁（跌破 90 才重触发，GDD-02 E6） */
    if (G.alarm >= 100) {
      if (G.maxEventArmed) {
        G.maxEventArmed = false;
        triggerFlash(C.PAL.WHITE, 0.35);
        TL.Audio.play('alarmMax');       // 三连上行 + 三全音悬置，与普通升档区分
        G.addToast('通缉令拉满');
      }
    } else if (G.alarm < A.MAX_EVENT_REARM) {
      G.maxEventArmed = true;
    }
  }

  function onTierChange(dir) {
    TL.Audio.play(dir > 0 ? 'tierUp' : 'tierDown');
    triggerFlash(dir > 0 ? C.PAL.AMBER : C.PAL.PALE, 0.18);
    G.addToast((dir > 0 ? '↑ ' : '↓ ') + C.TIER_NAME[G.tier] + ' T' + G.tier);
  }

  /* =================================================================
   * 反馈（全部走「呼吸式」，禁用硬 on/off）
   * ================================================================= */
  /* 🔒 硬红线①统一闸门：全项目屏闪必须在**唯一出口**限频。
   *
   * 为什么必须放在这里，而不是各个调用点各自加冷却：
   *   实测超标场景（QA PH6-QA-002 ①c）—— 冲刺命中**救生员**时
   *   LIFEGUARD.danger = 2.0 → ALARM 一次 +40；updateAlarm 每帧只升一档，
   *   于是从 40 连续两帧各跨一次阈值（50 与 75），onTierChange 被调用两次、
   *   各闪一次，再叠加同帧的咬合闪 → 1 秒窗口内 **3 次屏闪**，超过项目自定的 ≤2。
   *   逐个调用点打补丁必然漏（本文件有 3 处调用点，未来还会加），
   *   所以在 triggerFlash 里统一用 C.FLASH_GAP 钳制间隔 —— 任何来源都绕不过去。
   *   FLASH_GAP = 0.51s ⟹ 任意 1 秒窗口至多 2 次闪，严格 ≤2Hz。
   *   注意：这里只压制**视觉**，音效与 toast 照常触发，不产生「无反馈死区」。 */
  var lastFlashAt = -1e9;
  function triggerFlash(hex, amount) {
    if (!G.opts || !G.opts.flash) return;      // 关闭「闪烁」→ 无全屏色闪
    if (G.time - lastFlashAt < C.FLASH_GAP) return;
    lastFlashAt = G.time;
    G.flashCol = U.hex2rgb(hex);
    G.flash = amount;
  }
  function triggerShake(px) {
    if (!G.opts || !G.opts.shake) return;
    if (px > G.cam.shake) G.cam.shake = px;
  }
  function triggerFreeze(sec) { if (sec > G.freeze) G.freeze = sec; }

  function addToast(text) {
    G.toasts.push({ text: text, t: 0 });
    if (G.toasts.length > 4) G.toasts.shift();
  }

  /* =================================================================
   * 咬合 / 捕食（GDD-03 §3.1）
   * ================================================================= */
  function tryBite(s) {
    if (s.carryK >= C.CARRY_MAX) return;
    if (!s.alive) return;
    var mb = TL.Shark.mouthBox(s);
    var p = TL.Prey.hit(mb);
    if (!p) return;

    var def = C.PREY[p.type.toUpperCase()] || C.PREY.SWIMMER;
    s.dashBites++;
    s.dashT = -1;
    s.dashCd = C.DASH.CD;             // 一次冲刺 = 一次押注，账本清晰
    s.biteT = C.BITE.DUR;
    s.carry.push(p.type);
    G.pendingScore += def.score;
    G.pendingCount++;
    G.combo += C.COMBO.PER_GRAB;
    if (G.combo > G.comboMax) G.comboMax = G.combo;
    G.stats.grabs++;
    addAlarm(C.ALARM.GRAB * def.danger);
    TL.Prey.consume(p);

    /* 反馈四件套中，震屏与色闪有 0.5s 内部冷却（GDD-03 §5.3 安全裁决） */
    triggerFreeze(C.BITE.FREEZE);
    TL.FX.predation(p.x, p.y);
    TL.Audio.play('bite');
    if (s.shakeCd <= 0) {
      s.shakeCd = C.BITE.SHAKE_CD;
      triggerShake(C.BITE.SHAKE);
      triggerFlash(C.PAL.MAGENTA, 0.22);
    }
    addToast('+' + def.score + ' 未兑现 · ALARM +' + Math.round(C.ALARM.GRAB * def.danger));
  }

  /* =================================================================
   * DECOY BREACH（GDD-03 §3.4）
   * ================================================================= */
  function onSurfaceCross(s, x, y) {
    if (x < C.DECOY.MIN_X) return;             // 深海不触发（裁决 1）
    G.decoyFired = true;
    s.stamina = Math.max(0, s.stamina - C.DECOY.COST);   // 代价无条件（E5）
    addAlarm(C.ALARM.DECOY);
    TL.FX.splash(x, y, 26, U.hex2rgb(C.PAL.WHITE), 280);
    TL.FX.shockRing(x, y, 180);
    TL.Audio.play('decoy');
    var n = TL.Enemies.decoyAt(x, y);
    if (n > 0) TL.Audio.play('decoyHit');   // 惊动音：只有真的引到了才有
    addToast(n > 0 ? ('声东击西 · 重定向 ' + n + ' 个') : '声东击西 · 无目标（代价照付）');
    /* 反馈层级低于捕食：不给震屏、不给顿帧、不给洋红（裁决 3） */
  }

  /* =================================================================
   * 强制打断态（GDD-02 §3.4）
   * ================================================================= */
  function applyStun() {
    var s = G.shark;
    if (!s.alive || s.iframeT > 0) return;
    s.stunT = C.STUN_DUR;
    addAlarm(C.ALARM.CC_HIT);
    TL.Audio.play('hit');
    TL.FX.splash(s.x, s.y, 8, U.hex2rgb(C.PAL.PALE), 90);
    addToast('被浮标命中 · 眩晕 1.5s');
  }
  function applySnare() {
    var s = G.shark;
    if (!s.alive || s.iframeT > 0) return;
    s.snareT = C.SNARE_DUR;
    addAlarm(C.ALARM.CC_HIT);
    TL.Audio.play('hit');
    addToast('被渔网束缚 1.5s');
  }
  function applySlow() {
    var s = G.shark;
    if (s.slowT > 0) return;
    s.slowT = C.SLOWED.DUR;
    TL.Audio.play('hit');
    TL.FX.splash(s.x, s.y + 30, 6, U.hex2rgb(C.PAL.PALE), 70);
  }
  function jetskiHit(e) {
    var s = G.shark;
    if (s.iframeT > 0) return;
    if (s.carryK > 0) {
      var lost = s.carry.pop();
      var def = C.PREY[lost.toUpperCase()] || C.PREY.SWIMMER;
      G.pendingScore = Math.max(0, G.pendingScore - def.score);
      G.pendingCount = Math.max(0, G.pendingCount - 1);
      addToast('被摩托艇撞掉 1 个战利品');
    } else {
      addToast('被摩托艇撞击');
    }
    addAlarm(C.ALARM.JETSKI);
    s.iframeT = C.ENEMY.T2B.IFRAME;
    TL.Audio.play('hit');
    triggerShake(4);
    // 击退 0.3s（用 Slow 复用实现，方向由玩家接管）
    s.slowT = Math.max(s.slowT, C.ENEMY.T2B.KNOCK);
  }

  /* =================================================================
   * 搁浅 / QTE（ADR-003 §2.4–§2.6）
   * ================================================================= */
  function enterBeached(s) {
    if (s.state === 'beached') return;
    s.state = 'beached';
    s.stunT = 0; s.snareT = 0;
    s.dashT = -1;
    G.decoyFired = false;

    /* E1：携带中搁浅 → 战利品掉落并立即判定为丢失，不可再拾取 */
    if (s.carryK > 0) {
      for (var i = 0; i < s.carryK; i++) {
        TL.FX.sandPuff(s.x - i * 24, s.y + 26, 6);
      }
      G.lostScore += G.pendingScore;
      G.lostCount += G.pendingCount;
      G.pendingScore = 0; G.pendingCount = 0;
      s.carry.length = 0;
      addToast('战利品全部散落沙上 · 不可再拾取');
    }

    var assist = G.opts && (G.opts.qteAssist || G.opts.reducedMotion);
    G.qte.active = true;
    G.qte.t = 0;
    G.qte.count = 0;
    G.qte.need = assist ? C.QTE_ASSIST.NEED : C.QTE.NEED;
    G.qte.window = assist ? C.QTE_ASSIST.WINDOW : C.QTE.WINDOW;
    G.qte.lastTap = -1;
    G.desatTarget = 1;                 // 「画面只剩灰与白」
    /* 搁浅确认音（抽气声，带通 1800→300Hz 扫描 = 「颜色被抽干」的听觉对应）。
     * 注意：预警音 'sting' 由 shark.js 在 strandWarn 时播放，二者语义不同，不可混用。 */
    TL.Audio.play('beached');
    TL.FX.sandPuff(s.x, s.y + 30, 14);
    triggerShake(3);
  }

  function updateQTE(dt, taps) {
    var q = G.qte;
    if (!q.active) return;
    q.t += dt;
    for (var i = 0; i < taps.length; i++) {
      var tt = taps[i] / 1000;
      if (q.lastTap < 0 || tt - q.lastTap >= C.QTE.MIN_INTERVAL) {
        q.lastTap = tt;
        q.count++;
        TL.Audio.play('thrash');
        TL.FX.sandPuff(G.shark.x + U.rr(-40, 40), G.shark.y + 30, 4);
        if (q.count >= q.need) { qteSuccess(); return; }
      }
    }
    if (q.t >= q.window) qteFail();
  }

  function qteSuccess() {
    var s = G.shark;
    G.qte.active = false;
    s.state = 'cruise';
    s.strandT = 0; s.strandWarn = false;
    G.desatTarget = 0;
    // 弹回水中（并立刻刷新区域与速率，避免脱困帧仍带着 beached 的 speed=0 被误判再次搁浅）
    s.x = Math.min(s.x - 300, TL.World.shoreX - 200);
    s.y = TL.World.waterLineY(s.x, G.time) + 90;
    s.theta = 180;
    s.zone = TL.World.zoneAt(s.x, s.zone);
    s.speed = C.V_CRUISE * C.CARRY_V(s.carryK);
    s.strandWarn = false;
    triggerFreeze(C.QTE.FREEZE);
    triggerShake(C.QTE.SHAKE);
    TL.FX.splash(s.x, s.y, 22, U.hex2rgb(C.PAL.WHITE), 220);
    TL.Audio.play('rescued');
    addToast('挣脱！空手弹回水中');
  }

  function qteFail() {
    G.qte.active = false;
    killShark('beached');
  }

  /* =================================================================
   * Bank（GDD-03 §3.6）
   * ================================================================= */
  function comboMult() {
    return Math.min(1 + C.COMBO.STEP * G.combo, C.COMBO.M_CAP);
  }

  function updateBank(dt) {
    var s = G.shark;
    if (!s.alive) { G.bankT = 0; return; }
    if (s.carryK <= 0) { G.bankT = 0; return; }

    var ok = s.zone === C.ZONE.DEEP
      && TL.Enemies.tetherCount() === 0
      && s.state !== 'beached' && s.state !== 'stunned' && s.state !== 'snared';
    if (ok) {
      G.bankT += dt;
      if (G.bankT >= C.BANK.DIGEST) doBank();
    }
    // E7：离开条件 → 中断但进度保留（不回零）
  }

  function doBank() {
    var s = G.shark;
    var m = comboMult();
    var k = s.carryK;
    var score = Math.round(G.pendingScore * m * C.BANK_B(k));
    G.banked += score;
    if (G.combo > G.comboMax) G.comboMax = G.combo;
    G.stats.banks++;
    s.carry.length = 0;
    G.pendingScore = 0; G.pendingCount = 0;
    G.combo = 0;
    G.alarm = 0; G.tier = 0; G.maxEventArmed = true;
    G.bankT = 0;
    TL.Audio.play('bank');
    triggerFlash(C.PAL.CYAN, 0.20);
    TL.FX.splash(s.x, s.y, 16, U.hex2rgb(C.PAL.CYAN), 160);
    for (var i = 0; i < 10; i++) {
      TL.FX.bubble(s.x + U.rr(-40, 40), s.y + U.rr(-30, 30));
    }
    addToast('落袋 +' + score + '（×' + m.toFixed(1) + '）');
  }

  /* =================================================================
   * 死亡（GDD-02 E5 优先级：QTE 失败 > 锁定 > 鱼叉）
   * ================================================================= */
  function killShark(reason) {
    var prio = DEATH_PRIO[reason] === undefined ? 0 : DEATH_PRIO[reason];
    if (G.over) return;
    var s = G.shark;
    if (!s.alive) return;
    s.alive = false;
    s.state = 'dead';
    G.over = true;
    G.deathReason = reason;
    G.deathPrio = prio;
    G.qte.active = false;
    G.comboLost = G.combo;               // 未兑现 COMBO（E2：必须明确告知）
    /* ⭐ 先记账再清零：pending 一旦归零，结算页就再也算不出玩家损失了多少 */
    G.lostScore += G.pendingScore;
    G.lostCount += G.pendingCount;
    G.pendingScore = 0; G.pendingCount = 0;
    G.combo = 0;
    G.desatTarget = 0.85;
    G.stats.deaths++;
    TL.Audio.play('death');
    triggerShake(8);
  }

  /* =================================================================
   * 主更新
   * ================================================================= */
  function update(dtRaw) {
    G.dtRaw = dtRaw;
    if (!G.running || G.paused) return;

    var dt = Math.min(dtRaw, C.DT_CLAMP);
    G.time += dt;

    /* 顿帧：只冻结逻辑推进，输入照常采集（ADR-003 §2.6） */
    if (G.freeze > 0) {
      G.freeze -= dtRaw;
    }

    /* 输入 */
    var IN = TL.Input;
    G.hasDir = IN.hasDir;
    G.dirX = IN.dirX; G.dirY = IN.dirY;
    var dash = IN.consumeDash();
    G.dashPressed = dash;
    var taps = IN.takeTaps();

    /* QTE 期间只跑 QTE */
    if (G.qte.active) {
      updateQTE(dt, taps);
      updateAlarm(dt);                   // 搁浅期间 ALARM 仍 +8/s（GDD-02 §3.1）
      TL.FX.update(dt);
      updateCamera(dt);
      updateFeedback(dt);
      return;
    }

    if (G.freeze <= 0 && !G.over) {
      var s = G.shark;

      /* ADR-003 §2.5：预警窗口内冲刺可自救（关键的技巧轴） */
      if (s.strandWarn && s.state !== 'beached' && dash && s.stamina >= 1) {
        s.stamina -= 1;
        s.strandT = 0; s.strandWarn = false;
        s.x -= 140;
        s.y = TL.World.waterLineY(s.x, G.time) + 90;
        s.theta = 180;
        TL.FX.splash(s.x, s.y, 16, U.hex2rgb(C.PAL.WHITE), 200);
        TL.Audio.play('rescued');
        addToast('冲刺脱困 −1 体力');
        G.dashPressed = false;
      }

      TL.Shark.update(s, dt, G);
      TL.Prey.update(dt, G);
      TL.Pickups.update(dt, G);        // 副循环：冲浪收集（原子计入 pending）
      TL.Enemies.spawnByTier(G.tier, G);
      TL.Enemies.update(dt, G);
      updateAlarm(dt);

      /* 接触判定（GDD-02 §3.4） */
      if (s.alive) {
        var hit = TL.Enemies.hitTestShark(s);
        if (hit && s.iframeT <= 0) {
          if (hit.kind === 'T1') applySlow();
          else if (hit.kind === 'T2B') jetskiHit(hit.e);
        }
      }

      updateBank(dt);
    } else {
      TL.Prey.update(dt * 0.2, G);
      TL.Pickups.update(dt * 0.2, G);   // 顿帧 / 死亡慢镜：随场景一起减速
    }

    TL.FX.update(dt);
    updateCamera(dt);
    updateFeedback(dt);

    for (var i = G.toasts.length - 1; i >= 0; i--) {
      G.toasts[i].t += dtRaw;
      if (G.toasts[i].t > 2.6) G.toasts.splice(i, 1);
    }
  }

  function updateCamera(dt) {
    var s = G.shark, cam = G.cam;
    if (G.qte.active || s.state === 'beached') {
      // ADR-003 §6.3 方案 A：相机缓推，鲨鱼落在水平 62% / 垂直 46%
      cam.tx = U.clamp(s.x - C.DESIGN_W * C.CAM.FOCUS_X, 0, C.WORLD_W - C.DESIGN_W);
      cam.ty = U.clamp(s.y - C.DESIGN_H * C.CAM.FOCUS_Y, C.CAM.Y_MIN, 0);
    } else {
      cam.tx = U.clamp(s.x - C.DESIGN_W * 0.42, 0, C.WORLD_W - C.DESIGN_W);
      cam.ty = 0;
    }
    var rate = (G.qte.active ? C.CAM.BEACH_PAN * 8 : C.CAM.LERP);
    cam.x = U.damp(cam.x, cam.tx, rate, dt);
    cam.y = U.damp(cam.y, cam.ty, rate, dt);

    if (cam.shake > 0.2) {
      cam.shake *= Math.pow(0.02, dt);
      cam.sx = (U.rand() * 2 - 1) * cam.shake;
      cam.sy = (U.rand() * 2 - 1) * cam.shake;
    } else { cam.shake = 0; cam.sx = 0; cam.sy = 0; }
  }

  function updateFeedback(dt) {
    G.desat = U.damp(G.desat, G.desatTarget, 6, dt);
    if (G.flash > 0) {
      G.flash -= dt * 2.2;
      if (G.flash < 0) G.flash = 0;
    }
  }

  /* =================================================================
   * 渲染
   * ================================================================= */
  function drawBackground(B) {
    var W = TL.World;
    var x0 = G.cam.x - 40, x1 = G.cam.x + C.DESIGN_W + 40;
    var yTop = G.cam.y - 420;
    var STEPX = 24;
    var i, x, col;

    /* 天空（黄昏带，明度自下而上递减） */
    var skyBands = 7;
    for (i = 0; i < skyBands; i++) {
      var t = i / (skyBands - 1);
      col = [
        0.055 + (0.180 - 0.055) * (1 - t),
        0.078 + (0.290 - 0.078) * (1 - t),
        0.145 + (0.420 - 0.145) * (1 - t)
      ];
      B.draw('dot1', (x0 + x1) / 2, yTop + (C.WATER_BASE - yTop) * (i / skyBands) + (C.WATER_BASE - yTop) / skyBands / 2,
        x1 - x0, (C.WATER_BASE - yTop) / skyBands + 2, { tint: col });
    }

    /* 太阳（ALARM 档位的冗余形态通道） */
    var sunSprite = G.tier >= 3 ? 'sun_siege' : (G.tier >= 1 ? 'sun_alert' : 'sun_calm');
    var sunX = 520 + G.cam.x * 0.06;                    // 视差 0.06
    B.draw(sunSprite, sunX, yTop + 90, 64, 52);

    /* 水体 + 海床 + 沙层（逐列） */
    for (x = Math.floor(x0 / STEPX) * STEPX; x <= x1; x += STEPX) {
      var wl = W.waterLineY(x, G.time);
      var sbY = W.seabedY(x);
      var wc = waterColorAt(x);

      if (sbY > wl) {
        B.draw('dot1', x + STEPX / 2, (wl + sbY) / 2, STEPX + 1, sbY - wl, { tint: wc });
      }
      // 沙层截面：水线以上为干沙（亮），以下为湿沙（暗）
      if (sbY < C.WORLD_BOTTOM) {
        var dryH = Math.max(0, wl - sbY);
        if (dryH > 0) B.draw('dot1', x + STEPX / 2, (sbY + wl) / 2, STEPX + 1, dryH, { tint: SAND_DRY });
        var wetH = C.WORLD_BOTTOM - Math.max(sbY, wl);
        if (wetH > 0) {
          B.draw('dot1', x + STEPX / 2, Math.max(sbY, wl) + wetH / 2, STEPX + 1, wetH, { tint: SAND_WET });
        }
      }
    }

    /* 深海光柱（Bank 区标记，形态通道） */
    var deepEdge = Math.min(750, x1);
    if (x0 < 750) {
      var bx0 = Math.max(x0, 0), bx1 = deepEdge;
      if (bx1 > bx0) {
        B.draw('dot1', (bx0 + bx1) / 2, 440, bx1 - bx0, 900,
          { tint: [0.10, 0.35, 0.55], fade: 0.16, bucket: 'add' });
        // 下坠箭头列：明确的「这里结算」
        for (i = 0; i < 6; i++) {
          B.draw('dot1', 360, 180 + i * 90 + Math.sin(G.time * 2 + i) * 12, 60, 4,
            { tint: [0.55, 0.85, 1.0], fade: 0.30, bucket: 'add' });
        }
      }
      // 深海边界虚线
      for (i = 0; i < 20; i++) {
        B.draw('dot1', 750, 120 + i * 38, 3, 20, { tint: [0.6, 0.75, 0.9], fade: 0.30 });
      }
    }

    /* 水面泡沫线 */
    for (x = Math.floor(x0 / 32) * 32; x <= x1; x += 32) {
      var w2 = W.waterLineY(x, G.time);
      var dep = W.depthAt(x);
      if (dep < 24) continue;
      B.draw('foam', x, w2, 32, 6, { fade: U.clamp(dep / 120, 0.15, 0.9) });
    }

    /* 深海光斑（低频视差装饰） */
    for (i = 0; i < 10; i++) {
      var rx = 140 + ((i * 337) % 700);
      var ry = 260 + ((i * 191) % 420);
      B.draw('dot1', rx + G.cam.x * 0.25, ry, 90 + (i % 3) * 40, 4,
        { tint: [0.35, 0.62, 0.85], fade: 0.10, bucket: 'add' });
    }
  }

  function drawQTERing(B) {
    var q = G.qte;
    var cx = C.DESIGN_W / 2, cy = C.DESIGN_H / 2;
    var t = U.clamp(q.t / q.window, 0, 1);
    var rad = U.lerp(C.QTE.RING_OUTER, C.QTE.RING_INNER, t);
    var prog = q.count / q.need;
    var mag = U.hex2rgb(C.PAL.MAGENTA);
    var wht = U.hex2rgb(C.PAL.WHITE);
    var N = 46;
    for (var i = 0; i < N; i++) {
      var a = (i / N) * U.TAU - Math.PI / 2;
      var px = cx + Math.cos(a) * rad;
      var py = cy + Math.sin(a) * rad;
      var seg = i / N;
      var col = seg <= prog ? mag : wht;
      var fade = seg <= prog ? 1 : 0.55;
      var sz = seg <= prog ? 8 : 5;
      B.draw('dot2', px, py, sz, sz, { tint: col, fade: fade, bucket: 'add' });
    }
    // 内环：剩余时间扇形（形态通道，灰度可读）
    var inner = C.QTE.RING_INNER - 26;
    var M = 30;
    for (var j = 0; j < M; j++) {
      if ((j / M) > (1 - t)) continue;
      var a2 = (j / M) * U.TAU - Math.PI / 2;
      B.draw('dot2', cx + Math.cos(a2) * inner, cy + Math.sin(a2) * inner, 6, 6,
        { tint: wht, fade: 0.7, bucket: 'add' });
    }
    // 目标刻度：每命中一针点亮一格
    for (var k = 0; k < q.need; k++) {
      var a3 = -Math.PI / 2 + (k / q.need) * U.TAU;
      var r3 = C.QTE.RING_OUTER + 22;
      B.draw('dot2', cx + Math.cos(a3) * r3, cy + Math.sin(a3) * r3, 10, 10,
        { tint: k < q.count ? mag : wht, fade: k < q.count ? 1 : 0.35, bucket: 'add' });
    }
  }

  function render(B, post, rt) {
    var gl = B.gl;
    var s = G.shark;

    /* --- 世界 pass → RT_WORLD(720x432) --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb);
    gl.viewport(0, 0, rt.w, rt.h);
    gl.clearColor(0.039, 0.055, 0.090, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    B.begin('world', G.cam.x + G.cam.sx, G.cam.y + G.cam.sy);
    drawBackground(B);
    TL.Pickups.draw(B, G);
    TL.Prey.draw(B, G);
    TL.Enemies.draw(B, G);
    TL.Shark.draw(s, B, G);
    TL.FX.draw(B);
    B.flush();

    /* --- 后期 pass → 显示 (1440x864) --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    post.crt = G.opts.crt ? 1 : 0;
    post.scan = G.opts.crt ? 1.0 : 0.0;
    post.jitter = G.opts.jitter && !G.opts.reducedMotion ? 0.6 : 0.0;
    post.vig = 1.0;
    post.ca = G.opts.crt ? 1.5 : 0;
    post.desat = G.desat;
    post.flash = G.flash;
    post.flashCol = G.flashCol;
    post.danger = (G.tier >= 3 && !G.over) ? 1 : 0;
    post.time = G.time;
    post.draw(rt.tex, C.DESIGN_W, C.DESIGN_H);

    /* --- 叠加 pass：QTE 圆环是去饱和后画面上「唯一保留的颜色」 --- */
    if (G.qte.active) {
      B.begin('screen', 0, 0);
      drawQTERing(B);
      B.flush();
    }
  }

  /* 对外接口 */
  G.init = init;
  G.reset = reset;
  G.update = update;
  G.render = render;
  G.addToast = addToast;
  G.applyStun = applyStun;
  G.applySnare = applySnare;
  G.applySlow = applySlow;
  G.killShark = killShark;
  G.enterBeached = enterBeached;
  G.tryBite = tryBite;
  G.onSurfaceCross = onSurfaceCross;
  G.comboMult = comboMult;
  G.hardRestart = function () { reset(); };

  TL.Game = G;
})();

</script>
<script>
/* ===== src/ui/hud.js ===== */
/* =====================================================================
 * TIDELINE · ui/hud.js
 * DOM HUD（ADR-001 §2.3）+ Title / Pause / Results / Options 屏幕。
 *
 * 可访问性硬红线②：颜色永不作为唯一信息通道。
 *   ALARM 等级 = 条长度（连续）+ 刻度形状（25/50/75 缺口）+ 音效 + 文字
 *   是否携带   = 鲨鱼姿态 + 战利品格子数 + 水花拖尾（canvas 侧）
 * ===================================================================== */
(function () {
  var TL = (window.TL = window.TL || {});
  var C = TL.C, U = TL.U;

  var el = {};
  var opts = null;
  var lastTier = -1;

  function $(id) { return document.getElementById(id); }

  function init(options) {
    opts = options;
    ['scoreVal', 'pendingVal', 'tierName', 'alarmNum', 'alarmFill', 'alarmA11y',
      'stamina', 'carry', 'comboBox', 'zoneBox', 'prompt', 'toasts', 'bankBar',
      'screens', 'panel', 'dangerEdge', 'stage'].forEach(function (k) { el[k] = $(k); });

    for (var i = 0; i < C.STAMINA_MAX; i++) {
      var d = document.createElement('div'); d.className = 'pip'; el.stamina.appendChild(d);
    }
    for (var j = 0; j < C.CARRY_MAX; j++) {
      var c = document.createElement('div'); c.className = 'pip'; el.carry.appendChild(c);
    }
    applyOptionClasses();
  }

  function applyOptionClasses() {
    var h = document.documentElement;
    h.classList.toggle('cb', !!opts.colorblind);
    h.classList.toggle('no-crt', !opts.crt);
    h.classList.toggle('no-flash', !opts.flash);
    h.classList.toggle('rm', !!opts.reducedMotion);
  }

  /* ---------------- 每帧更新 ---------------- */
  function update(G) {
    var s = G.shark;

    el.scoreVal.textContent = G.banked;
    el.pendingVal.textContent = '未兑现 ' + G.pendingScore + '（' + G.pendingCount + ' 个）';

    /* ALARM：长度 + 数值 + 刻度 + 档位名 */
    var a = G.alarm;
    el.alarmNum.textContent = Math.round(a);
    el.alarmFill.style.width = a.toFixed(1) + '%';
    el.tierName.textContent = C.TIER_NAME[G.tier] + ' T' + G.tier;
    if (G.tier !== lastTier) {
      lastTier = G.tier;
      document.documentElement.style.setProperty('--accent',
        G.tier >= 3 ? 'var(--blood)' : (G.tier >= 1 ? 'var(--amber)' : 'var(--white)'));
      el.alarmA11y.textContent = '通缉等级 ' + C.TIER_NAME[G.tier];
    }
    el.dangerEdge.classList.toggle('on', G.tier >= 3 && !G.over);

    /* 体力三格（离散，不做平滑条 —— 街机感） */
    var pips = el.stamina.children;
    for (var i = 0; i < pips.length; i++) {
      var filled = s.stamina >= (i + 1) - 0.001;
      var partial = s.stamina > i && s.stamina < i + 1;
      pips[i].classList.toggle('on', filled);
      pips[i].classList.toggle('low', !filled && partial);
      // 最后一格：2Hz 呼吸式脉动（关闭「闪烁」时改常亮，不留无反馈死区）
      if (!filled && partial && opts.flash && !opts.reducedMotion) {
        pips[i].style.opacity = (0.35 + 0.5 * U.breath(G.time, 2)).toFixed(3);
      } else {
        pips[i].style.opacity = '1';
      }
    }

    /* 战利品格子（数得出来的冗余通道） */
    var cp = el.carry.children;
    for (var j = 0; j < cp.length; j++) cp[j].classList.toggle('on', j < s.carryK);

    el.comboBox.innerHTML = 'COMBO ×' + G.comboMult().toFixed(1) +
      '<small>' + G.combo + ' 连击 · 上限 ×' + C.COMBO.M_CAP.toFixed(1) + '</small>';
    el.zoneBox.textContent = '区域：' + C.ZONE_NAME[s.zone] +
      (s.surf ? '（冲浪中 ×1.25）' : '') + '　|　速度 ' + Math.round(s.speed) + ' px/s' +
      (s.carryK > 0 ? '　|　携带 ' + s.carryK + '/4（速率 ×' + C.CARRY_V(s.carryK).toFixed(2) + '）' : '');

    /* 中央提示 */
    var p = '';
    if (G.qte.active) {
      var left = Math.max(0, G.qte.window - G.qte.t);
      p = '连打！ ' + G.qte.count + ' / ' + G.qte.need +
        '<small>剩余 ' + left.toFixed(1) + ' s　·　空格 / 点击画布</small>';
    } else if (s.strandWarn) {
      p = '正在陷进沙里！' + '<small>立刻按「冲刺」脱困（−1 体力）</small>';
    } else if (G.bankT > 0 && s.carryK > 0) {
      p = '结算中…' + '<small>' + (G.bankT / C.BANK.DIGEST * 100).toFixed(0) + '%</small>';
    } else if (s.state === 'stunned') {
      p = '眩晕' + '<small>' + s.stunT.toFixed(1) + ' s</small>';
    } else if (s.state === 'snared') {
      p = '被渔网束缚' + '<small>' + s.snareT.toFixed(1) + ' s</small>';
    }
    el.prompt.innerHTML = p;

    /* Bank 进度条 */
    if (G.bankT > 0 && s.carryK > 0) {
      el.bankBar.style.display = 'block';
      el.bankBar.firstElementChild.style.width =
        Math.min(100, G.bankT / C.BANK.DIGEST * 100).toFixed(0) + '%';
    } else {
      el.bankBar.style.display = 'none';
    }

    /* Toast */
    var html = '';
    for (var k = 0; k < G.toasts.length; k++) {
      var t = G.toasts[k];
      var op = U.clamp(2.6 - t.t, 0, 1);
      html += '<div class="toast" style="opacity:' + op.toFixed(2) + '">' + t.text + '</div>';
    }
    el.toasts.innerHTML = html;
  }

  /* ---------------- 屏幕 ---------------- */
  var OPT_LABELS = [
    ['shake', '屏幕震动'],
    ['flash', '屏幕闪烁（脉动）'],
    ['jitter', '扫描线抖动'],
    ['crt', 'CRT 后期（弯曲/色差）'],
    ['colorblind', '色盲模式（血红→电光蓝）'],
    ['qteAssist', 'QTE 辅助（3 次 / 3.5s）'],
    ['mute', '静音'],
    ['music', '背景音乐'],
    ['integerSnap', '整数倍缩放（大黑边）']
  ];

  function optsHtml() {
    var h = '<div class="opts">';
    for (var i = 0; i < OPT_LABELS.length; i++) {
      var k = OPT_LABELS[i][0], label = OPT_LABELS[i][1];
      h += '<label class="opt"><input type="checkbox" data-opt="' + k + '"' +
        (opts[k] ? ' checked' : '') + '>' + label + '</label>';
    }
    h += '<label class="opt">粒子密度 <select data-opt="particles">' +
      '<option value="1"' + (opts.particles === 1 ? ' selected' : '') + '>100%</option>' +
      '<option value="0.5"' + (opts.particles === 0.5 ? ' selected' : '') + '>50%</option>' +
      '<option value="0"' + (opts.particles === 0 ? ' selected' : '') + '>0%（保留顿帧/动画）</option>' +
      '</select></label>';
    h += '</div>';
    return h;
  }

  function bindOpts() {
    var nodes = el.panel.querySelectorAll('[data-opt]');
    for (var i = 0; i < nodes.length; i++) {
      (function (n) {
        var key = n.getAttribute('data-opt');
        var ev = n.tagName === 'SELECT' ? 'change' : 'change';
        n.addEventListener(ev, function () {
          opts[key] = n.tagName === 'SELECT' ? parseFloat(n.value) : n.checked;
          if (key === 'mute') TL.Audio.setMuted(opts.mute);
          if (key === 'music') TL.Audio.setMusicEnabled(opts.music);
          if (key === 'particles') TL.FX.setDensity(opts.particles);
          applyOptionClasses();
          TL.Audio.play('ui');
        });
      })(nodes[i]);
    }
  }

  function showScreen(html) {
    el.panel.innerHTML = html;
    el.screens.classList.add('show');
    bindOpts();
    var first = el.panel.querySelector('button');
    if (first) first.focus();
  }
  function hideScreen() { el.screens.classList.remove('show'); }
  function visible() { return el.screens.classList.contains('show'); }

  function title() {
    showScreen(
      '<h1>潮线 TIDELINE</h1>' +
      '<div class="tag">MVP 垂直切片 · PHASE 5 · 核心循环验证</div>' +
      '<p>你是一条鲨鱼。你<b>永远不能停下</b>——你只能决定往哪儿游（GDD-01 §3.1）。<br>' +
      '冲上沙滩叼走游客，顶着 ALARM 通缉逃回深海落袋。<b>被抓到、或搁浅 QTE 失败，未结算的一切全部作废。</b></p>' +
      '<div class="keys">' +
      '<b>方向</b><span>方向键 / WASD，或单指拖拽（相对位移）</span>' +
      '<b>冲刺</b><span>空格 / J，或第二指点按。咬合<b>只在冲刺中判定</b></span>' +
      '<b>声东击西</b><span>冲刺中穿出水面自动触发（−1 体力，ALARM +8）</span>' +
      '<b>搁浅 QTE</b><span>连打空格或点击画布，2.5 秒内 6 次</span>' +
      '<b>落袋</b><span>带着战利品游回深海（x &lt; 750）自动结算</span>' +
      '</div>' +
      optsHtml() +
      '<div class="note">硬红线：闪烁频率 ≤ 2 Hz 且全项目禁用硬 on/off；5 个正交开关可独立关闭（右上角暂停菜单内亦可调整）。<br>' +
      '检测到系统「减少动态效果」时会自动降级。</div>' +
      '<div class="btnrow"><button class="primary" data-act="start">开始游戏</button></div>'
    );
  }

  function pause(G) {
    showScreen(
      '<h2>已暂停</h2>' +
      '<div class="rows">' +
      '<div><span>已入账分数</span><b>' + G.banked + '</b></div>' +
      '<div><span>未兑现押注</span><b>' + G.pendingScore + '</b></div>' +
      '<div><span>ALARM</span><b>' + Math.round(G.alarm) + ' · ' + C.TIER_NAME[G.tier] + '</b></div>' +
      '</div>' +
      optsHtml() +
      '<div class="btnrow">' +
      '<button class="primary" data-act="resume">继续</button>' +
      '<button data-act="restart">重新开始</button>' +
      '</div>'
    );
  }

  function results(G) {
    var reason = {
      beached: '搁浅 · QTE 失败',
      tether: '直升机锁定满 3.0 s',
      harpoon: '被鱼叉命中'
    }[G.deathReason] || '未知';

    showScreen(
      '<h2>这一局结束了</h2>' +
      '<div class="tag">死因：' + reason + '</div>' +
      '<div class="rows">' +
      '<div><span>已入账 SCORE（保留）</span><b>' + G.banked + '</b></div>' +
      /* ⭐ 必须读 lostScore：pendingScore 在死亡/搁浅时已被清零，
         直接读它会让这一行永远显示 −0，玩家看不到自己亏了什么 */
      '<div><span class="loss">未兑现押注（作废）</span><b class="loss">−' +
      (G.lostScore || 0) + (G.lostCount ? '（' + G.lostCount + ' 个）' : '') + '</b></div>' +
      '<div><span class="loss">未兑现 COMBO</span><b class="loss">×' + (1 + C.COMBO.STEP * G.comboLost).toFixed(1) + ' → 0</b></div>' +
      '<div><span>本局最高 COMBO</span><b>' + G.comboMax + '</b></div>' +
      '<div><span>捕食 / 落袋次数</span><b>' + G.stats.grabs + ' / ' + G.stats.banks + '</b></div>' +
      '<div><span>冲浪收集</span><b>' + G.stats.collects + ' 个</b></div>' +
      '</div>' +
      '<div class="note">原子性规则：五步（潜行 → 冲刺 → 捕食 → 逃生 → 结算）走完才算数，中途死亡则本次押注全损（GDD-03 §1）。<br>' +
      'COMBO 倍率不是分数，是「待兑现的乘数」——被乘数作废，乘数自然归零（GDD-03 E2）。</div>' +
      optsHtml() +
      '<div class="btnrow"><button class="primary" data-act="restart">再来一局</button></div>'
    );
  }

  TL.HUD = {
    init: init, update: update,
    title: title, pause: pause, results: results,
    hide: hideScreen, visible: visible,
    applyOptionClasses: applyOptionClasses,
    panel: function () { return el.panel; }
  };
})();

</script>
<script>
/* ===== src/main.js ===== */
/* =====================================================================
 * TIDELINE · main.js
 * 引导：GL 上下文 → 图集 → 批处理器 → RT → 后期 → 固定步长主循环。
 * 无构建步骤，双击 index.html 即可运行（也可用任意静态服务器）。
 * ===================================================================== */
(function () {
  var TL = window.TL, C = TL.C, U = TL.U;

  /* ---------------- 选项（5 个正交开关 + 可访问性） ---------------- */
  var opts = {
    shake: true, flash: true, jitter: true, crt: true, particles: 1,
    colorblind: false, qteAssist: false, mute: false, integerSnap: false,
    reducedMotion: false, music: true
  };
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  if (mq && mq.matches) {
    opts.reducedMotion = true;
    opts.shake = false; opts.flash = false; opts.jitter = false; opts.particles = 0.5;
  }

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('gl');
  var gl = null, B = null, post = null, rt = null, atlasTex = null, bayerTex = null;
  var glLost = false;

  function initGL() {
    var info = TL.glx.createContext(canvas);
    if (!info) return false;
    gl = info.gl;
    var atlas = TL.buildAtlas();
    atlasTex = TL.glx.createTexture(gl, atlas.w, atlas.h, atlas.canvas);
    bayerTex = TL.glx.createBayerTexture(gl, U.BAYER8, 8);
    B = new TL.Batcher(gl, atlasTex, bayerTex);
    B.setAtlas(atlas.defs, atlas.w, atlas.h);
    rt = TL.glx.createFBO(gl, C.RT_W, C.RT_H);
    post = new TL.Post(gl, C.RT_W, C.RT_H);
    return true;
  }

  if (!initGL()) {
    stage.innerHTML = '<div style="padding:80px;font-size:22px;line-height:2">' +
      '本作需要 WebGL（WebGL2 或 WebGL1）。<br>当前浏览器/设备未提供可用的 WebGL 上下文。<br>' +
      '<span style="opacity:.6;font-size:16px">ADR-001：低于 WebGL1 的设备不做支持，无降级渲染路径。</span></div>';
    return;
  }

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault(); glLost = true;
  });
  canvas.addEventListener('webglcontextrestored', function () {
    if (initGL()) glLost = false;
  });

  /* ---------------- 启动 ---------------- */
  TL.HUD.init(opts);
  TL.Game.init(opts);
  TL.FX.setDensity(opts.particles);
  TL.Input.bind(stage);
  TL.HUD.title();

  /* ---------------- 视口适配（5:3 → letterbox） ---------------- */
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / C.DESIGN_W, vh / C.DESIGN_H);
    if (opts.integerSnap) s = Math.max(1, Math.floor(s));
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------------- 屏幕动作 ---------------- */
  var G = TL.Game;
  var mode = 'title';          // title | playing | paused | results
  var resultsDelay = 0;

  function startRun() {
    TL.Audio.init(); TL.Audio.resume();
    TL.Audio.setMuted(opts.mute);
    TL.Audio.setMusicEnabled(opts.music);
    TL.Audio.setSuspended(false);
    G.reset();
    TL.Input.clear();
    TL.HUD.hide();
    mode = 'playing';
    resultsDelay = 0;
  }

  document.getElementById('panel').addEventListener('click', function (e) {
    var n = e.target;
    while (n && n !== this && !(n.getAttribute && n.getAttribute('data-act'))) n = n.parentNode;
    if (!n || n === this) return;
    var act = n.getAttribute('data-act');
    TL.Audio.init(); TL.Audio.resume(); TL.Audio.play('ui');
    if (act === 'start' || act === 'restart') startRun();
    else if (act === 'resume') {
      mode = 'playing'; TL.HUD.hide(); TL.Input.clear(); TL.Audio.setSuspended(false);
    }
  });

  /* ---------------- 主循环 ---------------- */
  var acc = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;

  function frame(now) {
    var dtRaw = (now - last) / 1000;
    last = now;
    if (dtRaw > 0.25) dtRaw = 0.25;
    fpsAcc += dtRaw; fpsN++;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

    /* 全局按键 */
    if (TL.Input.consumePause()) {
      if (mode === 'playing') { mode = 'paused'; TL.HUD.pause(G); TL.Audio.setSuspended(true); }
      else if (mode === 'paused') { mode = 'playing'; TL.HUD.hide(); TL.Input.clear(); TL.Audio.setSuspended(false); }
    }
    if (TL.Input.consumeMute()) {
      opts.mute = !opts.mute; TL.Audio.setMuted(opts.mute);
      TL.HUD.applyOptionClasses();
      var cb = document.querySelector('[data-opt="mute"]');
      if (cb) cb.checked = opts.mute;
    }
    if (TL.Input.consumeConfirm()) {
      if (mode === 'title' || mode === 'results') startRun();
      else if (mode === 'paused') { mode = 'playing'; TL.HUD.hide(); TL.Input.clear(); }
    }

    if (!glLost) {
      if (mode === 'playing') {
        TL.Input.update();
        acc += dtRaw;
        var steps = 0;
        while (acc >= C.FIXED_DT && steps < C.MAX_STEPS) {
          G.update(C.FIXED_DT);
          acc -= C.FIXED_DT;
          steps++;
        }
        if (steps >= C.MAX_STEPS) acc = 0;      // 追不上就丢帧，不做死亡螺旋

        if (G.over) {
          resultsDelay += dtRaw;
          if (resultsDelay > 1.1) { mode = 'results'; TL.HUD.results(G); }
        }
      } else {
        TL.Input.update();
        TL.Input.takeTaps();
        TL.Input.consumeDash();
      }

      G.render(B, post, rt);
      TL.HUD.update(G);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
