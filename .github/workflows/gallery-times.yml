name: Refresh case commit timestamps
on:
  push:
    branches: [main]
    paths:
      - 'codex/**'
      - 'workbuddy/**'
      - 'zcode/**'
      - 'trae/**'
      - 'gallery.json'
      - 'tools/update_gallery_times.py'
      - '.github/workflows/gallery-times.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: gallery-case-timestamps
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh timestamps without cloning the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, json, os, sys, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          revision = os.environ['GITHUB_SHA']
          url = 'https://api.github.com/repos/' + repository + '/contents/tools/update_gallery_times.py?ref=' + revision
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'User-Agent': 'GoodCase-timestamps',
              'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=45) as response:
              script = base64.b64decode(json.load(response)['content']).decode('utf-8')
          sys.argv = ['update_gallery_times.py', '--publish']
          exec(compile(script, 'tools/update_gallery_times.py', 'exec'), {'__name__': '__main__'})
