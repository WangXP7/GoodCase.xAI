<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 所有空间单位为米。静态构件与窗灯实例化；水面低分辨率反射每四帧更新。
const $=id=>document.getElementById(id), TAU=Math.PI*2;

const scene=new THREE.Scene();scene.background=new THREE.Color('#091923');scene.fog=new THREE.FogExp2('#102630',.00315);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.12,1400);camera.position.set(-188,135,-295);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
renderer.info.autoReset=false;$('world').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(4,35,43);controls.enableDamping=true;controls.dampingFactor=.065;controls.minDistance=22;controls.maxDistance=480;controls.maxPolarAngle=Math.PI*.485;controls.minPolarAngle=.18;controls.enablePan=true;controls.autoRotate=false;
scene.add(new THREE.HemisphereLight('#a8c7de','#19291e',2.05));
const moonlight=new THREE.DirectionalLight('#87b9d4',2.2);moonlight.position.set(-70,160,-80);scene.add(moonlight);
const warmFill=new THREE.DirectionalLight('#e4a36a',.8);warmFill.position.set(0,30,-60);scene.add(warmFill);

// 一个材质批次一次 draw call，重复构件共享单位立方体。
const cube=new THREE.BoxGeometry(1,1,1), temp=new THREE.Object3D(), batches=new Map();
const materials={
 stone:new THREE.MeshStandardMaterial({color:'#30433c',roughness:1}),
 concrete:new THREE.MeshStandardMaterial({color:'#83918c',roughness:.85}),
 road:new THREE.MeshStandardMaterial({color:'#263638',roughness:.92}),
 steel:new THREE.MeshStandardMaterial({color:'#819496',metalness:.45,roughness:.48}),
 wood:new THREE.MeshStandardMaterial({color:'#503023',roughness:.95}),
 ochre:new THREE.MeshStandardMaterial({color:'#aa6235',roughness:.8}),
 roof:new THREE.MeshStandardMaterial({color:'#253e3e',roughness:.85}),
 red:new THREE.MeshStandardMaterial({color:'#8b3634',roughness:.6}),
 gold:new THREE.MeshBasicMaterial({color:new THREE.Color('#ffbc59').multiplyScalar(1.55)}),
 soft:new THREE.MeshBasicMaterial({color:'#f7dca3'}),

};
function box(key,x,y,z,w,h,d,ry=0,rz=0){if(!batches.has(key))batches.set(key,[]);batches.get(key).push([x,y,z,w,h,d,ry,rz]);}
function beam(key,a,b,width=.3,depth=width){const v=new THREE.Vector3().subVectors(b,a),o=new THREE.Object3D();o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());o.scale.set(width,v.length(),depth);o.updateMatrix();if(!batches.has(key))batches.set(key,[]);batches.get(key).push(o.matrix.clone());}
function flush(){for(const [key,items] of batches){const m=new THREE.InstancedMesh(cube,materials[key],items.length);m.name='static-'+key;for(let i=0;i<items.length;i++){const a=items[i];if(a.isMatrix4)m.setMatrixAt(i,a);else{temp.position.set(a[0],a[1],a[2]);temp.rotation.set(0,a[6],a[7]);temp.scale.set(a[3],a[4],a[5]);temp.updateMatrix();m.setMatrixAt(i,temp.matrix);}}m.computeBoundingSphere();scene.add(m);}batches.clear();}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

// 陡坡地形和层层挡土墙。
function height(x,z){return 3+Math.max(0,z-17)*.48+Math.sin(x*.022)*3+Math.sin(z*.05+x*.011)*2;}
function terrain(z0,z1,far=false){const g=new THREE.PlaneGeometry(600,z1-z0,65,38);g.rotateX(-Math.PI/2);g.translate(0,0,(z0+z1)/2);const p=g.attributes.position,colors=[];for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);const y=far?3+(-z-87)*.2+Math.sin(x*.03)*3:height(x,z);p.setY(i,y);const c=new THREE.Color().setHSL(.39,.13,between(.085,.145));colors.push(c.r,c.g,c.b);}g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})));}
terrain(18,290);terrain(-260,-91,true);
for(const z of [20,49,76,105,137]){const y=height(0,z);box('stone',0,y-3,z,420,6,2);box('road',0,y+.08,z+1,420,.45,6);for(let x=-203;x<207;x+=13)box('soft',x,y+.34,z+1,5,.025,.13);for(let x=-200;x<208;x+=20){box('steel',x,y+2.5,z-2,.13,5,.13);box('gold',x,y+5,z-2,.65,.2,.45);}}

// 程序化外墙：每个窗格有确定的随机明暗和色温，无贴图。
const buildingData=[];
function building(x,y,z,w,h,d,tone=0){buildingData.push({x,y:y+h*.5,z,w,h,d,tone,seed:rand()*1000});}
const facadeMat=new THREE.ShaderMaterial({
 uniforms:{uFogColor:{value:scene.fog.color},uFogDensity:{value:scene.fog.density}},
 vertexShader:`attribute vec3 aSize;attribute float aSeed;attribute float aTone;varying vec3 vP;varying vec3 vN;varying float vSeed;varying float vTone;varying float vDepth;void main(){vP=position*aSize;vN=normal;vSeed=aSeed;vTone=aTone;vec4 p=modelViewMatrix*instanceMatrix*vec4(position,1.);vDepth=-p.z;gl_Position=projectionMatrix*p;}`,
 fragmentShader:`uniform vec3 uFogColor;uniform float uFogDensity;varying vec3 vP;varying vec3 vN;varying float vSeed;varying float vTone;varying float vDepth;
 float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7))+vSeed)*43758.5453);}void main(){vec2 uv=vec2(abs(vN.z)>.5?vP.x:vP.z,vP.y);uv+=vec2(vSeed,0.);vec2 cell=floor(uv/vec2(2.4,3.15));vec2 f=fract(uv/vec2(2.4,3.15));float pane=step(.25,f.x)*step(f.x,.76)*step(.23,f.y)*step(f.y,.76)*(1.-step(.5,abs(vN.y)));float lit=step(.34,hash(cell));float stripes=1.-step(.055,fract((vP.y+.35)/3.15));vec3 wall=mix(vec3(.085,.14,.16),vec3(.19,.205,.19),vTone);wall*=.64+max(0.,dot(vN,normalize(vec3(-.4,.8,-.7))))*.65;wall*=1.-stripes*.24;vec3 warm=mix(vec3(1.6,.58,.16),vec3(1.5,1.22,.65),hash(cell+3.));if(hash(cell+18.)>.91)warm=vec3(.33,.83,1.);vec3 col=mix(wall,mix(vec3(.035,.09,.12),warm,lit),pane);float fog=1.-exp(-uFogDensity*uFogDensity*vDepth*vDepth);gl_FragColor=vec4(mix(col,uFogColor,fog),1.);

 #include <colorspace_fragment>
 }`
});
for(let row=0;row<6;row++){const z=39+row*24;for(let col=0;col<18;col++){const x=-208+col*25+between(-5,5);if(row<2&&Math.abs(x+25)<28)continue;if(Math.abs(x+25)<10)continue;if(row===0&&x>15&&x<82)continue;const zz=z+between(-3,3),y=height(x,zz),h=between(15,53)+(row>2?between(0,20):0);building(x,y,zz,between(10,18),h,between(10,17),rand());if(rand()>.55)box('concrete',x,y+h+1,zz,5,2,5);}}
for(let i=0;i<24;i++){let x=-245+i*21,z=between(-156,-113),y=3+(-z-87)*.2+Math.sin(x*.03)*3;building(x,y,z,between(8,13),between(7,20),between(9,14),rand());}

// 地标天际线：双塔、退台塔冠、楼顶青色轮廓。
for(const x of [58,84]){building(x,height(x,150),150,18,93,17,.45);const top=height(x,150)+93;box('cyan',x,top,141.4,18,.25,.25);box('cyan',x-9,top-42,141.4,.22,84,.22);box('steel',x,top+5,150,.35,10,.35);}box('concrete',71,142,150,42,7,15);box('gold',71,138.5,142.4,42,.3,.3);

// 轻轨路径：前侧直线准确穿过居民楼，后侧曲线形成连续闭环。
const route=new THREE.CatmullRomCurve3([V(-155,30,34),V(-102,30,34),V(-57,30,34),V(-25,30,34),V(18,30,34),V(76,32,37),V(126,41,56),V(138,54,90),V(95,62,112),V(0,60,112),V(-106,55,100),V(-155,37,63)],true,'centripetal');

const clearanceSamples=Array.from({length:900},(_,i)=>route.getPointAt(i/900));
for(let i=buildingData.length-1;i>=0;i--){const b=buildingData[i];if(clearanceSamples.some(p=>Math.abs(p.x-b.x)<b.w/2+3&&Math.abs(p.z-b.z)<b.d/2+3&&p.y+4>b.y-b.h/2&&p.y-1<b.y+b.h/2))buildingData.splice(i,1);}
function pathTube(curve,r,mat,segments=300){const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,r,5,false),mat);scene.add(mesh);return mesh;}

for(const offset of [-.84,.84]){const pts=Array.from({length:501},(_,i)=>{const t=i/500,p=route.getPointAt(t),d=route.getTangentAt(t);return p.add(V(d.z,0,-d.x).normalize().multiplyScalar(offset)).add(V(0,.2,0));});pathTube(new THREE.CatmullRomCurve3(pts),.095,materials.steel,500);}
for(let i=0;i<88;i++){const t=i/88,p=route.getPointAt(t),d=route.getTangentAt(t);if(p.x>-40&&p.x<-10&&p.z<43)continue;let y=height(p.x,p.z);box('concrete',p.x,(y+p.y-1)/2,p.z,1.25,Math.max(1,p.y-y-1),1.25);box('concrete',p.x,p.y-1.6,p.z,1.5,.7,4.3,Math.atan2(-d.z,d.x));}

// 真正中空的穿楼居民楼：底部、上部和两侧墙分别建模，无遮挡的 X 向通道。
const tunnel={x:-25,z:34,minX:-38,maxX:-12,floor:29.55,ceiling:37.8,halfWidth:3.85};

box('concrete',-25,29.1,34,27,.5,19);box('concrete',-25,37.85,34,27,.45,19);
for(const xx of [-38.35,-11.65]){box('gold',xx,37.5,34,.22,.18,8.3);for(const zz of [30,38]){box('gold',xx,33.6,zz,.2,7.8,.17);box('concrete',xx,33.6,zz,.7,8.4,.7);}}
for(let xx=-36;xx<-12;xx+=3.8){box('soft',xx,37.4,34,1.1,.1,1.1);for(const zz of [30.1,37.9]){box('gold',xx,31.35,zz,1.3,.24,.08);box('concrete',xx,33.6,zz,.32,7.4,.35);}}
const tunnelLight=new THREE.PointLight('#ffcc88',38,22,1.8);tunnelLight.position.set(-25,34.5,34);scene.add(tunnelLight);

// 同一栋楼：一楼接低路，顶楼接高路。两条路相差 68 米。
box('road',-25,11.3,20,91,.7,6);box('concrete',-25,10.7,20,91,.8,7);
box('road',-25,11.3,24,5,.7,4);
box('road',-25,80.4,89,6,.65,120);box('concrete',-25,79.8,89,7,.65,120);
for(const z of [58,88,118,146]){let ground=height(-25,z);box('concrete',-25,(ground+79.5)/2,z,1.1,79.5-ground,1.1);}
for(let z=39;z<147;z+=10){box('soft',-25,80.75,z,.16,.03,3.5);for(const x of [-28.35,-21.65])box('cyan',x,81.3,z,.12,.12,8);}
for(let x=-65;x<20;x+=10)box('soft',x,11.68,20,4,.03,.12);
box('gold',-25,12.8,24.35,5,2,.12);box('cyan',-25,82,26,9,2,.15);

const roofGeo=new THREE.BufferGeometry();roofGeo.setAttribute('position',new THREE.Float32BufferAttribute([- .57,0,-.55,.57,0,-.55,0,.24,-.55, -.57,0,.55,0,.24,.55,.57,0,.55, -.57,0,-.55,0,.24,-.55,0,.24,.55, -.57,0,-.55,0,.24,.55,-.57,0,.55, .57,0,-.55,.57,0,.55,0,.24,.55, .57,0,-.55,0,.24,.55,0,.24,-.55],3));roofGeo.computeVertexNormals();

const train=updateTrain();if(!riding){if(transition){let k=Math.min((now-transition.start)/1600,1);k=k*k*(3-2*k);camera.position.lerpVectors(transition.from,transition.to,k);controls.target.lerpVectors(transition.fromTarget,transition.toTarget,k);if(k===1)transition=null;}controls.update();}
camera.updateMatrixWorld();renderer.info.reset();if(frame%4===0)renderReflection();renderer.render(scene,camera);frame++;sampleFrames++;
if(now-sampleStart>=1400){reportedFps=Math.round(sampleFrames*1000/(now-sampleStart));$('fps').textContent=reportedFps+' FPS';sampleStart=now;sampleFrames=0;
// 帧率持续不足时才下调分辨率，保留所有玩法及几何。不同硬件实际帧率可见右上角。
if(reportedFps<53&&now-lastQualityChange>5500&&quality>.55){quality=Math.max(.55,quality-.15);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)*quality);lastQualityChange=now;}
else if(reportedFps>59&&quality<1&&now-lastQualityChange>15000){quality=Math.min(1,quality+.1);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)*quality);lastQualityChange=now;}}
// 只读诊断用于实际检查几何与性能，不影响交互。
window.__nightCity={fps:reportedFps,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,riding,paused,fogEnabled,quality,time,trainT:train.headT,trainPosition:train.head.toArray(),inTunnel:train.inTunnel,buildingCount:buildingData.length,tunnel,routeLength,cameraPosition:camera.position.toArray()};
}
updateTrain();updateTraffic(0);controls.update();renderReflection();renderer.render(scene,camera);requestAnimationFrame(animate);
$('loading').style.opacity=0;setTimeout(()=>$('loading').style.display='none',900);
</script>
